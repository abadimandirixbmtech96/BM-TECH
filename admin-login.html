<!-- Anti-clickjacking: halaman disembunyikan sampai terbukti tidak berada di dalam iframe -->
<style id="antiClickjack">html{display:none!important}</style>
<noscript><style>html{display:block!important}</style></noscript>
<script>
  (function(){
    if (window.top === window.self) {
      var s = document.getElementById("antiClickjack");
      if (s && s.parentNode) { s.parentNode.removeChild(s); }
    } else {
      try { window.top.location.href = window.self.location.href; } catch (e) {}
    }
  })();
</script>

<style>

/* =========================
   RESET
========================= */

*,
*::before,
*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;

  /* Hilangkan highlight biru saat disentuh/diklik (mobile & desktop) */
  -webkit-tap-highlight-color:transparent;
}

html{
  width:100%;
  height:100%;
  -webkit-text-size-adjust:100%;
  -moz-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  width:100%;
  height:100%;
}


/* =========================
   ROOT
========================= */

:root{
  --text:#292825;
  --muted:#77736c;
  --label:#55524c;
  --background:#f5f4f1;
  --card:rgba(218,216,210,.78);
  --input:rgba(248,247,244,.82);
  --border:rgba(170,168,161,.42);
  --button:#e7e5e0;
  --button-text:#77736d;
  --green:#5f8f68;
  --green-dark:#527d5a;
  --focus-ring:rgba(95,143,104,.55);
  --font-body:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Sora","Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --vh:100vh;
}

@supports (height:100dvh){
  :root{
    --vh:100dvh;
  }
}


/* =========================
   NO SELECT / NO HIGHLIGHT
   Teks dekoratif tidak bisa diblok; kolom isian tetap bisa diketik.
========================= */

html,
body{
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}

::selection{
  background:transparent;
  color:inherit;
}

::-moz-selection{
  background:transparent;
  color:inherit;
}

img,
svg{
  -webkit-user-drag:none;
  user-drag:none;
  -webkit-user-select:none;
  user-select:none;
  pointer-events:none;
}

.back-button svg,
.eye-button svg{
  pointer-events:none;
}

/* Kolom isian wajib bisa dipilih (Safari/iOS tidak mengizinkan mengetik jika none) */
.input{
  -webkit-user-select:text;
  -moz-user-select:text;
  -ms-user-select:text;
  user-select:text;
}

.input::selection{
  background:rgba(95,143,104,.22);
  color:inherit;
}

.input::-moz-selection{
  background:rgba(95,143,104,.22);
  color:inherit;
}

/* Hilangkan outline biru bawaan browser; ganti ring hijau halus hanya untuk keyboard */
button:focus,
input:focus{
  outline:none;
}

button:focus-visible{
  outline:2px solid var(--focus-ring);
  outline-offset:3px;
}


/* =========================
   BODY
========================= */

body{
  font-family:var(--font-body);

  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(255,255,255,.9),
      transparent 35%
    ),
    radial-gradient(
      circle at 95% 90%,
      rgba(226,223,216,.55),
      transparent 38%
    ),
    var(--background);

  overflow:hidden;

  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}


/* =========================
   SUBTLE LIQUID GLASS
========================= */

body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  filter:blur(55px);
  pointer-events:none;
  z-index:0;
}

body::before{
  width:380px;
  height:380px;
  top:-210px;
  right:-170px;
}

body::after{
  width:330px;
  height:330px;
  bottom:-190px;
  left:-150px;
}


/* =========================
   PAGE
========================= */

.page{
  width:100%;
  max-width:460px;

  height:100vh;
  height:var(--vh);

  margin:0 auto;

  padding-top:calc(clamp(10px, calc(var(--vh) * .024), 24px) + env(safe-area-inset-top, 0px));
  padding-right:calc(clamp(14px, 5vw, 20px) + env(safe-area-inset-right, 0px));
  padding-bottom:calc(clamp(10px, calc(var(--vh) * .02), 30px) + env(safe-area-inset-bottom, 0px));
  padding-left:calc(clamp(14px, 5vw, 20px) + env(safe-area-inset-left, 0px));

  /* Normalnya pas satu layar. Scroll hanya muncul sebagai cadangan
     (mis. HP landscape sangat pendek atau keyboard terbuka). */
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;

  position:relative;
  z-index:1;

  display:flex;
  flex-direction:column;
}


.page::-webkit-scrollbar{
  display:none;
  width:0;
  height:0;
}


/* =========================
   BACK BUTTON
========================= */

.back-button{
  flex:0 0 auto;

  width:clamp(40px, calc(var(--vh) * .06), 48px);
  height:clamp(40px, calc(var(--vh) * .06), 48px);

  border-radius:16px;

  border:1px solid rgba(255,255,255,.9);

  background:rgba(232,230,225,.58);

  color:#5f5c56;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 8px 24px rgba(70,67,60,.08),
    inset 0 1px 3px rgba(255,255,255,.95);

  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);

  -webkit-appearance:none;
  appearance:none;

  transition:
    transform .2s ease,
    background .2s ease;
}

.back-button:hover{
  background:rgba(245,243,239,.78);
}

.back-button:active{
  transform:scale(.94);
}

.back-button svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================
   CONTENT
   margin auto = otomatis di tengah layar tinggi,
   tetap bisa di-scroll di layar pendek tanpa terpotong
========================= */

.content{
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  margin-top:auto;
  margin-bottom:auto;

  padding-top:clamp(2px, calc(var(--vh) * .012), 32px);
  padding-bottom:0;
}


/* =========================
   LOGO
========================= */

.logo{
  width:clamp(48px, calc(var(--vh) * .095), 92px);
  height:clamp(48px, calc(var(--vh) * .095), 92px);
  flex:0 0 auto;

  border-radius:50%;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:clamp(10px, calc(var(--vh) * .028), 40px);

  background:rgba(255,255,255,.65);

  border:1px solid rgba(255,255,255,.92);

  box-shadow:
    0 15px 40px rgba(70,67,60,.09),
    inset 0 1px 4px rgba(255,255,255,.95);

  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* =========================
   LOGIN CARD
========================= */

.login-card{
  position:relative;
  width:100%;

  padding:clamp(16px, calc(var(--vh) * .036), 42px) clamp(18px, 6vw, 30px) clamp(14px, calc(var(--vh) * .028), 32px);

  border-radius:30px;

  background:var(--card);

  border:1px solid rgba(255,255,255,.86);

  box-shadow:
    0 22px 55px rgba(70,67,60,.10),
    inset 0 1px 3px rgba(255,255,255,.85);

  -webkit-backdrop-filter:blur(25px) saturate(105%);
  backdrop-filter:blur(25px) saturate(105%);
}

/* Browser lama tanpa backdrop-filter: pakai latar hampir solid agar tetap terbaca */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .login-card{
    background:rgba(228,226,221,.97);
  }
  .back-button{
    background:rgba(232,230,225,.95);
  }
  .logo{
    background:rgba(255,255,255,.9);
  }
}


/* =========================
   TITLE
========================= */

.title{
  text-align:center;
  margin-bottom:clamp(10px, calc(var(--vh) * .028), 36px);
}

.title h1{
  font-family:var(--font-display);
  font-size:clamp(21px, calc(var(--vh) * .038), 29px);
  line-height:1.25;
  font-weight:700;
  letter-spacing:-.6px;
  color:#292825;
  overflow-wrap:anywhere;
}

.title p{
  margin-top:clamp(4px, calc(var(--vh) * .01), 11px);
  font-size:clamp(13px, calc(var(--vh) * .022), 15px);
  line-height:1.5;
  font-weight:400;
  color:#817d76;
}


/* =========================
   FORM & FIELD
========================= */

.form{
  width:100%;
}

.field{
  margin-bottom:clamp(10px, calc(var(--vh) * .022), 22px);
}

.field label{
  display:block;
  margin:0 0 clamp(4px, calc(var(--vh) * .009), 10px) 4px;
  font-size:clamp(13px, calc(var(--vh) * .021), 15px);
  line-height:1.4;
  font-weight:600;
  color:var(--label);
}


/* =========================
   INPUT
========================= */

.input{
  width:100%;
  height:clamp(44px, calc(var(--vh) * .066), 64px);

  padding:0 18px;

  border:1px solid var(--border);
  border-radius:18px;

  background:var(--input);

  color:#292825;
  caret-color:#292825;

  font-family:inherit;
  font-size:16px; /* minimal 16px agar iOS tidak zoom otomatis */
  font-weight:500;

  -webkit-appearance:none;
  -moz-appearance:none;
  appearance:none;

  transition:
    border .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.input::placeholder{
  color:#aaa69f;
  font-weight:400;
}

.input:focus{
  border-color:rgba(100,96,88,.5);
  background:rgba(255,255,253,.9);
  box-shadow:0 0 0 4px rgba(100,96,88,.055);
}

/* Hilangkan warna biru/kuning autofill browser */
.input:-webkit-autofill,
.input:-webkit-autofill:hover,
.input:-webkit-autofill:focus,
.input:-webkit-autofill:active{
  -webkit-text-fill-color:#292825;
  caret-color:#292825;
  -webkit-box-shadow:0 0 0 1000px #f8f7f4 inset;
  box-shadow:0 0 0 1000px #f8f7f4 inset;
  border-color:var(--border);
  transition:background-color 99999s ease-in-out 0s;
}

.input:autofill{
  -webkit-text-fill-color:#292825;
  box-shadow:0 0 0 1000px #f8f7f4 inset;
}

/* Hilangkan ikon bawaan Edge/IE pada kolom password */
.input::-ms-reveal,
.input::-ms-clear{
  display:none;
}


/* =========================
   PASSWORD
========================= */

.password-box{
  width:100%;
  position:relative;
}

.password-box .input{
  padding-right:58px;
}

.eye-button{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);

  width:40px;
  height:40px;

  border:0;
  background:transparent;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#858078;

  cursor:pointer;

  -webkit-appearance:none;
  appearance:none;
}

.eye-button svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.eye-button .icon-hide{
  display:none;
}

.eye-button[data-visible="true"] .icon-show{
  display:none;
}

.eye-button[data-visible="true"] .icon-hide{
  display:block;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-button{
  width:100%;
  height:clamp(46px, calc(var(--vh) * .068), 61px);

  margin-top:4px;

  border-radius:18px;

  border:1px solid rgba(255,255,255,.88);

  background:var(--button);

  color:var(--button-text);

  font-family:var(--font-display);
  font-size:16px;
  font-weight:600;
  letter-spacing:.2px;

  cursor:not-allowed;

  -webkit-appearance:none;
  appearance:none;

  box-shadow:
    0 7px 20px rgba(70,67,60,.07),
    inset 0 1px 3px rgba(255,255,255,.9);

  transition:
    background .25s ease,
    color .25s ease,
    box-shadow .25s ease,
    transform .2s ease;
}


/* =========================
   ACTIVE BUTTON
========================= */

.login-button.active{
  background:var(--green);
  color:#fff;
  cursor:pointer;
  border-color:rgba(255,255,255,.45);

  box-shadow:
    0 10px 25px rgba(76,115,83,.18),
    inset 0 1px 2px rgba(255,255,255,.28);
}

.login-button.active:hover{
  background:var(--green-dark);
}

.login-button.active:active{
  transform:scale(.985);
}

.login-button:disabled{
  cursor:progress;
  opacity:.8;
}


/* =========================
   STATUS
========================= */

.status{
  min-height:20px;
  margin-top:clamp(6px, calc(var(--vh) * .012), 16px);
  text-align:center;
  font-size:13px;
  line-height:1.5;
  font-weight:500;
  color:#858078;
  overflow-wrap:anywhere;
}

.status.error{
  color:#a85f5a;
}

.status.success{
  color:#5f8f68;
}


/* =========================
   ACCESS
========================= */

.access{
  margin-top:clamp(8px, calc(var(--vh) * .02), 26px);
  padding-top:clamp(8px, calc(var(--vh) * .016), 21px);
  border-top:1px solid rgba(110,106,98,.15);
  text-align:center;
  font-size:12px;
  line-height:1.5;
  font-weight:400;
  color:#918c84;
}


/* =========================
   FOOTER
========================= */

.footer{
  margin-top:clamp(10px, calc(var(--vh) * .02), 25px);
  text-align:center;
  font-size:12px;
  font-weight:400;
  color:#99938b;
}

.noscript-msg{
  padding:24px;
  text-align:center;
  font-size:15px;
  color:#a85f5a;
}


/* =========================
   VERIFICATION OVERLAY (animasi 3D)
========================= */

.verify{
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  left:0;
  z-index:5;

  border-radius:inherit;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:20px;
  text-align:center;

  background:rgba(236,235,231,.94);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:
    opacity .35s ease,
    visibility 0s linear .35s;
}

.verify.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;

  transition:
    opacity .35s ease,
    visibility 0s;
}

.scene{
  --orb:clamp(78px, calc(var(--vh) * .16), 118px);

  position:relative;
  width:var(--orb);
  height:var(--orb);

  -webkit-perspective:520px;
  perspective:520px;

  margin-bottom:clamp(14px, calc(var(--vh) * .03), 26px);
}

.ring{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;

  border-radius:50%;
  border:3px solid transparent;
  border-top-color:var(--green);
  border-right-color:rgba(95,143,104,.55);
  border-bottom-color:rgba(95,143,104,.16);

  transition:opacity .4s ease;
  will-change:transform;
}

.ring.r1{
  animation:spin1 1.9s linear infinite;
}

.ring.r2{
  width:78%;
  height:78%;
  top:11%;
  left:11%;
  border-top-color:#7fae88;
  border-right-color:rgba(127,174,136,.5);
  animation:spin2 1.45s linear infinite;
}

.ring.r3{
  width:56%;
  height:56%;
  top:22%;
  left:22%;
  border-top-color:#a8cfb0;
  border-right-color:rgba(168,207,176,.5);
  animation:spin3 1.1s linear infinite;
}

@keyframes spin1{
  from{ transform:rotateX(68deg) rotateZ(0deg); }
  to{ transform:rotateX(68deg) rotateZ(360deg); }
}

@keyframes spin2{
  from{ transform:rotateY(68deg) rotateZ(0deg); }
  to{ transform:rotateY(68deg) rotateZ(-360deg); }
}

@keyframes spin3{
  from{ transform:rotateX(42deg) rotateY(-42deg) rotateZ(0deg); }
  to{ transform:rotateX(42deg) rotateY(-42deg) rotateZ(360deg); }
}

.core{
  position:absolute;
  top:50%;
  left:50%;
  width:34%;
  height:34%;
  margin:-17% 0 0 -17%;

  border-radius:50%;

  background:radial-gradient(
    circle at 32% 28%,
    #cfe8d4 0,
    #7fae88 38%,
    #5f8f68 68%,
    #44714c 100%
  );

  box-shadow:
    0 0 22px rgba(95,143,104,.45),
    inset 0 -4px 8px rgba(40,70,48,.25);

  display:flex;
  align-items:center;
  justify-content:center;

  animation:breathe 1.7s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{ transform:scale(.88); }
  50%{ transform:scale(1.1); }
}

.core svg{
  width:62%;
  height:62%;
  fill:none;
  stroke:#fff;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:0;
}

.core svg path{
  stroke-dasharray:30;
  stroke-dashoffset:30;
}

.verify-title{
  font-family:var(--font-display);
  font-size:clamp(15px, calc(var(--vh) * .022), 17px);
  font-weight:600;
  letter-spacing:-.2px;
  color:#292825;
}

.verify-sub{
  margin-top:6px;
  min-height:20px;
  font-size:13px;
  font-weight:500;
  color:#817d76;
}

.verify-sub.swap{
  animation:fadeUp .35s ease both;
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(5px); }
  to{ opacity:1; transform:none; }
}

.dots i{
  display:inline-block;
  width:4px;
  height:4px;
  margin-left:3px;
  border-radius:50%;
  background:currentColor;
  vertical-align:middle;
  animation:dot 1.1s ease-in-out infinite;
}

.dots i:nth-child(2){ animation-delay:.15s; }
.dots i:nth-child(3){ animation-delay:.3s; }

@keyframes dot{
  0%,80%,100%{ opacity:.25; transform:translateY(0); }
  40%{ opacity:1; transform:translateY(-3px); }
}

/* Berhasil */

.verify.done .ring{
  opacity:0;
  animation-play-state:paused;
}

.verify.done .core{
  animation:pop .55s cubic-bezier(.2,1.4,.4,1) forwards;
}

.verify.done .core svg{
  opacity:1;
}

.verify.done .core svg path{
  animation:draw .45s .25s ease forwards;
}

.verify.done .dots{
  display:none;
}

@keyframes pop{
  0%{ transform:scale(.9); }
  60%{ transform:scale(1.5); }
  100%{ transform:scale(1.35); }
}

@keyframes draw{
  to{ stroke-dashoffset:0; }
}

/* Gagal: kartu bergetar halus */

.login-card.shake{
  animation:shake .45s cubic-bezier(.36,.07,.19,.97);
}

@keyframes shake{
  10%,90%{ transform:translateX(-2px); }
  20%,80%{ transform:translateX(4px); }
  30%,50%,70%{ transform:translateX(-7px); }
  40%,60%{ transform:translateX(7px); }
}


/* =========================
   RESPONSIVE — LAYAR SEMPIT
   (tinggi sudah diatur otomatis lewat clamp + dvh)
========================= */

@media (max-width:380px){

  .page{

<script>
"use strict";

/* ==========================================
   KONFIGURASI
   Anon key memang publik by design; keamanan data
   bergantung pada Row Level Security (RLS) dan is_admin() di Supabase.
========================================== */

var SUPABASE_URL      = "https://zgzmbneqqzxnptbmlhsz.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpnem1ibmVxcXp4bnB0Ym1saHN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTU0ODksImV4cCI6MjEwMzM3MTQ4OX0.MQOtu5Pg2PtxIu18joKDd0dOA17cPEazmlL0Xl3Vz7E";

var DASHBOARD_URL  = "dashboard-admin.html";
var BACK_URL       = "https://dashboard-bm-tech.vercel.app/";

var EMAIL_MAX      = 254;
var PASSWORD_MAX   = 72;      /* batas aman bcrypt di Supabase */
var REQUEST_TIMEOUT_MS = 15000;
var MIN_VERIFY_MS      = 1100;   /* animasi verifikasi tampil minimal ini agar tidak berkedip */

var MAX_FAILS_BEFORE_LOCK = 5;
var BASE_LOCK_SECONDS     = 30;
var MAX_LOCK_SECONDS      = 900;
var GUARD_KEY             = "bmtech-login-guard";


/* ==========================================
   PENYIMPANAN AMAN
   Jika localStorage diblokir (mis. mode privat Safari),
   pakai memori sementara agar login tetap jalan.
========================================== */

var safeStorage = (function(){

  try{
    var testKey = "__bm_test__";
    window.localStorage.setItem(testKey, "1");
    window.localStorage.removeItem(testKey);
    return window.localStorage;
  }catch(e){

    var mem = {};

    return {
      getItem:function(k){ return Object.prototype.hasOwnProperty.call(mem,k) ? mem[k] : null; },
      setItem:function(k,v){ mem[k] = String(v); },
      removeItem:function(k){ delete mem[k]; }
    };

  }

})();


/* ==========================================
   SUPABASE CLIENT
========================================== */

var supabaseClient = null;

try{

  if(window.supabase && typeof window.supabase.createClient === "function"){

    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false,   /* jangan baca token dari URL di halaman login */
        storage:safeStorage,
        storageKey:"bmtech-auth"    /* sama di semua halaman agar sesi terbaca */
      }
    });

  }

}catch(e){
  supabaseClient = null;
}


/* ==========================================
   ELEMENTS
========================================== */

var form          = document.getElementById("loginForm");
var emailInput    = document.getElementById("email");
var passwordInput = document.getElementById("password");
var eyeButton     = document.getElementById("eyeButton");
var loginButton   = document.getElementById("loginButton");
var statusBox     = document.getElementById("status");
var backButton    = document.getElementById("backButton");
var loginCard     = document.querySelector(".login-card");
var verifyBox     = document.getElementById("verify");
var verifyTitle   = document.getElementById("verifyTitle");
var verifyStep    = document.getElementById("verifyStep");

var attemptStartedAt = 0;

var isSubmitting  = false;
var lockTimer     = null;


/* ==========================================
   ANTI KLIK KANAN, DRAG, DAN BLOK TEKS
   Catatan: ini hanya kosmetik, bukan perlindungan keamanan.
   Di perangkat sentuh, menu tahan-lama pada kolom isian tetap
   dibiarkan agar fungsi tempel (paste) tidak rusak.
========================================== */

var isTouchOnly = false;

try{
  isTouchOnly = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
}catch(e){}

document.addEventListener("contextmenu", function(event){

  var t = event.target;
  var inField = t && t.tagName === "INPUT";

  if(isTouchOnly && inField){
    return;
  }

  event.preventDefault();

}, false);

document.addEventListener("dragstart", function(event){
  event.preventDefault();
}, false);

document.addEventListener("selectstart", function(event){

  var t = event.target;

  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")){
    return;
  }

  event.preventDefault();

}, false);


/* ==========================================
   VALIDASI & SANITASI INPUT
========================================== */

/* Hanya karakter email yang sah. Tanda kutip, spasi, titik koma,
   tanda lebih/kurang, garis miring, dsb. otomatis dibuang. */

var EMAIL_ALLOWED_CHARS = /[^A-Za-z0-9@._%+\-]/g;

var EMAIL_PATTERN = /^[A-Za-z0-9._%+\-]{1,64}@[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?)+$/;

var CONTROL_CHARS = /[\u0000-\u001F\u007F-\u009F\u2028\u2029\u200B-\u200F\uFEFF]/;

function sanitizeEmail(value){

  var v = String(value);

  try{
    v = v.normalize("NFKC");   /* huruf lebar penuh -> ASCII biasa */
  }catch(e){}

  return v
    .replace(EMAIL_ALLOWED_CHARS, "")
    .slice(0, EMAIL_MAX);

}

function isValidEmail(email){

  if(typeof email !== "string"){ return false; }
  if(email.length < 6 || email.length > EMAIL_MAX){ return false; }
  if(email.indexOf("..") !== -1){ return false; }

  return EMAIL_PATTERN.test(email);

}

function isValidPassword(password){

  if(typeof password !== "string"){ return false; }
  if(password.length < 1 || password.length > PASSWORD_MAX){ return false; }
  if(CONTROL_CHARS.test(password)){ return false; }

  return true;

}

/* Bersihkan kolom email saat mengetik / menempel, jaga posisi kursor */

var composing = false;

function cleanEmailField(){

  if(composing){ return; }

  var before = emailInput.value;
  var clean  = sanitizeEmail(before);

  if(clean === before){ return; }

  var pos = emailInput.selectionStart;
  var removed = before.length - clean.length;

  emailInput.value = clean;

  try{
    if(typeof pos === "number"){
      var np = Math.max(0, pos - removed);
      emailInput.setSelectionRange(np, np);
    }
  }catch(e){}

}

emailInput.addEventListener("compositionstart", function(){ composing = true; });

emailInput.addEventListener("compositionend", function(){
  composing = false;
  cleanEmailField();
  updateLoginButton();
});

emailInput.addEventListener("input", function(){
  cleanEmailField();
  updateLoginButton();
});

emailInput.addEventListener("blur", function(){
  cleanEmailField();
});

passwordInput.addEventListener("input", function(){
  updateLoginButton();
});


/* ==========================================
   STATUS HELPERS
========================================== */

function setStatus(message, type){

  statusBox.className = "status" + (type ? " " + type : "");
  statusBox.textContent = message || "";

}

function setButtonReady(){

  var email    = emailInput.value;
  var password = passwordInput.value;
  var ready    = !!email && password.length > 0 && !isLocked() && !isSubmitting;

  if(ready){
    loginButton.classList.add("active");
    loginButton.setAttribute("aria-disabled", "false");
  }else{
    loginButton.classList.remove("active");
    loginButton.setAttribute("aria-disabled", "true");
  }

}

function updateLoginButton(){
  setButtonReady();
}


/* ==========================================
   PEMBATAS PERCOBAAN LOGIN (sisi browser)
   Hanya penghalang tambahan. Perlindungan brute-force
   yang sebenarnya harus aktif di Supabase Auth (rate limit / CAPTCHA).
========================================== */

function readGuard(){

  try{

    var raw = safeStorage.getItem(GUARD_KEY);

    if(!raw){ return { fails:0, until:0, level:0 }; }

    var g = JSON.parse(raw);

    return {
      fails: Number(g.fails) || 0,
      until: Number(g.until) || 0,
      level: Number(g.level) || 0
    };

  }catch(e){
    return { fails:0, until:0, level:0 };
  }

}

function writeGuard(g){

  try{
    safeStorage.setItem(GUARD_KEY, JSON.stringify(g));
  }catch(e){}

}

function clearGuard(){

  try{
    safeStorage.removeItem(GUARD_KEY);
  }catch(e){}

}

function secondsLeft(){

  var g = readGuard();
  var left = Math.ceil((g.until - Date.now()) / 1000);

  return left > 0 ? left : 0;

}

function isLocked(){
  return secondsLeft() > 0;
}

function registerFailure(){

  var g = readGuard();

  g.fails += 1;

  if(g.fails >= MAX_FAILS_BEFORE_LOCK){

    var seconds = Math.min(
      BASE_LOCK_SECONDS * Math.pow(2, g.level),
      MAX_LOCK_SECONDS
    );

    g.until = Date.now() + seconds * 1000;
    g.level += 1;
    g.fails = 0;

  }

  writeGuard(g);

}

function formatTime(total){

  var m = Math.floor(total / 60);
  var s = total % 60;

  return m + ":" + (s < 10 ? "0" : "") + s;

}

function startLockCountdown(){

  if(lockTimer){
    clearInterval(lockTimer);
    lockTimer = null;
  }

  function tick(){

    var left = secondsLeft();

    if(left <= 0){

      clearInterval(lockTimer);
      lockTimer = null;

      setStatus("", "");
      setButtonReady();

      return;

    }

    setStatus("Too many attempts. Try again in " + formatTime(left) + ".", "error");
    setButtonReady();

  }

  tick();

  if(secondsLeft() > 0){
    lockTimer = setInterval(tick, 1000);
  }

}


/* ==========================================
   BACK TO DASHBOARD
========================================== */

backButton.addEventListener("click", function(){

  window.location.href = BACK_URL;

});


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

function setPasswordVisible(visible){

  passwordInput.type = visible ? "text" : "password";

  eyeButton.setAttribute("data-visible", visible ? "true" : "false");
  eyeButton.setAttribute("aria-pressed", visible ? "true" : "false");
  eyeButton.setAttribute("aria-label", visible ? "Hide password" : "Show password");

}

eyeButton.addEventListener("click", function(){

  setPasswordVisible(passwordInput.type === "password");

});

/* Sembunyikan password lagi jika tab ditinggalkan */

document.addEventListener("visibilitychange", function(){

  if(document.hidden){
    setPasswordVisible(false);
  }

});

window.addEventListener("pagehide", function(){
  setPasswordVisible(false);
});


/* ==========================================
   ENTER DI KOLOM EMAIL -> PINDAH KE PASSWORD
========================================== */

emailInput.addEventListener("keydown", function(event){

  if(event.key === "Enter"){

    event.preventDefault();
    passwordInput.focus();

  }

});


/* ==========================================
   UTILITAS
========================================== */

function withTimeout(promise, ms){

  return new Promise(function(resolve, reject){

    var timer = setTimeout(function(){
      reject(new Error("timeout"));
    }, ms);

    promise.then(
      function(value){ clearTimeout(timer); resolve(value); },
      function(error){ clearTimeout(timer); reject(error); }
    );

  });

}

function setStep(text){

  var node = verifyStep.firstChild;

  if(node && node.nodeType === 3){
    node.nodeValue = text;
  }

  verifyStep.classList.remove("swap");
  void verifyStep.offsetWidth;
  verifyStep.classList.add("swap");

}

function showVerify(){

  verifyBox.classList.remove("done");
  verifyTitle.textContent = "Verifying access";
  setStep("Authenticating");

  /* Tutup keyboard agar animasi terlihat penuh */
  try{
    if(document.activeElement && document.activeElement.blur){
      document.activeElement.blur();
    }
  }catch(e){}

  form.setAttribute("inert", "");
  form.setAttribute("aria-busy", "true");

  verifyBox.classList.add("show");

}

function hideVerify(){

  verifyBox.classList.remove("show");

  form.removeAttribute("inert");
  form.removeAttribute("aria-busy");

  setTimeout(function(){
    if(!verifyBox.classList.contains("show")){
      verifyBox.classList.remove("done");
    }
  }, 450);

}

function markVerifyDone(){

  verifyTitle.textContent = "Access granted";
  setStep("Opening dashboard");

  verifyBox.classList.add("done");

}

function shakeCard(){

  loginCard.classList.remove("shake");
  void loginCard.offsetWidth;
  loginCard.classList.add("shake");

  setTimeout(function(){
    loginCard.classList.remove("shake");
  }, 600);

}

function remainingVerifyTime(){

  return Math.max(0, MIN_VERIFY_MS - (Date.now() - attemptStartedAt));

}

function finishAttempt(failed){

  setTimeout(function(){

    isSubmitting = false;
    loginButton.disabled = false;
    loginButton.textContent = "Login";

    hideVerify();
    setButtonReady();

    if(failed){

      shakeCard();

      if(!passwordInput.value){
        try{ passwordInput.focus(); }catch(e){}
      }

    }

  }, remainingVerifyTime());

}

function goToDashboard(){

  /* replace: halaman login tidak tersisa di riwayat tombol Back */
  window.location.replace(DASHBOARD_URL);

}


/* ==========================================
   LOGIN
========================================== */

async function login(){

  if(isSubmitting){ return; }

  if(!supabaseClient){

    setStatus("Unable to load the login service. Check your connection and reload.", "error");
    return;

  }

  if(isLocked()){

    startLockCountdown();
    return;

  }

  var email    = sanitizeEmail(emailInput.value).toLowerCase();
  var password = passwordInput.value;

  emailInput.value = email;

  if(!email || !password){
    return;
  }

  if(!isValidEmail(email)){

    setStatus("Please enter a valid email address.", "error");
    emailInput.focus();
    return;

  }

  if(!isValidPassword(password)){

    setStatus("Email or password is incorrect.", "error");
    passwordInput.value = "";
    updateLoginButton();
    passwordInput.focus();
    return;

  }


  /* Loading */

  isSubmitting = true;
  attemptStartedAt = Date.now();
  loginButton.disabled = true;
  loginButton.textContent = "Checking...";
  setButtonReady();
  setStatus("", "");
  showVerify();


  try{

    /* 1. Login ke Supabase Auth */

    var authResult = await withTimeout(
      supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      }),
      REQUEST_TIMEOUT_MS
    );

    if(authResult.error){

      var status = authResult.error.status;

      /* Gangguan server / jaringan: bukan salah password, jangan dihitung gagal */

      if(status && status >= 500){

        setStatus("Server is busy. Please try again shortly.", "error");

      }else if(status === 429){

        registerFailure();
        setStatus("Too many requests. Please wait a moment and try again.", "error");

      }else{

        registerFailure();

        setStatus("Email or password is incorrect.", "error");
        passwordInput.value = "";
        updateLoginButton();

      }

      finishAttempt(true);

      if(isLocked()){ startLockCountdown(); }

      return;

    }


    /* 2. Cek hak akses admin di server lewat is_admin() */

    setStep("Checking permissions");

    var adminResult = await withTimeout(
      supabaseClient.rpc("is_admin"),
      REQUEST_TIMEOUT_MS
    );

    if(adminResult.error){

      /* Gagal memverifikasi: jangan beri akses, tapi jangan salahkan password */

      try{ await supabaseClient.auth.signOut(); }catch(e){}

      setStatus("Unable to verify access. Please try again.", "error");
      finishAttempt(true);

      return;

    }

    if(adminResult.data !== true){

      /* Bukan admin: bersihkan sesi dan beri pesan yang sama
         dengan password salah agar akun valid tidak bisa ditebak */

      try{ await supabaseClient.auth.signOut(); }catch(e){}

      registerFailure();

      setStatus("Email or password is incorrect.", "error");
      passwordInput.value = "";
      updateLoginButton();
      finishAttempt(true);

      if(isLocked()){ startLockCountdown(); }

      return;

    }


    /* SUCCESS */

    clearGuard();

    passwordInput.value = "";

    /* isSubmitting sengaja dibiarkan true agar tidak bisa submit ulang */

    setTimeout(function(){

      markVerifyDone();
      setTimeout(goToDashboard, 1000);

    }, remainingVerifyTime());

  }catch(error){

    if(error && error.message === "timeout"){
      setStatus("The request took too long. Please try again.", "error");
    }else{
      setStatus("Network error. Check your connection and try again.", "error");
    }

    finishAttempt(true);

  }

}


/* Submit lewat tombol Login ATAU Enter di kolom password */

form.addEventListener("submit", function(event){

  event.preventDefault();
  login();

});


/* ==========================================
   CEK SESI YANG SUDAH ADA
   Jika sudah login sebagai admin, langsung ke dashboard.
   Sesi HANYA dihapus bila server memastikan akun bukan admin;
   gangguan jaringan tidak akan mengeluarkan pengguna.
========================================== */

(async function checkExistingSession(){

  if(!supabaseClient){
    return;
  }

  try{

    var sessionResult = await supabaseClient.auth.getSession();
    var session = sessionResult && sessionResult.data && sessionResult.data.session;

    if(!session){
      return;
    }

    var adminResult = await supabaseClient.rpc("is_admin");

    if(adminResult.error){
      return;   /* gagal cek (mis. offline): biarkan sesi, tampilkan form login */
    }

    if(adminResult.data === true){

      goToDashboard();

    }else{

      await supabaseClient.auth.signOut();

    }

  }catch(e){
    /* abaikan: form login tetap bisa dipakai */
  }

})();


/* ==========================================
   KEADAAN AWAL
========================================== */

if(!supabaseClient){
  setStatus("Unable to load the login service. Check your connection and reload.", "error");
}

if(isLocked()){
  startLockCountdown();
}

updateLoginButton();

</script>

<script>
  /* Minta browser tidak menghapus penyimpanan sesi saat memori perangkat menipis
     (penting untuk PWA iOS "Add to Home Screen"). Aman dipanggil berulang. */
  if (navigator.storage && navigator.storage.persist) {
