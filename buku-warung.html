<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a84ff">
<title>Buku Warung BM TECH</title>
<style>
:root{--bg:#eaf0fa;--tx:#0f172a;--mu:#64748b;--gl:rgba(255,255,255,.5);--gb:rgba(255,255,255,.65);--pn:rgba(255,255,255,.88);--ac:#0a84ff;--er:#ff453a;--sh:0 8px 32px rgba(31,41,80,.16)}
@media(prefers-color-scheme:dark){:root{--bg:#070b14;--tx:#f1f5f9;--mu:#94a3b8;--gl:rgba(44,52,78,.5);--gb:rgba(255,255,255,.14);--pn:rgba(22,28,46,.9);--sh:0 8px 32px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
body{margin:0;font:15px/1.4 -apple-system,"SF Pro Text",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.5}
body:before{width:320px;height:320px;background:#0a84ff;top:-80px;left:-80px}
body:after{width:300px;height:300px;background:#bf5af2;bottom:90px;right:-90px}
.g{background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.45)}
header,main{max-width:520px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 16px 4px}
h1{margin:0;font-size:28px}h3{margin:0 0 8px}h4{margin:18px 0 4px;color:var(--mu)}
.ib{width:42px;height:42px;border-radius:50%;color:var(--tx);font-size:20px;padding:0}
main{padding:8px 16px 130px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{padding:14px;border-radius:20px}.c small{display:block;color:var(--mu)}.c b{font-size:18px}
.card{padding:14px;border-radius:22px;margin-bottom:14px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;margin:8px 0}
.r small{display:block;color:var(--mu);font-size:12px}.rt{text-align:right}
.lw{color:var(--er)!important;font-weight:600}
.em{color:var(--mu);text-align:center;padding:20px}
.x{display:block;margin-top:2px;font-size:12px;color:var(--er);font-weight:600}
.bar{display:flex;gap:8px;margin-bottom:6px}.bar .in{margin:0}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0}
.in{width:100%;padding:12px 14px;margin-top:4px;border-radius:14px;border:1px solid var(--gb);background:rgba(127,127,127,.14);color:var(--tx);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bt{border:0;border-radius:14px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;font-size:15px;white-space:nowrap}
.full{width:100%;margin-top:12px}.dg{background:var(--er)}
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,440px);display:flex;padding:6px;border-radius:34px;z-index:20}
nav button{flex:1;position:relative;z-index:1;background:none;border:0;color:var(--mu);font-size:10px;font-weight:600;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ac)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav i{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:28px;background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 2px 12px rgba(0,0,0,.14);transform:translateX(calc(var(--i,0)*100%));transition:transform .4s cubic-bezier(.3,1.35,.5,1)}
#sh{position:fixed;inset:0;z-index:30;display:none}#sh.o{display:block}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;max-height:88vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--pn)}
#ts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);padding:10px 18px;border-radius:20px;z-index:40;transition:transform .3s;font-weight:600}
#ts.o{transform:translate(-50%,0)}
</style><script src="/bm-app.js"></script>
<script src="/bm-swipe-back.js"></script>
</head><body>
<header><h1 id="ttl"></h1><button class="ib g" data-a="st" aria-label="Pengaturan">&#9881;</button></header>
<main id="v"></main>
<nav id="nv" class="g"><i></i>
<button data-a="tab" data-i="0"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</button>
<button data-a="tab" data-i="1"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg>Barang</button>
<button data-a="tab" data-i="2"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5l5 5 5-5M4 21h16"/></svg>Masuk</button>
<button data-a="tab" data-i="3"><svg viewBox="0 0 24 24"><path d="M12 15V3m-5 5l5-5 5 5M4 21h16"/></svg>Keluar</button>
<button data-a="tab" data-i="4"><svg viewBox="0 0 24 24"><path d="M4 5h14a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2zM4 5v12M9 10h6"/></svg>Hutang</button>
</nav>
<div id="sh"></div><div id="ts" class="g"></div>
<script>
const $=s=>document.querySelector(s),K='bm_warung_v1';
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){D=null}
if(!D||!Array.isArray(D.items))D={items:[],moves:[],pays:[]};
let tab=0,q='',tt;
const save=()=>localStorage.setItem(K,JSON.stringify(D));
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const it=id=>D.items.find(x=>x.id===id);
const debtOf=()=>{const m={};D.moves.forEach(v=>{if(v.t==='out'&&!v.paid)m[v.who]=(m[v.who]||0)+v.q*v.p});D.pays.forEach(p=>{m[p.who]=(m[p.who]||0)-p.a});return Object.entries(m).filter(e=>e[1]>0.5).sort((a,b)=>b[1]-a[1])};
function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('o');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('o'),2300)}
function sheet(h){$('#sh').innerHTML='<div class="bk" data-a="x"></div><div class="pn">'+h+'</div>';$('#sh').classList.add('o')}
function closeS(){$('#sh').classList.remove('o')}
const opt=()=>D.items.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.stock} ${esc(x.unit)})</option>`).join('');
function hist(t){const a=D.moves.filter(v=>v.t===t).slice(-30).reverse();return '<h4>Riwayat</h4>'+(a.map(v=>`<div class="r g"><div><b>${esc(v.n)}</b><small>${v.d}${v.t==='out'?' · '+esc(v.who)+(v.paid?'':' · <i class="lw">HUTANG</i>'):''}${v.note?' · '+esc(v.note):''}</small></div><div class="rt"><b>${v.q} ${esc(v.u)}</b><small>${rp(v.q*v.p)}</small><a class="x" data-a="dm" data-id="${v.id}">Batalkan</a></div></div>`).join('')||'<p class="em">Belum ada transaksi.</p>')}
function vHome(){const t=today(),o=D.moves.filter(v=>v.t==='out'&&v.d===t),om=o.reduce((s,v)=>s+v.q*v.p,0),lb=o.reduce((s,v)=>s+v.q*(v.p-v.c),0),low=D.items.filter(x=>x.stock<=x.min),th=debtOf().reduce((s,x)=>s+x[1],0),nv=D.items.reduce((s,x)=>s+x.stock*x.buy,0);
return `<div class="grid"><div class="c g"><small>Omzet hari ini</small><b>${rp(om)}</b></div><div class="c g"><small>Laba hari ini</small><b>${rp(lb)}</b></div><div class="c g"><small>Total hutang</small><b class="lw">${rp(th)}</b></div><div class="c g"><small>Nilai stok</small><b>${rp(nv)}</b></div></div><h4>Stok menipis (${low.length})</h4>`+(low.map(x=>`<div class="r g"><b>${esc(x.name)}</b><b class="lw">${x.stock} ${esc(x.unit)}</b></div>`).join('')||'<p class="em">Semua stok aman.</p>')+'<h4>Transaksi terakhir</h4>'+(D.moves.slice(-5).reverse().map(v=>`<div class="r g"><div><b>${esc(v.n)}</b><small>${v.d} · ${v.t==='in'?'Masuk':'Keluar'}</small></div><b>${v.q} ${esc(v.u)}</b></div>`).join('')||'<p class="em">Belum ada transaksi.</p>')}
function vItems(){return `<div class="bar"><input id="q" class="in" placeholder="Cari barang..." value="${esc(q)}"><button class="bt" data-a="ni">+ Tambah</button></div><div id="lst"></div>`}
function list(){const s=q.toLowerCase(),a=D.items.filter(x=>(x.name+' '+x.cat).toLowerCase().includes(s)).sort((a,b)=>a.name.localeCompare(b.name));
$('#lst').innerHTML=a.map(x=>`<div class="r g" data-a="ei" data-id="${x.id}"><div><b>${esc(x.name)}</b><small>${esc(x.cat||'-')} · Beli ${rp(x.buy)}</small></div><div class="rt"><b>${rp(x.sell)}</b><small class="${x.stock<=x.min?'lw':''}">${x.stock} ${esc(x.unit)}</small></div></div>`).join('')||'<p class="em">Belum ada barang. Ketuk + Tambah.</p>'}
function vIn(){if(!D.items.length)return '<p class="em">Tambah barang dulu di tab Barang.</p>';
return `<form class="g card" data-f="in"><label>Barang<select name="i" data-fill="buy" class="in">${opt()}</select></label><div class="two"><label>Jumlah<input name="q" type="number" step="any" min="0.0001" required class="in"></label><label>Harga beli /satuan<input name="p" type="number" step="any" min="0" required class="in" value="${D.items[0].buy}"></label></div><label>Tanggal<input name="d" type="date" class="in" value="${today()}"></label><label>Catatan<input name="note" class="in" placeholder="Supplier / keterangan"></label><button class="bt full">Tambah Stok</button></form>`+hist('in')}
function vOut(){if(!D.items.length)return '<p class="em">Tambah barang dulu di tab Barang.</p>';
const ns=[...new Set(D.moves.filter(v=>v.t==='out'&&v.who).map(v=>v.who))];
return `<form class="g card" data-f="out"><label>Barang<select name="i" data-fill="sell" class="in">${opt()}</select></label><div class="two"><label>Jumlah<input name="q" type="number" step="any" min="0.0001" required class="in"></label><label>Harga jual /satuan<input name="p" type="number" step="any" min="0" required class="in" value="${D.items[0].sell}"></label></div><label>Pengambil / pembeli<input name="who" list="nm" class="in" placeholder="Kosong = Umum"></label><datalist id="nm">${ns.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="two"><label>Pembayaran<select name="paid" class="in"><option value="1">Lunas</option><option value="0">Hutang</option></select></label><label>Tanggal<input name="d" type="date" class="in" value="${today()}"></label></div><label>Catatan<input name="note" class="in"></label><button class="bt full">Catat Keluar</button></form>`+hist('out')}
function vDebt(){const h=debtOf(),t=h.reduce((s,x)=>s+x[1],0);
return `<div class="c g" style="margin-bottom:10px"><small>Total hutang</small><b class="lw">${rp(t)}</b></div>`+(h.map(e=>`<div class="r g"><b>${esc(e[0])}</b><div class="rt"><b class="lw">${rp(e[1])}</b><a class="x" style="color:var(--ac)" data-a="py" data-who="${esc(e[0])}">Bayar</a></div></div>`).join('')||'<p class="em">Tidak ada hutang.</p>')+'<h4>Riwayat pembayaran</h4>'+(D.pays.slice(-15).reverse().map(p=>`<div class="r g"><div><b>${esc(p.who)}</b><small>${p.d}</small></div><b>${rp(p.a)}</b></div>`).join('')||'<p class="em">Belum ada pembayaran.</p>')}
function fItem(id){const x=id?it(id):{name:'',cat:'',unit:'pcs',buy:'',sell:'',stock:0,min:5};
return `<h3>${id?'Edit':'Tambah'} Barang</h3><form data-f="item" data-id="${id||''}"><label>Nama barang<input name="name" class="in" required value="${esc(x.name)}"></label><div class="two"><label>Kategori<input name="cat" class="in" value="${esc(x.cat)}"></label><label>Satuan<input name="unit" class="in" required value="${esc(x.unit)}"></label></div><div class="two"><label>Harga beli<input name="buy" type="number" step="any" min="0" required class="in" value="${x.buy}"></label><label>Harga jual<input name="sell" type="number" step="any" min="0" required class="in" value="${x.sell}"></label></div><div class="two"><label>${id?'Stok (koreksi)':'Stok awal'}<input name="stock" type="number" step="any" min="0" required class="in" value="${x.stock}"></label><label>Stok minimum<input name="min" type="number" step="any" min="0" class="in" value="${x.min}"></label></div><button class="bt full">Simpan</button>${id?`<button type="button" class="bt dg full" data-a="di" data-id="${id}">Hapus Barang</button>`:''}</form>`}
function fPay(w){const m=debtOf().find(z=>z[0]===w),a=m?Math.round(m[1]):0;
return `<h3>Bayar Hutang</h3><p>${esc(w)} · sisa <b>${rp(a)}</b></p><form data-f="pay"><input type="hidden" name="who" value="${esc(w)}"><label>Jumlah bayar<input name="a" type="number" step="any" min="1" max="${a}" required class="in" value="${a}"></label><label>Tanggal<input name="d" type="date" class="in" value="${today()}"></label><button class="bt full">Catat Pembayaran</button></form>`}
function fSet(){return `<h3>Pengaturan Data</h3><p style="color:var(--mu)">Data tersimpan di browser HP ini. Backup rutin agar aman.</p><button class="bt full" data-a="bk">Backup Semua Data (JSON)</button><label class="bt full" style="display:block;text-align:center;color:#fff;font-size:15px;margin:12px 0 0">Pulihkan dari File JSON<input id="rf" type="file" accept=".json,application/json" hidden></label><button class="bt full" data-a="cv">Export Transaksi (CSV)</button><button class="bt dg full" data-a="rs">Hapus Semua Data</button>`}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csv(){const r=[['Tanggal','Jenis','Barang','Jumlah','Harga','Total','Orang','Status','Catatan']].concat(D.moves.map(v=>[v.d,v.t==='in'?'Masuk':'Keluar',v.n,v.q,v.p,v.q*v.p,v.who,v.t==='out'?(v.paid?'Lunas':'Hutang'):'',v.note]));
dl('bm-transaksi-'+today()+'.csv','\ufeff'+r.map(a=>a.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function render(){$('#nv').style.setProperty('--i',tab);document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i===tab));
$('#ttl').textContent=['Beranda','Barang','Stok Masuk','Barang Keluar','Hutang'][tab];
$('#v').innerHTML=[vHome,vItems,vIn,vOut,vDebt][tab]();if(tab===1)list()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==='tab'){tab=+b.dataset.i;render();scrollTo(0,0)}
else if(a==='ni')sheet(fItem())
else if(a==='ei')sheet(fItem(id))
else if(a==='di'){if(confirm('Hapus barang ini? Riwayat transaksi tetap tersimpan.')){D.items=D.items.filter(x=>x.id!==id);save();closeS();render()}}
else if(a==='dm'){const m=D.moves.find(x=>x.id===id);if(!m||!confirm('Batalkan transaksi ini? Stok dikembalikan.'))return;const x=it(m.i);
if(x){const s=x.stock+(m.t==='out'?m.q:-m.q);if(s<0)return toast('Stok tidak cukup untuk membatalkan');x.stock=+s.toFixed(4)}
D.moves=D.moves.filter(z=>z.id!==id);save();render()}
else if(a==='py')sheet(fPay(b.dataset.who))
else if(a==='st')sheet(fSet())
else if(a==='bk')dl('bm-warung-backup-'+today()+'.json',JSON.stringify(D),'application/json')
else if(a==='cv')csv()
else if(a==='rs'){if(confirm('Hapus SEMUA data? Tidak bisa dibatalkan.')&&confirm('Yakin? Pastikan sudah backup.')){D={items:[],moves:[],pays:[]};save();closeS();render()}}
else if(a==='x')closeS()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f));
if(k==='item'){const o={name:d.name.trim(),cat:d.cat.trim(),unit:d.unit.trim(),buy:+d.buy,sell:+d.sell,stock:+d.stock,min:+d.min||0};
if(!o.name||!o.unit)return toast('Nama dan satuan wajib diisi');
if(f.dataset.id)Object.assign(it(f.dataset.id),o);else D.items.push(Object.assign({id:uid()},o))}
else if(k==='in'||k==='out'){const x=it(d.i),n=+d.q,p=+d.p,out=k==='out',paid=out?d.paid==='1':true,who=(d.who||'').trim();
if(!x||!(n>0)||!(p>=0))return toast('Data tidak valid');
if(out&&n>x.stock)return toast('Stok tidak cukup (sisa '+x.stock+')');
if(!paid&&!who)return toast('Nama wajib diisi untuk hutang');
D.moves.push({id:uid(),t:k,i:x.id,n:x.name,u:x.unit,q:n,p:p,c:out?x.buy:p,d:d.d||today(),who:who||(out?'Umum':''),paid:paid,note:(d.note||'').trim()});
x.stock=+(x.stock+(out?-n:n)).toFixed(4);if(!out)x.buy=p}
else if(k==='pay'){const a=+d.a,m=debtOf().find(z=>z[0]===d.who);if(!m||!(a>0)||a>m[1]+0.5)return toast('Jumlah bayar tidak valid');D.pays.push({id:uid(),who:d.who,a:a,d:d.d||today()})}
save();closeS();render();toast('Tersimpan')});
document.addEventListener('change',e=>{const s=e.target;
if(s.dataset&&s.dataset.fill){const x=it(s.value);if(x)s.form.p.value=x[s.dataset.fill]}
else if(s.id==='rf'&&s.files[0]){if(!confirm('Timpa semua data dengan file ini?')){s.value='';return}
const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.items)||!Array.isArray(j.moves))throw 0;D={items:j.items,moves:j.moves,pays:Array.isArray(j.pays)?j.pays:[]};save();closeS();render();toast('Data dipulihkan')}catch(x){toast('File tidak valid')}};r.readAsText(s.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;list()}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();
</script></body></html>
