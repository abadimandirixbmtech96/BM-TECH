<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Daftar Nomor Customer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #000000;
    --card-surface-dark: #141416;
    --card-border-dark: rgba(255, 255, 255, 0.08);
    --accent-yellow: #F0A529;
    --accent-yellow-glow: rgba(240, 165, 41, 0.28);
    --wa-green: #25D366;
    --text-primary: #FFFFFF;
    --text-secondary: #7C7C82;
    --text-muted: #4A4A4F;
    --glass-pill-bg: rgba(255, 255, 255, 0.09);
    --glass-pill-border: rgba(255, 255, 255, 0.12);
    --skeleton-a: rgba(255, 255, 255, 0.04);
    --skeleton-b: rgba(255, 255, 255, 0.10);
    --radius-lg: 16px;
    --radius-xl: 22px;
    --radius-pill: 999px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ease-spring: cubic-bezier(0.18, 0.85, 0.3, 1);
  }

  body.theme-light {
    --bg-dark: #F5F5F7;
    --card-surface-dark: #FFFFFF;
    --card-border-dark: rgba(0, 0, 0, 0.08);
    --text-primary: #000000;
    --text-secondary: #8E8E93;
    --text-muted: #A1A1A6;
    --glass-pill-bg: rgba(0, 0, 0, 0.06);
    --glass-pill-border: rgba(0, 0, 0, 0.08);
    --skeleton-a: rgba(0, 0, 0, 0.04);
    --skeleton-b: rgba(0, 0, 0, 0.10);
  }
  body.theme-light { color-scheme: light; }
  body.theme-light .back-btn { background: rgba(0, 0, 0, 0.06); }
  body.theme-light .top-bar { background: rgba(245, 245, 247, 0.6); }
  body.theme-light .search-pill,
  body.theme-light .cancel-btn { background: rgba(255, 255, 255, 0.55); }

  body.font-serif * { font-family: Georgia, 'Times New Roman', Times, serif !important; }
  body.font-mono * { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace !important; }
  body.font-rounded * { font-family: ui-rounded, 'SF Pro Rounded', 'Baloo 2', 'Segoe UI', sans-serif !important; }
  body.font-klasik * { font-family: 'Times New Roman', Times, Georgia, serif !important; }
  body.font-humanis * { font-family: Verdana, Tahoma, Geneva, sans-serif !important; }
  body.font-kompak * { font-family: 'Arial Narrow', 'Segoe UI', Arial, sans-serif !important; }
  body.font-bold-mode * { font-weight: 700 !important; }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    user-select: none;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  *:focus, *:active, *:focus-visible { outline: none; -webkit-tap-highlight-color: transparent; }
  ::selection { background: transparent; }
  input { -webkit-user-select: text; user-select: text; }
  input::selection { background: var(--accent-yellow-glow); color: inherit; }
  a { color: inherit; text-decoration: none; -webkit-user-drag: none; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(var(--safe-top) + 84px) 16px calc(var(--safe-bottom) + 110px) 16px;
    animation: pageIn 0.5s var(--ease-spring) both;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .page.leaving { opacity: 0; transform: translateX(24px); }

  @keyframes pageIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: calc(var(--safe-top) + 10px) 16px 12px 16px;
    background: rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border-bottom: 1px solid var(--card-border-dark);
    transition: background-color 0.3s ease;
  }
  .head {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .back-btn {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s var(--ease-spring), background 0.2s ease;
  }
  .back-btn:active { transform: scale(0.86); }
  .back-btn svg { width: 22px; height: 22px; }

  .head-text h1 { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .head-text p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    transition: opacity 0.2s ease;
  }

  .bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(var(--safe-bottom) + 14px);
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    align-items: center;
    z-index: 40;
    transition: bottom 0.28s var(--ease-spring);
  }
  .bottom-bar.active { bottom: calc(var(--kb, 0px) + 10px); }

  .cancel-btn {
    width: 0;
    height: 52px;
    flex-shrink: 0;
    margin-right: 0;
    border-radius: 50%;
    overflow: hidden;
    background: rgba(26, 25, 28, 0.55);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    backdrop-filter: blur(28px) saturate(1.6);
    box-shadow: inset 0 0 0 1px var(--glass-pill-border), 0 4px 18px rgba(0, 0, 0, 0.18);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.5);
    pointer-events: none;
    transition: width 0.3s var(--ease-spring), margin 0.3s var(--ease-spring), opacity 0.2s ease, transform 0.3s var(--ease-spring);
  }
  .cancel-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .bottom-bar.active .cancel-btn {
    width: 52px;
    margin-right: 12px;
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  .bottom-bar.active .cancel-btn:active { transform: scale(0.88); }

  .search-pill {
    flex: 1;
    min-width: 0;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px 0 18px;
    border-radius: var(--radius-pill);
    background: rgba(26, 25, 28, 0.55);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    backdrop-filter: blur(28px) saturate(1.6);
    border: 1px solid var(--glass-pill-border);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .search-pill:focus-within {
    border-color: var(--accent-yellow);
    box-shadow: 0 0 0 4px var(--accent-yellow-glow), 0 4px 18px rgba(0, 0, 0, 0.18);
  }
  .search-pill > svg { width: 19px; height: 19px; color: var(--text-secondary); flex-shrink: 0; }
  .search-pill input {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 500;
  }
  .search-pill input::placeholder { color: var(--text-secondary); }

  .clear-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--glass-pill-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.5);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.25s var(--ease-spring);
  }
  .clear-btn.show { opacity: 1; transform: scale(1); pointer-events: auto; }
  .clear-btn:active { transform: scale(0.85); }
  .clear-btn svg { width: 12px; height: 12px; color: var(--text-secondary); }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .row {
    display: flex;
    align-items: stretch;
    background: var(--card-surface-dark);
    border: 1px solid var(--card-border-dark);
    border-radius: var(--radius-xl);
    overflow: hidden;
    transition: transform 0.22s var(--ease-spring), border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .row.anim {
    opacity: 0;
    animation: rowIn 0.5s var(--ease-spring) forwards;
    animation-delay: calc(var(--i, 0) * 45ms);
  }
  .row.fade { animation: rowFade 0.25s ease both; }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes rowFade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (hover: hover) {
    .row:hover { border-color: rgba(240, 165, 41, 0.45); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18); transform: translateY(-2px); }
    .copy-btn:hover { color: var(--accent-yellow); }
  }
  .row:active { transform: scale(0.98); }

  .row-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px 12px 16px 16px;
  }
  .row-top { display: flex; align-items: center; gap: 12px; }

  .idx {
    min-width: 22px;
    flex-shrink: 0;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .wa-badge {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 13px;
    background: rgba(37, 211, 102, 0.14);
    color: var(--wa-green);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s var(--ease-spring), background 0.25s ease;
  }
  .wa-badge svg { width: 22px; height: 22px; }
  .row:active .wa-badge { transform: scale(0.9) rotate(-6deg); background: rgba(37, 211, 102, 0.24); }

  .info { min-width: 0; flex: 1; }
  .sub {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .num {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.2px;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fields {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 14px;
    border-radius: var(--radius-lg);
    background: var(--glass-pill-bg);
  }
  .field { display: flex; align-items: flex-start; gap: 12px; }
  .fl {
    flex: 0 0 56px;
    padding-top: 3px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .fv {
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--text-primary);
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
  .row-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .pill {
    padding: 4px 11px;
    border-radius: var(--radius-pill);
    background: var(--accent-yellow-glow);
    color: var(--accent-yellow);
    font-size: 12px;
    font-weight: 600;
  }
  .pill b { font-weight: 800; }
  .date {
    font-size: 12.5px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .copy-btn {
    width: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    border-left: 1px solid var(--card-border-dark);
    transition: color 0.2s ease, background 0.2s ease, transform 0.2s var(--ease-spring);
  }
  .copy-btn:active { background: var(--glass-pill-bg); transform: scale(0.9); }
  .copy-btn svg { width: 19px; height: 19px; transition: transform 0.3s var(--ease-spring); }
  .copy-btn.done { color: var(--wa-green); }
  .copy-btn.done svg { transform: scale(1.2); }

  .skeleton {
    height: 170px;
    border-radius: var(--radius-xl);
    border: 1px solid var(--card-border-dark);
    background: linear-gradient(100deg, var(--skeleton-a) 30%, var(--skeleton-b) 50%, var(--skeleton-a) 70%);
    background-size: 220% 100%;
    animation: shimmer 1.3s linear infinite, rowFade 0.4s ease both;
    animation-delay: 0s, calc(var(--i, 0) * 60ms);
  }
  @keyframes shimmer {
    from { background-position: 120% 0; }
    to { background-position: -120% 0; }
  }

  .state {
    text-align: center;
    padding: 64px 24px;
    animation: rowFade 0.45s var(--ease-spring) both;
  }
  .state-icon {
    width: 68px;
    height: 68px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--glass-pill-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }
  .state-icon svg { width: 30px; height: 30px; }
  .state h3 { font-size: 17px; font-weight: 700; }
  .state p { font-size: 13.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
  .state .retry {
    margin-top: 20px;
    padding: 12px 26px;
    border-radius: var(--radius-pill);
    background: var(--accent-yellow);
    color: #1C1B19;
    font-weight: 700;
    font-size: 14px;
    transition: transform 0.18s var(--ease-spring);
  }
  .state .retry:active { transform: scale(0.92); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 88px + var(--kb, 0px));
    transform: translate(-50%, 24px) scale(0.92);
    padding: 12px 20px;
    border-radius: var(--radius-pill);
    background: var(--card-surface-dark);
    border: 1px solid var(--glass-pill-border);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.35);
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.25s ease, transform 0.35s var(--ease-spring);
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      transition-duration: 0.01ms !important;
    }
  }
  /* ===================================================================
     TRANSISI HALUS & LAYAR LEBAR
     =================================================================== */
  @view-transition { navigation: auto; }

  /* Tablet, laptop, monitor: halaman memenuhi layar, daftar nomor tersusun dalam kolom */
  @media screen and (min-width: 768px) {
    .top-bar { padding-left: 32px; padding-right: 32px; }
    .head { max-width: 1536px; }
    .page { max-width: 1600px; padding-left: 32px; padding-right: 32px; }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
    .list > .state { grid-column: 1 / -1; }
  }
</style>
</head>

        serif: 'font-serif', klasik: 'font-klasik', humanis: 'font-humanis',

      };

    } catch (e) {}
  })();
</script>

  const ICON_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

  let allNumbers = [];
  let toastTimer = null;

  function normalizeKey(str) {
    return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------- Ekstraksi & normalisasi nomor ---------- */

  // Mengambil semua nomor HP Indonesia (08..., 628..., +628...) dari sebuah teks.
  // Hasil: array kunci internasional tanpa plus, contoh "628123456789".
  // Separator (spasi, strip, titik) dibolehkan hanya jika grup digit berikutnya >= 3 digit,
  // supaya angka lain seperti "2 pcs" tidak ikut terbaca sebagai bagian nomor.
  function extractPhones(text) {
    const s = String(text || '');
    const n = s.length;
    const re = /(?:\+62|62)[ \-.]?0?8|08/g;
    const found = [];
    let m;
    while ((m = re.exec(s)) !== null) {
      const prev = m.index > 0 ? s[m.index - 1] : '';
      if (/[\d.,+]/.test(prev)) continue;

      let national = '8';
      let j = m.index + m[0].length;
      while (j < n) {
        const c = s[j];
        if (c >= '0' && c <= '9') {
          national += c;
          j++;
        } else if (c === ' ' || c === '-' || c === '.') {
          const run = s.slice(j + 1).match(/^\d+/);
          if (run && run[0].length >= 3 && national.length + run[0].length <= 12) {
            j++;
          } else {
            break;
          }
        } else {
          break;
        }
      }
      re.lastIndex = j;

      // Nomor lokal valid: 10-13 digit (termasuk 0 di depan) => bagian nasional 9-12 digit.
      if (national.length >= 9 && national.length <= 12) {
        found.push('62' + national);
      }
    }
    return found;
  }

  function formatDisplay(key) {
    const nat = key.slice(2);
    return '0' + nat.slice(0, 3) + '-' + nat.slice(3, 7) + (nat.length > 7 ? '-' + nat.slice(7) : '');
  }

  function formatLocal(key) {
    return '0' + key.slice(2);
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function formatDate(d) {
    return pad2(d.getDate()) + '-' + pad2(d.getMonth() + 1) + '-' + d.getFullYear();
  }

  function parseDMY(val) {
    const m = String(val || '').trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if (!m) return null;
    const y = m[3].length === 2 ? '20' + m[3] : m[3];
    const d = new Date(y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') + 'T00:00:00');
    return isNaN(d) ? null : d;
  }

  // Mengubah isi satu catatan buku besar menjadi daftar {text, date} dari kolom Keterangan.
  function collectEntries(content) {
    if (!content) return [];

    if (content.schema === 'admin-data-v1' && Array.isArray(content.records)) {
      return content.records.map(r => {
        const d = r && r.created_at ? new Date(r.created_at) : null;
        return {
          text: r ? r.keterangan : '',
          date: d && !isNaN(d) ? d : null,
          name: r && r.customer ? String(r.customer).trim() : '',
          pj: r && r.pj ? String(r.pj).trim() : '',
          barang: r && r.barang ? String(r.barang).trim() : ''
        };
      });
    }

    if (Array.isArray(content.columns) && Array.isArray(content.rows)) {
      const kc = content.columns.find(c => normalizeKey(c.label) === 'keterangan');
      if (!kc) return [];
      const dc = content.columns.find(c => normalizeKey(c.label) === 'tanggal');
      const cc = content.columns.find(c => normalizeKey(c.label) === 'customer');
      const pc = content.columns.find(c => normalizeKey(c.label) === 'pj');
      const bc = content.columns.find(c => normalizeKey(c.label) === 'barang');
      return content.rows.map(r => {
        const cells = (r && r.cells) || {};
        return {
          text: cells[kc.id],
          date: dc ? parseDMY(cells[dc.id]) : null,
          name: cc ? String(cells[cc.id] || '').trim() : '',
          pj: pc ? String(cells[pc.id] || '').trim() : '',
          barang: bc ? String(cells[bc.id] || '').trim() : ''
        };
      });
    }

    return [];
  }

  function buildNumberList(notes) {
    const map = new Map();
    notes.forEach(note => {
      collectEntries(note.content).forEach(entry => {
        // Satu transaksi dihitung sekali per nomor, walau nomor yang sama ditulis dua kali.
        const keys = new Set(extractPhones(entry.text));
        keys.forEach(key => {
          let item = map.get(key);
          if (!item) {
            item = { key, count: 0, last: null, name: '', nameDate: null, pj: '', barang: '', infoDate: null };
            map.set(key, item);
          }
          item.count++;
          if (entry.date && (!item.last || entry.date > item.last)) item.last = entry.date;
          // Nama yang dipakai: nama terbaru yang terisi.
          const nm = String(entry.name || '').trim();
          if (nm && (!item.name || (entry.date && (!item.nameDate || entry.date >= item.nameDate)))) {
            item.name = nm;
            item.nameDate = entry.date || item.nameDate;
          }
          // PJ & barang: diambil dari transaksi terbaru yang terisi.
          const pjv = String(entry.pj || '').trim();
          const brv = String(entry.barang || '').trim();
          if ((pjv || brv) && ((!item.pj && !item.barang) || (entry.date && (!item.infoDate || entry.date >= item.infoDate)))) {
            item.pj = pjv;
            item.barang = brv;
            item.infoDate = entry.date || item.infoDate;
          }
        });
      });
    });

    return Array.from(map.values()).sort((a, b) => {
      if (a.last && b.last) return b.last - a.last || b.count - a.count;
      if (a.last) return -1;
      if (b.last) return 1;
      return b.count - a.count;
    });
  }

  /* ---------- Data dari Supabase ---------- */

  async function fetchLedgerNotes() {
    const { data: folders, error: folderErr } = await supabaseClient
      .from('folders')
      .select('id, name, owner_username');
    if (folderErr) throw folderErr;

    const ledger = (folders || []).find(f =>
      f && !f.owner_username && normalizeKey(f.name) === LEDGER_FOLDER_KEY
    );
    if (!ledger) return [];

    const notes = [];
    let from = 0;
    while (true) {
      const { data, error } = await supabaseClient
        .from('notes')
        .select('id, content, created_at')
        .eq('folder_id', ledger.id)
        .order('created_at', { ascending: true })
        .range(from, from + PAGE_SIZE - 1);
      if (error) throw error;
      notes.push(...(data || []));
      if (!data || data.length < PAGE_SIZE) break;
      from += PAGE_SIZE;
    }
    return notes;
  }

  /* ---------- Render ---------- */

  function renderSkeleton() {
    let html = '';
    for (let i = 0; i < 7; i++) html += '<div class="skeleton" style="--i:' + i + '"></div>';
    listEl.innerHTML = html;
  }

  function renderState(icon, title, text, onRetry) {
    listEl.innerHTML =
      '<div class="state"><div class="state-icon">' + icon + '</div>' +
      '<h3>' + escapeHtml(title) + '</h3>' +
      '<p>' + escapeHtml(text) + '</p>' +
      (onRetry ? '<button class="retry" id="btnRetry">Coba Lagi</button>' : '') +
      '</div>';
    if (onRetry) document.getElementById('btnRetry').addEventListener('click', onRetry);
  }

  function rowHtml(item, index, animClass) {
    const style = animClass === 'anim' ? ' style="--i:' + Math.min(index, 14) + '"' : '';
    return (
      '<div class="row ' + animClass + '"' + style + '>' +
        '<a class="row-main" href="https://wa.me/' + item.key + '" target="_blank" rel="noopener noreferrer" aria-label="Chat WhatsApp ' + escapeHtml(item.name || formatLocal(item.key)) + '">' +
          '<div class="row-top">' +
            '<div class="idx">' + (index + 1) + '</div>' +
            '<div class="wa-badge">' + ICON_WA + '</div>' +
            '<div class="info">' +
              (item.name
                ? '<div class="num">' + escapeHtml(item.name) + '</div><div class="sub">' + formatDisplay(item.key) + '</div>'
                : '<div class="num">' + formatDisplay(item.key) + '</div>') +
            '</div>' +
          '</div>' +
          ((item.pj || item.barang)
            ? '<div class="fields">' +
                (item.pj ? '<div class="field"><span class="fl">PJ</span><span class="fv">' + escapeHtml(item.pj) + '</span></div>' : '') +
                (item.barang ? '<div class="field"><span class="fl">Barang</span><span class="fv">' + escapeHtml(item.barang) + '</span></div>' : '') +
              '</div>'
            : '') +
          '<div class="row-foot">' +
            '<span class="pill"><b>' + item.count + '</b> transaksi</span>' +
            (item.last ? '<span class="date">' + formatDate(item.last) + '</span>' : '') +
          '</div>' +
        '</a>' +
        '<button class="copy-btn" data-copy="' + formatLocal(item.key) + '" aria-label="Salin nomor">' + ICON_COPY + '</button>' +
      '</div>'
    );
  }

  function getFiltered() {
    const raw = searchInput.value.trim().toLowerCase();
    if (!raw) return allNumbers;
    const digits = raw.replace(/\D/g, '');
    const hasLetters = /[a-z]/.test(raw);
    const q2 = digits.startsWith('0') ? '62' + digits.slice(1) : null;
    return allNumbers.filter(it => {
      if (it.name && it.name.toLowerCase().includes(raw)) return true;
      if (hasLetters || !digits) return false;
      return it.key.includes(digits) || (q2 && it.key.includes(q2));
    });
  }

  function updateSubtitle(shown) {
    if (!allNumbers.length) {
      subtitleEl.textContent = 'Buku Besar';
    } else if (shown === allNumbers.length) {
      subtitleEl.textContent = allNumbers.length + ' nomor unik dari Buku Besar';
    } else {
      subtitleEl.textContent = shown + ' dari ' + allNumbers.length + ' nomor';
    }
  }

  function renderList(animClass) {
    if (!allNumbers.length) {
      updateSubtitle(0);
      renderState(ICON_PHONE, 'Belum ada nomor', 'Tulis nomor HP customer (08... atau +62...) di kolom Keterangan Buku Besar, nomornya akan muncul di sini.', null);
      return;
    }
    const items = getFiltered();
    updateSubtitle(items.length);
    if (!items.length) {
      renderState(ICON_PHONE, 'Tidak ditemukan', 'Tidak ada nama atau nomor yang cocok dengan pencarian Anda.', null);
      return;
    }
    listEl.innerHTML = items.map((it, i) => rowHtml(it, i, animClass)).join('');
  }

  async function loadData() {
    subtitleEl.textContent = 'Memuat data...';
    renderSkeleton();
    try {
      const notes = await fetchLedgerNotes();
      allNumbers = buildNumberList(notes);
      renderList('anim');
    } catch (err) {
      console.error('Gagal memuat nomor:', err && err.message ? err.message : err);
      subtitleEl.textContent = 'Gagal memuat';
      renderState(ICON_ALERT, 'Gagal memuat data', 'Periksa koneksi internet Anda lalu coba lagi.', loadData);
    }
  }

  /* ---------- Interaksi ---------- */

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700);
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;-webkit-user-select:text;user-select:text;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  listEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const text = btn.getAttribute('data-copy');
    const ok = await copyText(text);
    showToast(ok ? 'Nomor ' + text + ' disalin' : 'Gagal menyalin nomor');
    if (ok) {
      btn.classList.add('done');
      btn.innerHTML = ICON_CHECK;
      setTimeout(() => {
        btn.classList.remove('done');
        btn.innerHTML = ICON_COPY;
      }, 1300);
    }
  });

  searchInput.addEventListener('input', () => {
    btnClear.classList.toggle('show', searchInput.value.length > 0);
    if (allNumbers.length) renderList('fade');
  });

  btnClear.addEventListener('click', () => {
    searchInput.value = '';
    btnClear.classList.remove('show');
    if (allNumbers.length) renderList('fade');
    searchInput.focus();
  });

  const bottomBar = document.getElementById('bottomBar');
  const btnCancel = document.getElementById('btnCancel');
  const rootStyle = document.documentElement.style;

  // Posisi bar pencarian mengikuti tinggi keyboard.
  function updateKeyboardOffset() {
    const vv = window.visualViewport;
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    rootStyle.setProperty('--kb', kb + 'px');
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateKeyboardOffset);
    window.visualViewport.addEventListener('scroll', updateKeyboardOffset);
  }

  searchInput.addEventListener('focus', () => {
    bottomBar.classList.add('active');
    updateKeyboardOffset();
  });
  searchInput.addEventListener('blur', () => {
    bottomBar.classList.remove('active');
    rootStyle.setProperty('--kb', '0px');
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchInput.blur();
  });

  // Tombol di dalam bar tidak boleh mencuri fokus supaya keyboard tidak menutup duluan.
  [btnCancel, btnClear].forEach(btn => {
    btn.addEventListener('pointerdown', (e) => e.preventDefault());
    btn.addEventListener('mousedown', (e) => e.preventDefault());
  });

  btnCancel.addEventListener('click', () => {
    searchInput.value = '';
    btnClear.classList.remove('show');
    if (allNumbers.length) renderList('fade');
    searchInput.blur();
  });

  document.getElementById('btnBack').addEventListener('click', () => {
    if (window.parent && window.parent !== window) { window.parent.postMessage({ type: 'close-page' }, '*'); return; }
    pageEl.classList.add('leaving');
    setTimeout(() => { window.location.href = DASHBOARD_FILE; }, 200);
  });

  window.addEventListener('pageshow', () => pageEl.classList.remove('leaving'));

  /* ---------- Penjaga akses (sama seperti dashboard admin) ---------- */

  (async function guardAdminAccess() {
    renderSkeleton();
    const OK_KEY = 'bm-admin-ok';
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

    function localUserId() {
      try {
        const raw = localStorage.getItem('bmtech-auth');
        const j = raw ? JSON.parse(raw) : null;
        return (j && j.user && j.user.id) ? j.user.id : null;
      } catch (e) { return null; }
    }

    // Admin yang sudah pernah diverifikasi di perangkat ini: data langsung dimuat bersamaan
    // dengan verifikasi (data tetap dijaga RLS di server), tanpa menunggu antrean jaringan.
    let okUid = null;
    try { okUid = localStorage.getItem(OK_KEY); } catch (e) {}
    const uid = localUserId();
    const optimistic = !!uid && uid === okUid;
    let earlyLoad = null;
    if (optimistic) earlyLoad = loadData();

    try {
      const { data: { session } } = await withTimeout(supabaseClient.auth.getSession(), 8000);
      if (!session) {
        try { localStorage.removeItem(OK_KEY); } catch (e) {}
        window.location.href = LOGIN_FILE;
        return;
      }

      const { data: isAdmin, error } = await withTimeout(supabaseClient.rpc('is_admin'), 8000);
      if (error) throw error;

      if (!isAdmin) {
        try { localStorage.removeItem(OK_KEY); } catch (e) {}
        await supabaseClient.auth.signOut();
        window.location.href = LOGIN_FILE;
        return;
      }
      try { localStorage.setItem(OK_KEY, session.user.id); } catch (e) {}
    } catch (err) {
      console.error('Gagal cek akses admin:', err && err.message ? err.message : err);
      if (optimistic) return; // data sudah dimuat; jangan ditimpa pesan error
      subtitleEl.textContent = 'Gagal memuat';
      renderState(ICON_ALERT, 'Gagal memeriksa akses', 'Periksa koneksi internet Anda lalu coba lagi.', () => window.location.reload());
      return;
    }

    if (!earlyLoad) loadData();
  })();
</script>
