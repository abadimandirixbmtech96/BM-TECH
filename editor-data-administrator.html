<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Workshop Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
<style>
  /* Force our own web font everywhere — some Android skins (MIUI, ColorOS, One UI, etc.)
     let the user override the system font, which would otherwise leak into any
     element still relying on generic names like sans-serif/Roboto/system-ui.
     Loading a specifically-named font file bypasses that OS-level substitution,
     so the Aa panel's typography stays true regardless of the phone's settings. */
  *{ font-family:'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif !important; }
</style>
<style>
  :root{
    --paper:#F6F1E7;
    --paper-alt:#FBF8F2;
    --ink:#1C1B19;
    --ink-soft:#6B6459;
    --line:#E4DDCC;
    --line-soft:#EDE7D8;
    --glass-bg:rgba(255,255,255,0.55);
    --glass-border:rgba(255,255,255,0.6);
    --glass-shadow:0 8px 32px rgba(80,70,50,0.14);
    --accent:#C9932F;
    --radius-pill:999px;
    --radius-lg:22px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --safe-right:env(safe-area-inset-right,0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* ---------- App shell ---------- */
  .app{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top floating bar ---------- */
  .topbar{
    position:absolute;
    top:calc(var(--safe-top) + 12px);
    left:0; right:0;
    padding:0 calc(var(--safe-left) + 14px) 0 calc(var(--safe-left) + 14px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:40;
    pointer-events:none;
  }
  .glass-pill{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:1px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px) saturate(1.4);
    -webkit-backdrop-filter:blur(24px) saturate(1.4);
    border-radius:var(--radius-pill);
    box-shadow:var(--glass-shadow);
    padding:4px;
  }
  .icon-btn{
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    border:none; background:transparent;
    border-radius:50%;
    color:var(--ink);
    transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:active{
    transform:scale(0.88);
    background:rgba(0,0,0,0.06);
  }
  .icon-btn svg{width:17px; height:17px;}
  .icon-btn.disabled{opacity:0.32;}

  /* ---------- Zoomable / pannable workspace ---------- */
  .content{
    flex:1;
    position:relative;
    overflow:hidden;
    touch-action:none;
  }
  .canvas{
    position:absolute;
    top:0; left:0;
    transform-origin:0 0;
    will-change:transform;
  }
  .canvas.panning, .canvas.pinching{transition:none;}

  .zoom-indicator{
    position:absolute;
    left:50%;
    bottom:calc(var(--safe-bottom) + 78px);
    transform:translateX(-50%) translateY(8px);
    background:rgba(28,27,25,0.78);
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:var(--radius-pill);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:39;
    font-variant-numeric:tabular-nums;
  }
  .zoom-indicator.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .title-block{
    padding:4px calc(var(--safe-left) + 20px) 18px calc(var(--safe-left) + 20px);
  }
  .title-block h1{
    margin:0;
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.02em;
    color:var(--ink);
  }

  .table-caption{display:none;}

  [contenteditable="true"]{
    outline:none;
    border-radius:6px;
    cursor:text;
    transition:background .15s ease, box-shadow .15s ease;
  }
  [contenteditable="true"]:focus{
    background:rgba(201,147,47,0.09);
    box-shadow:0 0 0 2px rgba(201,147,47,0.4) inset;
  }
  [contenteditable="true"]:empty::before{
    content:attr(data-placeholder);
    color:var(--ink-soft);
    opacity:0.45;
  }

  /* ---------- Table workspace ---------- */
  .table-scroll{
    margin:0 calc(var(--safe-left) + 14px) 24px calc(var(--safe-left) + 14px);
    border-radius:16px;
    box-shadow:0 1px 0 rgba(0,0,0,0.03);
    background:var(--paper-alt);
    width:max-content;
  }
  table{
    border-collapse:collapse;
    width:max-content;
    font-size:13.5px;
  }
  thead th{
    position:sticky;
    top:0;
    background:#F1EADA;
    color:var(--ink-soft);
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-align:left;
    padding:8px 6px 8px 12px;
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line-soft);
    white-space:nowrap;
  }
  .th-inner{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .th-label{
    outline:none;
    min-width:24px;
    cursor:text;
  }
  .th-menu-btn{
    flex:0 0 auto;
    width:22px; height:22px;
    border:none; background:transparent;
    color:var(--ink-soft);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .th-menu-btn:active{ background:rgba(0,0,0,0.08); transform:scale(0.9); }
  .th-menu-btn svg{ width:14px; height:14px; }
  thead th:last-child, tbody td:last-child{border-right:none;}
  tbody td{
    padding:12px 12px;
    border-bottom:1px solid var(--line-soft);
    border-right:1px solid var(--line-soft);
    vertical-align:top;
    min-width:92px;
    max-width:180px;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:active{background:rgba(201,147,47,0.07);}

  td.col-tanggal, th.col-tanggal{min-width:78px;}
  td.col-tanggal .tgl{font-weight:700;}
  td.col-tanggal .hari{display:block; font-size:11px; color:var(--ink-soft); font-weight:500; margin-top:1px;}
  td.col-no{min-width:34px; text-align:center; color:var(--ink-soft);}
  td.col-jam{min-width:56px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  td.col-harga{min-width:90px; font-weight:600; white-space:nowrap;}
  td.col-ket{min-width:200px;}

  .row-handle{
    position:relative;
  }

  /* ---------- Gambar column ---------- */
  td.col-gambar{ min-width:52px; text-align:center; padding:8px; }
  .img-thumb-wrap{ position:relative; display:inline-block; }
  .img-thumb, .img-empty{
    width:40px; height:40px;
    border:none; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:rgba(0,0,0,0.05);
    color:var(--ink-soft);
  }
  .img-thumb img{ width:100%; height:100%; object-fit:cover; }
  .img-thumb:active, .img-empty:active{ transform:scale(0.92); }
  .img-empty svg{ width:17px; height:17px; }
  .img-remove{
    position:absolute;
    top:-6px; right:-6px;
    width:19px; height:19px;
    border-radius:50%;
    border:2px solid var(--paper);
    background:#3A3733;
    color:#fff;
    font-size:12px;
    line-height:15px;
    text-align:center;
    padding:0;
  }
  .img-remove:active{ transform:scale(0.85); background:#211F1C; }

  /* ---------- Row completeness indicator ---------- */
  td.cell-empty{ box-shadow:inset 0 0 0 2px #E2483D; }
  td.cell-filled{ box-shadow:inset 0 0 0 2px #3DA85C; }

  /* ---------- Image preview overlay ---------- */
  .img-preview-scrim{
    position:fixed; inset:0;
    background:rgba(10,9,8,0.86);
    z-index:95;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    opacity:0; pointer-events:none;
    transition:opacity .18s ease;
  }
  .img-preview-scrim.open{ opacity:1; pointer-events:auto; }
  .img-preview-scrim img{
    max-width:100%; max-height:100%;
    border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }

  /* ---------- Pencil / drawing ---------- */
  #drawCanvas{
    position:absolute; top:0; left:0;
    z-index:35;
    pointer-events:none;
    touch-action:none;
  }
  #drawCanvas.active{ pointer-events:auto; }
  .pencil-panel{
    position:fixed;
    left:50%;
    bottom:calc(var(--safe-bottom) + 78px);
    transform:translateX(-50%) translateY(14px) scale(0.97);
    width:min(94vw, 380px);
    background:rgba(26,24,21,0.92);
    backdrop-filter:blur(26px) saturate(1.3);
    -webkit-backdrop-filter:blur(26px) saturate(1.3);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:22px;
    padding:12px;
    box-shadow:0 18px 44px rgba(0,0,0,0.38);
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .22s cubic-bezier(.22,.9,.32,1);
  }
  .pencil-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0) scale(1);
  }
  .pencil-row{ display:flex; align-items:center; gap:8px; }
  .pencil-swatch{
    width:30px; height:30px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.18);
    flex:0 0 auto;
    position:relative;
    overflow:hidden;
  }
  .pencil-swatch.selected{ border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,0.3); }
  .pencil-clear{
    margin-left:auto;
    flex:0 0 auto;
    height:30px;
    padding:0 12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:#F2EFE9;
    font-size:12.5px;
    font-weight:600;
    font-family:inherit;
    white-space:nowrap;
  }
  .pencil-clear:active{ background:rgba(255,255,255,0.14); }
  .pencil-wheel-wrap{ display:flex; justify-content:center; margin-top:14px; }
  .pencil-wheel{
    position:relative;
    width:150px; height:150px;
    border-radius:50%;
    background:conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    touch-action:none;
    box-shadow:0 4px 16px rgba(0,0,0,0.3);
  }
  .pencil-wheel::after{
    content:'';
    position:absolute; inset:0;
    border-radius:50%;
    background:radial-gradient(circle at center, #fff, rgba(255,255,255,0) 70%);
    pointer-events:none;
  }
  .pencil-wheel-cursor{
    position:absolute;
    width:22px; height:22px;
    left:8px; top:8px;
    border-radius:50%;
    border:3px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,0.45);
    transform:translate(-50%,-50%);
    pointer-events:none;
    background:#F2B705;
  }
  .row-menu-btn{
    width:28px; height:28px;
    border:none; background:transparent;
    color:var(--ink-soft);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .row-menu-btn:active{background:rgba(0,0,0,0.06); transform:scale(0.9);}
  .row-menu-btn svg{width:16px; height:16px;}

  /* ---------- Bottom floating toolbar ---------- */
  .bottombar{
    position:absolute;
    left:0; right:0;
    bottom:calc(var(--safe-bottom) + 14px);
    display:flex;
    justify-content:center;
    z-index:40;
    pointer-events:none;
  }
  .bottombar .glass-pill{padding:6px;}
  .toolbtn{
    width:46px; height:46px;
    border:none; background:transparent;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .toolbtn:active{transform:scale(0.88); background:rgba(0,0,0,0.06);}
  .toolbtn svg{width:21px; height:21px;}
  .toolbtn.active-tool{color:var(--accent); background:rgba(201,147,47,0.12);}
  .toolbtn.stub{opacity:0.4;}
  .toolbtn .aa-label{font-size:17px; font-weight:600; font-family:-apple-system,sans-serif;}

  /* ---------- Row ⋮ context menu ---------- */
  .menu-scrim{
    position:fixed; inset:0; z-index:70;
    background:transparent;
  }
  .row-menu{
    position:fixed;
    z-index:80;
    background:rgba(32,30,27,0.86);
    backdrop-filter:blur(22px) saturate(1.3);
    -webkit-backdrop-filter:blur(22px) saturate(1.3);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 12px 34px rgba(0,0,0,0.32);
    animation:menuPop .16s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes menuPop{
    from{ opacity:0; transform:scale(0.92); }
    to{ opacity:1; transform:scale(1); }
  }
  .row-menu button{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:13px 16px;
    background:transparent;
    border:none;
    color:#F2EFE9;
    font-size:15px;
    font-weight:500;
    font-family:inherit;
    text-align:left;
  }
  .row-menu button:active{ background:rgba(255,255,255,0.1); }
  .row-menu button + button{ border-top:1px solid rgba(255,255,255,0.1); }
  .row-menu button.danger{ color:#FF7A6E; }
  .row-menu svg{ width:17px; height:17px; flex-shrink:0; }

  /* ---------- Aa formatting panel ---------- */
  .format-panel{
    position:fixed;
    left:50%;
    bottom:calc(var(--safe-bottom) + 78px);
    transform:translateX(-50%) translateY(14px) scale(0.97);
    width:min(94vw, 460px);
    background:rgba(26,24,21,0.92);
    backdrop-filter:blur(26px) saturate(1.3);
    -webkit-backdrop-filter:blur(26px) saturate(1.3);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:22px;
    padding:14px;
    box-shadow:0 18px 44px rgba(0,0,0,0.38);
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .22s cubic-bezier(.22,.9,.32,1);
  }
  .format-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0) scale(1);
  }
  .fp-row{
    display:flex;
    gap:7px;
    margin-bottom:9px;
  }
  .fp-row:last-child{ margin-bottom:0; }
  .fp-row button{
    flex:1 1 0;
    min-width:0;
    height:42px;
    border:none;
    border-radius:11px;
    background:rgba(255,255,255,0.07);
    color:#EDEAE2;
    font-size:14.5px;
    font-weight:600;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .12s ease, color .12s ease;
  }
  .fp-row button svg{ width:18px; height:18px; }
  .fp-row button:active{ background:rgba(255,255,255,0.14); }
  .fp-row button.fp-active{
    background:var(--accent);
    color:#241C08;
  }
  .fp-styles button{ font-size:13.5px; }

  .fp-fontsize{ position:relative; flex:1 1 0; display:flex; }
  .fp-fontsize > button{
    width:100%; height:42px; border:none; border-radius:11px;
    background:rgba(255,255,255,0.07); color:#EDEAE2;
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .fp-A{ font-size:16px; font-weight:700; }
  .fp-caret{ font-size:10px; opacity:0.7; }
  .fp-size-menu{
    position:absolute;
    bottom:50px;
    left:0;
    min-width:150px;
    background:rgba(20,19,17,0.95);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,0.4);
    display:none;
  }
  .fp-size-menu.open{ display:block; }
  .fp-size-menu button{
    width:100%; text-align:left;
    padding:11px 14px;
    background:transparent; border:none;
    color:#EDEAE2; font-size:14px; font-weight:500; font-family:inherit;
  }
  .fp-size-menu button:active{ background:rgba(255,255,255,0.1); }
  .fp-size-menu button.fp-active{ color:var(--accent); font-weight:700; }
  .fp-size-menu button + button{ border-top:1px solid rgba(255,255,255,0.08); }

  ul.list-dash{ list-style:none; padding-left:1.1em; }
  ul.list-dash li::before{ content:"– "; }

  /* ---------- Background picker panel ---------- */
  .bg-panel{
    position:fixed;
    left:50%;
    bottom:calc(var(--safe-bottom) + 78px);
    transform:translateX(-50%) translateY(14px) scale(0.97);
    background:rgba(26,24,21,0.92);
    backdrop-filter:blur(26px) saturate(1.3);
    -webkit-backdrop-filter:blur(26px) saturate(1.3);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:22px;
    padding:14px;
    box-shadow:0 18px 44px rgba(0,0,0,0.38);
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .22s cubic-bezier(.22,.9,.32,1);
  }
  .bg-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0) scale(1);
  }
  .bg-row{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:2px;
  }
  .bg-swatch{
    flex:0 0 auto;
    width:52px; height:52px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.14);
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    color:#EDEAE2;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .bg-swatch svg{ width:19px; height:19px; }
  .bg-swatch.selected{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(201,147,47,0.28);
  }
  .bg-swatch-add{ background:rgba(255,255,255,0.08); }

  /* ---------- Share action sheet ---------- */
  .share-scrim{
    position:fixed; inset:0;
    background:rgba(20,18,15,0.34);
    z-index:85;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .share-scrim.open{ opacity:1; pointer-events:auto; }
  .share-panel{
    position:fixed;
    left:50%;
    bottom:calc(var(--safe-bottom) + 16px);
    transform:translateX(-50%) translateY(16px);
    width:min(92vw, 420px);
    z-index:90;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .22s cubic-bezier(.22,.9,.32,1);
  }
  .share-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  .share-options{
    background:rgba(28,26,23,0.92);
    backdrop-filter:blur(24px) saturate(1.3);
    -webkit-backdrop-filter:blur(24px) saturate(1.3);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:16px;
    overflow:hidden;
    margin-bottom:10px;
    box-shadow:0 16px 38px rgba(0,0,0,0.34);
  }
  .share-options button{
    display:block;
    width:100%;
    padding:15px;
    background:transparent;
    border:none;
    color:var(--accent);
    font-size:16px;
    font-weight:600;
    font-family:inherit;
  }
  .share-options button + button{ border-top:1px solid rgba(255,255,255,0.1); }
  .share-options button:active{ background:rgba(255,255,255,0.08); }
  .share-cancel{
    display:block;
    width:100%;
    padding:15px;
    background:rgba(28,26,23,0.92);
    backdrop-filter:blur(24px) saturate(1.3);
    -webkit-backdrop-filter:blur(24px) saturate(1.3);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:16px;
    color:#F2EFE9;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    box-shadow:0 16px 38px rgba(0,0,0,0.3);
  }
  .share-cancel:active{ background:rgba(255,255,255,0.1); }
</style>
<!-- Supabase Client SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
  (async function guardAdminAccess() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.top.location.href = 'admin-login.html';
      return;
    }

    const { data: isAdmin, error } = await supabaseClient.rpc('is_admin');

    if (error || !isAdmin) {
      await supabaseClient.auth.signOut();
      window.top.location.href = 'admin-login.html';
    }
  })();

<script>
  // ---------- Dynamic table core ----------
  // Columns are user-defined (add/rename/delete). Each row stores its values
  // in `cells`, keyed by column id — so renaming a column never breaks data.
  let columns = [
    { id: 'no',      label: 'No',      type: 'no' },
    { id: 'tanggal', label: 'Tanggal', type: 'date' },
    { id: 'jam',     label: 'Jam',     type: 'time' }
  ];

  function nowDateLabel(){
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(-2);
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', "Jum'at", 'Sabtu'];
    return `${dd}/${mm}/${yy} • ${days[d.getDay()]}`;
  }
  function nowTimeLabel(){
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // "date"/"time" columns freeze their value the moment a row is created
  // (never recalculated on edit) — but stay editable if the user corrects them.
  function makeEmptyRowCells(cols){
    const cells = {};
    cols.forEach(col => {
      if (col.type === 'date') cells[col.id] = nowDateLabel();
      else if (col.type === 'time') cells[col.id] = nowTimeLabel();
      else cells[col.id] = '';
    });
    return cells;
  }

  let rows = [ { cells: makeEmptyRowCells(columns) } ];

  function renumber(){
    columns.filter(c => c.type === 'no').forEach(noCol => {
      rows.forEach((r, i) => { r.cells[noCol.id] = String(i + 1); });
    });
  }
  renumber();

  function newColId(){ return 'col_' + Math.random().toString(36).slice(2, 9); }

  // ---------- Header (columns) ----------
  function renderHeader(){
    const thead = document.getElementById('tableHead');
    thead.innerHTML = `<tr>${columns.map((col, idx) => `
      <th data-col-index="${idx}">
        <div class="th-inner">
          <span class="th-label" contenteditable="true" data-col-index="${idx}">${col.label}</span>
          <button class="th-menu-btn" data-col-index="${idx}" aria-label="Menu kolom">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle></svg>
          </button>
        </div>
      </th>`).join('')}<th style="min-width:36px;"></th></tr>`;
    bindHeaderEvents();
  }

  function bindHeaderEvents(){
    const thead = document.getElementById('tableHead');
    thead.querySelectorAll('.th-label').forEach(el => {
      el.addEventListener('focusin', () => { enterEditMode(); lastActiveCell = el; });
      el.addEventListener('input', () => {
        const idx = parseInt(el.dataset.colIndex, 10);
        if (!columns[idx]) return;
        const pre = snapshot();
        columns[idx].label = el.innerText;
        const post = snapshot();
        if (post !== pre) pushHistory(pre);
      });
    });
    thead.querySelectorAll('.th-menu-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openColumnMenu(e.currentTarget, parseInt(e.currentTarget.dataset.colIndex, 10));
      });
    });
  }

  function addColumnAfter(index, type){
    const pre = snapshot();
    const col = { id: newColId(), label: type === 'image' ? 'Gambar' : 'Kolom Baru', type: type };
    columns.splice(index + 1, 0, col);
    rows.forEach(r => { r.cells[col.id] = ''; });
    pushHistory(pre);
    renderHeader();
    renderRows();
  }

  function deleteColumn(index){
    if (columns.length <= 1) return; // always keep at least one column
    const pre = snapshot();
    const [removed] = columns.splice(index, 1);
    rows.forEach(r => { delete r.cells[removed.id]; });
    pushHistory(pre);
    renderHeader();
    renderRows();
  }

  function closeColumnMenu(){
    document.querySelectorAll('.col-menu, .menu-scrim').forEach(el => el.remove());
  }

  function openColumnMenu(btn, colIndex){
    closeColumnMenu();
    closeRowMenu();
    const scrim = document.createElement('div');
    scrim.className = 'menu-scrim';
    const menu = document.createElement('div');
    menu.className = 'row-menu col-menu';
    menu.innerHTML = `
      <button data-action="addcol">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="4.5" rx="1.2"></rect><rect x="3" y="14.5" width="18" height="4.5" rx="1.2"></rect><line x1="12" y1="9.5" x2="12" y2="14.5"></line></svg>
        Add Column
      </button>
      <button data-action="addimg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="3"></circle></svg>
        Add Gambar
      </button>
      <button data-action="delcol" class="danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 20 7"></polyline><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"></path><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg>
        Delete Column
      </button>
    `;
    document.body.appendChild(scrim);
    document.body.appendChild(menu);
    const r = btn.getBoundingClientRect();
    const menuW = 190;
    let left = r.right - menuW;
    let top = r.bottom + 6;
    const vw = window.innerWidth, vh = window.innerHeight;
    if (left < 8) left = 8;
    if (left + menuW > vw - 8) left = vw - 8 - menuW;
    if (top + 150 > vh - 8) top = r.top - 156;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.style.width = menuW + 'px';

    scrim.addEventListener('pointerdown', closeColumnMenu);
    menu.querySelector('[data-action="addcol"]').addEventListener('click', () => { addColumnAfter(colIndex, 'text'); closeColumnMenu(); });
    menu.querySelector('[data-action="addimg"]').addEventListener('click', () => { addColumnAfter(colIndex, 'image'); closeColumnMenu(); });
    menu.querySelector('[data-action="delcol"]').addEventListener('click', () => { deleteColumn(colIndex); closeColumnMenu(); });
  }

  // ---------- Rows ----------
  function renderRows(){
    const tbodyEl = document.getElementById('tableBody');
    tbodyEl.innerHTML = rows.map((r, idx) => {
      const cellsHtml = columns.map(col => {
        const val = r.cells[col.id] || '';
        if (col.type === 'image') {
          return `<td class="col-gambar">
            ${val
              ? `<div class="img-thumb-wrap">
                   <button class="img-thumb" data-img-row="${idx}" data-img-col="${col.id}"><img src="${val}" alt="Foto"></button>
                   <button class="img-remove" data-img-row="${idx}" data-img-col="${col.id}" aria-label="Hapus foto">×</button>
                 </div>`
              : `<button class="img-empty" data-img-row="${idx}" data-img-col="${col.id}" aria-label="Tambah foto">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="3"></circle></svg>
                 </button>`
            }
          </td>`;
        }
        return `<td contenteditable="true" data-field="${col.id}">${val}</td>`;
      }).join('');
      return `<tr>${cellsHtml}<td class="row-handle">
          <button class="row-menu-btn" aria-label="Menu baris">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="19" r="1.7"></circle></svg>
          </button>
        </td></tr>`;
    }).join('');
    bindRowEvents();
  }

  function rowIndexOf(el){
    const tr = el.closest('tr');
    return [...tbody().children].indexOf(tr);
  }
  function tbody(){ return document.getElementById('tableBody'); }

  function bindRowEvents(){
    // keep the data model in sync with anything the user types, AND capture
    // one undo step per keystroke (not per editing session) so undo/redo
    // moves one character at a time, like normal text undo.
    tbody().querySelectorAll('[data-field]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const idx = rowIndexOf(el);
        if (idx < 0) return;
        const pre = snapshot();
        rows[idx].cells[el.dataset.field] = el.innerText;
        const post = snapshot();
        if (post !== pre) pushHistory(pre);
      });
    });
    tbody().querySelectorAll('.row-menu-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        openRowMenu(e.currentTarget, rowIndexOf(e.currentTarget));
      });
    });
  }

  function addRowAfter(index){
    const pre = snapshot();
    rows.splice(index + 1, 0, { cells: makeEmptyRowCells(columns) });
    renumber();
    pushHistory(pre);
    renderRows();
    const p = clampPan(tx, ty, scale);
    tx = p.x; ty = p.y;
    apply();
  }

  function deleteRow(index){
    const pre = snapshot();
    rows.splice(index, 1);
    renumber();
    pushHistory(pre);
    renderRows();
    const p = clampPan(tx, ty, scale);
    tx = p.x; ty = p.y;
    apply();
  }

  // ---------- Undo / Redo ----------
  let historyStack = [];
  let redoStack = [];
  let noteTitle = document.getElementById('noteTitle').innerText;

  function snapshot(){
    return JSON.stringify({ rows, noteTitle, columns });
  }

  // preSnapshot: a JSON string from snapshot() for text/row/column changes,
  // or a canvas dataURL string for a completed pencil stroke.
  function pushHistory(preSnapshot, kind){
    historyStack.push({ kind: kind || 'text', data: preSnapshot });
    if (historyStack.length > 200) historyStack.shift();
    redoStack = [];
    updateUndoRedoUI();
  }

  function updateUndoRedoUI(){
    const undoBtn = document.getElementById('btnUndo');
    const redoBtn = document.getElementById('btnRedo');
    undoBtn.classList.toggle('disabled', historyStack.length === 0);
    redoBtn.classList.toggle('disabled', redoStack.length === 0);
  }

  function restoreState(state){
    rows = state.rows;
    noteTitle = state.noteTitle;
    columns = state.columns;
    renderHeader();
    renderRows();
    document.getElementById('noteTitle').innerText = noteTitle;
  }

  function undo(){
    if (!historyStack.length) return;
    const entry = historyStack.pop();
    if (entry.kind === 'draw') {
      redoStack.push({ kind: 'draw', data: drawCanvas.toDataURL() });
      applyDrawSnapshot(entry.data);
    } else {
      redoStack.push({ kind: 'text', data: snapshot() });
      restoreState(JSON.parse(entry.data));
    }
    updateUndoRedoUI();
  }

  function redo(){
    if (!redoStack.length) return;
    const entry = redoStack.pop();
    if (entry.kind === 'draw') {
      historyStack.push({ kind: 'draw', data: drawCanvas.toDataURL() });
      applyDrawSnapshot(entry.data);
    } else {
      historyStack.push({ kind: 'text', data: snapshot() });
      restoreState(JSON.parse(entry.data));
    }
    updateUndoRedoUI();
  }

  function addRowAfter(index){
    const pre = snapshot();
    rows.splice(index + 1, 0, {
      tanggal:'', hari:'', no:0, jam:nowTime(),
      pj:'', customer:'', barang:'', keluar:'--------', stok:'--------', ket:'', harga:'', gambar:''
    });
    renumber();
    pushHistory(pre);
    renderRows();
    const p = clampPan(tx, ty, scale);
    tx = p.x; ty = p.y;
    apply();
  }

  function deleteRow(index){
    const pre = snapshot();
    rows.splice(index, 1);
    renumber();
    pushHistory(pre);
    renderRows();
    const p = clampPan(tx, ty, scale);
    tx = p.x; ty = p.y;
    apply();
  }

  // ---------- Row ⋮ menu ----------
  function closeRowMenu(){
    document.querySelectorAll('.row-menu, .menu-scrim').forEach(el => el.remove());
  }

  function openRowMenu(btn, rowIndex){
    closeRowMenu();
    const scrim = document.createElement('div');
    scrim.className = 'menu-scrim';
    const menu = document.createElement('div');
    menu.className = 'row-menu';
    menu.innerHTML = `
      <button data-action="add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="4.5" rx="1.2"></rect><rect x="3" y="14.5" width="18" height="4.5" rx="1.2"></rect><line x1="12" y1="9.5" x2="12" y2="14.5"></line></svg>
        Add Row
      </button>
      <button data-action="delete" class="danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 20 7"></polyline><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"></path><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg>
        Delete Row
      </button>
    `;
    document.body.appendChild(scrim);
    document.body.appendChild(menu);

    const r = btn.getBoundingClientRect();
    const menuW = 190;
    let left = r.right - menuW;
    let top = r.bottom + 6;
    const vw = window.innerWidth, vh = window.innerHeight;
    if (left < 8) left = 8;
    if (left + menuW > vw - 8) left = vw - 8 - menuW;
    if (top + 100 > vh - 8) top = r.top - 106;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.style.width = menuW + 'px';

    scrim.addEventListener('pointerdown', closeRowMenu);
    menu.querySelector('[data-action="add"]').addEventListener('click', () => { addRowAfter(rowIndex); closeRowMenu(); });
    menu.querySelector('[data-action="delete"]').addEventListener('click', () => { deleteRow(rowIndex); closeRowMenu(); });
  }

  renderHeader();
  renderRows();
  updateUndoRedoUI();

  // ---------- Sinkronisasi Database (Supabase) ----------
  const urlParams = new URLSearchParams(window.location.search);
  let currentNoteId = urlParams.get('id') || null;
  const targetFolderId = urlParams.get('folder') || null;

  // Kalau ini buka note yang sudah ada, tarik isinya dari database
  // dan timpa tabel kosong bawaan dengan data aslinya.
  async function loadExistingNote() {
    if (!currentNoteId) return;

    const { data: note, error } = await supabaseClient
      .from('notes')
      .select('*')
      .eq('id', currentNoteId)
      .single();

    if (error || !note) {
      console.error('Gagal memuat note:', error && error.message);
      return;
    }

    if (note.content && note.content.columns && note.content.rows) {
      columns = note.content.columns;
      rows = note.content.rows;
    }

    noteTitle = note.title || '';
    document.getElementById('noteTitle').innerText = noteTitle;

    renderHeader();
    renderRows();

    historyStack = [];
    redoStack = [];
    updateUndoRedoUI();
  }

  loadExistingNote();

  // Bikin ringkasan singkat (preview) dari 2 kolom pertama (selain kolom "No")
  // buat ditampilkan di kartu grid dashboard admin.
  function buildPreviewText() {
    return columns
      .filter(c => c.type !== 'no')
      .slice(0, 2)
      .map(c => c.label || '')
      .join('\n');
  }

  function buildDateTag() {
    const d = new Date();
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return `${String(h).padStart(2, '0')}:${m} ${ampm}`;
  }

  // Simpan (insert kalau note baru, update kalau sudah ada) ke tabel 'notes'.
  async function saveNoteToDatabase() {
    const titleNow = document.getElementById('noteTitle').innerText.trim();

    const payload = {
      title: titleNow || 'Untitled',
      preview: buildPreviewText(),
      date_tag: buildDateTag(),
      content: { columns, rows }
    };

    let result;

    if (currentNoteId) {
      result = await supabaseClient
        .from('notes')
        .update(payload)
        .eq('id', currentNoteId)
        .select()
        .single();
    } else {
      result = await supabaseClient
        .from('notes')
        .insert({ ...payload, folder_id: targetFolderId })
        .select()
        .single();
    }

    if (result.error) {
      alert('Gagal menyimpan ke database: ' + result.error.message);
      return false;
    }

    currentNoteId = result.data.id; // biar klik ceklis berikutnya jadi update, bukan insert baru
    return true;
  }

  // Pressing Enter in any cell (header or body) moves focus to the next
  // editable cell in the same row, instead of inserting a line break.
  document.getElementById('notesTable').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    if (!e.target.matches('[contenteditable="true"]')) return;
    e.preventDefault();
    const cell = e.target.closest('td, th');
    if (!cell) return;
    let next = cell.nextElementSibling;
    while (next) {
      const editable = next.matches('[contenteditable="true"]') ? next : next.querySelector('[contenteditable="true"]');
      if (editable) { editable.focus(); break; }
      next = next.nextElementSibling;
    }
  });

  // ---------- Aa formatting panel ----------
  const formatPanel = document.getElementById('formatPanel');
  const btnAa = document.getElementById('btnAa');
  const fontSizeBtn = document.getElementById('fontSizeBtn');
  const fontSizeMenu = document.getElementById('fontSizeMenu');

  // Suppress/restore the on-screen keyboard for a cell without losing its
  // focus or text selection — needed so the Aa panel isn't covered by the
  // keyboard, while execCommand still has a valid target to format.
  function setKeyboardSuppressed(cell, suppressed){
    if (!cell || !document.body.contains(cell)) return;
    const isSuppressed = cell.getAttribute('inputmode') === 'none';
    if (suppressed === isSuppressed) return;
    const sel = window.getSelection();
    const range = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
    if (suppressed) cell.setAttribute('inputmode', 'none');
    else cell.removeAttribute('inputmode');
    cell.blur();
    cell.focus({ preventScroll: true });
    if (range) { sel.removeAllRanges(); sel.addRange(range); }
  }

  function openFormatPanel(){
    formatPanel.classList.add('open');
    btnAa.classList.add('active-tool');
    setKeyboardSuppressed(lastActiveCell, true);
  }
  function closeFormatPanel(restoreKeyboard){
    formatPanel.classList.remove('open');
    fontSizeMenu.classList.remove('open');
    btnAa.classList.remove('active-tool');
    if (restoreKeyboard !== false) setKeyboardSuppressed(lastActiveCell, false);
  }

  btnAa.addEventListener('mousedown', (e) => e.preventDefault()); // keep the cell's caret/selection alive
  btnAa.addEventListener('click', () => {
    if (formatPanel.classList.contains('open')) closeFormatPanel();
    else openFormatPanel();
  });

  // Every button inside the panel must not steal focus away from the
  // cell being edited — otherwise execCommand has nothing to act on.
  formatPanel.addEventListener('mousedown', (e) => {
    if (e.target.closest('button')) e.preventDefault();
  });

  function setActiveInGroup(buttons, activeBtn){
    buttons.forEach(b => b.classList.remove('fp-active'));
    if (activeBtn) activeBtn.classList.add('fp-active');
  }

  // Text style (H1–H4 / Body) — applied to the whole active cell
  const styleButtons = [...formatPanel.querySelectorAll('.fp-styles button')];
  const STYLE_MAP = {
    h1:{ size:'22px', weight:'800' },
    h2:{ size:'19px', weight:'750' },
    h3:{ size:'17px', weight:'700' },
    h4:{ size:'15px', weight:'650' },
    body:{ size:'13.5px', weight:'400' }
  };
  styleButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const cell = lastActiveCell;
      if (!cell) return;
      const s = STYLE_MAP[btn.dataset.style];
      cell.style.fontSize = s.size;
      cell.style.fontWeight = s.weight;
      setActiveInGroup(styleButtons, btn);
    });
  });

  // Bold / Italic / Underline / Strikethrough
  const cmdButtons = [...formatPanel.querySelectorAll('[data-cmd]')];
  cmdButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      document.execCommand(btn.dataset.cmd);
      updateInlineStates();
    });
  });

  function updateInlineStates(){
    cmdButtons.forEach(btn => {
      let active = false;
      try { active = document.queryCommandState(btn.dataset.cmd); } catch (err) {}
      btn.classList.toggle('fp-active', active);
    });
  }
  document.addEventListener('selectionchange', () => {
    if (lastActiveCell && document.activeElement === lastActiveCell) updateInlineStates();
  });

  // Indent / outdent — simple per-cell left padding steps
  formatPanel.querySelectorAll('[data-indent]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cell = lastActiveCell;
      if (!cell) return;
      const current = parseInt(cell.style.paddingLeft || '12', 10);
      const next = btn.dataset.indent === 'in' ? current + 16 : Math.max(12, current - 16);
      cell.style.paddingLeft = next + 'px';
    });
  });

  // Numbered / bullet / dash lists
  formatPanel.querySelectorAll('[data-list]').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.list;
      document.execCommand(type === 'ordered' ? 'insertOrderedList' : 'insertUnorderedList');
      const cell = lastActiveCell;
      if (cell) {
        const list = cell.querySelector('ul, ol');
        if (list) list.classList.toggle('list-dash', type === 'dash');
      }
    });
  });

  // Alignment
  const alignButtons = [...formatPanel.querySelectorAll('[data-align]')];
  const ALIGN_CMD = { left:'justifyLeft', center:'justifyCenter', right:'justifyRight' };
  alignButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      document.execCommand(ALIGN_CMD[btn.dataset.align]);
      setActiveInGroup(alignButtons, btn);
    });
  });

  // Font size dropdown
  fontSizeBtn.addEventListener('click', (e) => {
    e.stopPropagation();

  });
  const sizeOptionButtons = [...fontSizeMenu.querySelectorAll('button')];
  sizeOptionButtons.forEach(btn => {
    btn.addEventListener('click', () => {

  spacingButtons.forEach(btn => {

      setActiveInGroup(spacingButtons, btn);

  // ---------- Background picker ----------
  const BG_PRESETS = {
    none: null, // falls back to the default --paper color
    gradient: 'linear-gradient(160deg, #FFCC8F, #FF8A4C)',
    cream: '#ECE0C8',
    lined: 'repeating-linear-gradient(to bottom, transparent 0px, transparent 26px, rgba(28,27,25,0.14) 27px), #FCFAF3',
    grid: 'repeating-linear-gradient(to right, rgba(28,27,25,0.10) 0, rgba(28,27,25,0.10) 1px, transparent 1px, transparent 22px), repeating-linear-gradient(to bottom, rgba(28,27,25,0.10) 0, rgba(28,27,25,0.10) 1px, transparent 1px, transparent 22px), #FCFAF3'
  };

  const bgPanel = document.getElementById('bgPanel');
  const btnBackground = document.getElementById('btnBackground');
  const bgFileInput = document.getElementById('bgFileInput');
  const bgAddBtn = document.getElementById('bgAddBtn');
  const bgSwatchButtons = [...bgPanel.querySelectorAll('.bg-swatch[data-bg]')];

  bgSwatchButtons.forEach(btn => {
    const key = btn.dataset.bg;
    if (BG_PRESETS[key]) btn.style.background = BG_PRESETS[key];

  function setSelectedSwatch(btn){

  function applyBackground(css){

  const sharePanel = document.getElementById('sharePanel');

  // ---------- Checklist = Simpan ke Database ----------
  const btnChecklist = document.getElementById('btnChecklist');
  btnChecklist.addEventListener('click', async () => {

    if (btnChecklist.classList.contains('saving')) return; // cegah double-klik

    const originalOpacity = btnChecklist.style.opacity;

  // ---------- Camera / Gallery: attach a photo to a row ----------
  const cameraPanel = document.getElementById('cameraPanel');
  const cameraScrim = document.getElementById('cameraScrim');
  const cameraCaptureInput = document.getElementById('cameraCaptureInput');
  const cameraGalleryInput = document.getElementById('cameraGalleryInput');
  const btnCamera = document.getElementById('btnCamera');
  const imgPreviewScrim = document.getElementById('imgPreviewScrim');
  const imgPreviewPhoto = document.getElementById('imgPreviewPhoto');
  let pendingImageRowIndex = null;
  let pendingImageColId = null;

  function openCameraPanel(rowIndex, colId){
    if (rowIndex === null || rowIndex < 0 || !colId) return;
    pendingImageRowIndex = rowIndex;
    pendingImageColId = colId;
    setDrawMode(false);

  document.getElementById('cameraCancelBtn').addEventListener('click', closeCameraPanel);
  cameraPanel.querySelectorAll('[data-camsrc]').forEach(btn => {

  function handleImageFile(file){
    if (!file || pendingImageRowIndex === null || !pendingImageColId || !rows[pendingImageRowIndex]) return;
    const reader = new FileReader();
    reader.onload = () => {
      rows[pendingImageRowIndex].cells[pendingImageColId] = reader.result;
      renderRows();
    };
    reader.readAsDataURL(file);
  }
  cameraCaptureInput.addEventListener('change', (e) => { handleImageFile(e.target.files[0]); e.target.value = ''; });
  cameraGalleryInput.addEventListener('change', (e) => { handleImageFile(e.target.files[0]); e.target.value = ''; });

  imgPreviewScrim.addEventListener('click', () => imgPreviewScrim.classList.remove('open'));

  // Tapping a row's Gambar cell: empty → choose photo source; filled → preview.
  // The small × badge removes the photo, reverting the cell back to empty.
  tableBodyEl.addEventListener('click', (e) => {
    const removeBtn = e.target.closest('.img-remove');
    if (removeBtn) {
      const idx = parseInt(removeBtn.dataset.imgRow, 10);
      const colId = removeBtn.dataset.imgCol;
      if (rows[idx]) { rows[idx].cells[colId] = ''; renderRows(); }
      return;
    }
    const btn = e.target.closest('[data-img-row]');
    if (!btn) return;
    const idx = parseInt(btn.dataset.imgRow, 10);
    const colId = btn.dataset.imgCol;
    if (rows[idx] && rows[idx].cells[colId]) openImagePreview(rows[idx].cells[colId]);
    else openCameraPanel(idx, colId);
  });

  // Bottom-toolbar camera icon targets the last-edited row's first Gambar column
  btnCamera.addEventListener('click', () => {
    if (!lastActiveCell) return;
    const idx = rowIndexOf(lastActiveCell);
    const imgCol = columns.find(c => c.type === 'image');
    if (idx < 0 || !imgCol) return;
    openCameraPanel(idx, imgCol.id);
  });


  // ---------- Pencil: freehand annotation attached to the paper ----------
  const drawCanvas = document.getElementById('drawCanvas');
  const drawCtx = drawCanvas.getContext('2d');
  const btnPencil = document.getElementById('btnPencil');
  const pencilPanel = document.getElementById('pencilPanel');
  const pencilWheel = document.getElementById('pencilWheel');
  const pencilWheelCursor = document.getElementById('pencilWheelCursor');
  let drawMode = false;
  let currentColor = '#F2B705';
  let isDrawing = false;
  let lastDrawPoint = null;
  let preStrokeSnapshot = null;

  // drawCanvas lives inside #canvas (the pannable/zoomable element), so it
  // must be sized to the actual paper content (title+table), not the screen —
  // that's what makes strokes pan/zoom together with the table instead of
  // staying fixed on the glass on top of it.
  function syncDrawCanvasSize(){
    const targetW = Math.max(canvas.scrollWidth, 50);
    const targetH = Math.max(canvas.scrollHeight, 50);
    if (drawCanvas.dataset.paperW == targetW && drawCanvas.dataset.paperH == targetH) return;

    const hasContent = drawCanvas.width > 0 && drawCanvas.height > 0;
    const prevDataURL = hasContent ? drawCanvas.toDataURL() : null;

    const ratio = window.devicePixelRatio || 1;
    drawCanvas.width = targetW * ratio;
    drawCanvas.height = targetH * ratio;
    drawCanvas.style.width = targetW + 'px';
    drawCanvas.style.height = targetH + 'px';
    drawCtx.setTransform(1, 0, 0, 1, 0, 0);
    drawCtx.scale(ratio, ratio);
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';

    drawCanvas.dataset.paperW = targetW;
    drawCanvas.dataset.paperH = targetH;

    if (prevDataURL) applyDrawSnapshot(prevDataURL);
  }
  window.addEventListener('resize', syncDrawCanvasSize);
  requestAnimationFrame(syncDrawCanvasSize);

  function applyDrawSnapshot(dataURL){
    const img = new Image();
    img.onload = () => {
      drawCtx.save();
      drawCtx.setTransform(1, 0, 0, 1, 0, 0);
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.restore();
    };
    img.src = dataURL;
  }

  // Screen coordinates → paper-local coordinates, accounting for the
  // current pan/zoom scale (drawCanvas's own rect already reflects it).
  function screenToDrawCoords(e){
    const rect = drawCanvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale };
  }

  function setDrawMode(on){
    drawMode = on;
    if (on) syncDrawCanvasSize();
    drawCanvas.classList.toggle('active', on);
    btnPencil.classList.toggle('active-tool', on);
    pencilPanel.classList.toggle('open', on);
    if (on) { closeBgPanel(); closeSharePanel(); closeRowMenu(); closeCameraPanel(); }
  }
  btnPencil.addEventListener('click', () => setDrawMode(!drawMode));

  const pencilPresetSwatches = [...document.querySelectorAll('.pencil-swatch[data-color]')];
  function selectColor(hex){
    currentColor = hex;
    pencilWheelCursor.style.background = hex;
  }
  pencilPresetSwatches.forEach(sw => {
    sw.addEventListener('click', () => {
      selectColor(sw.dataset.color);
      pencilPresetSwatches.forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
    });
  });
  document.getElementById('pencilClearBtn').addEventListener('click', () => {
    const pre = drawCanvas.toDataURL();
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    pushHistory(pre, 'draw');
  });

  // ---------- Color wheel: hue = angle around center, saturation = distance ----------
  function hsvToHex(h, s, v){
    const c = v * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = v - c;
    let r = 0, g = 0, b = 0;
    if (h < 60)       { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else              { r = c; g = 0; b = x; }
    const toHex = n => Math.round((n + m) * 255).toString(16).padStart(2, '0');
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
  }

  function pickFromWheel(clientX, clientY){
    const rect = pencilWheel.getBoundingClientRect();
    const radius = rect.width / 2;
    let dx = clientX - (rect.left + radius);
    let dy = clientY - (rect.top + radius);
    let dist = Math.hypot(dx, dy);
    if (dist > radius) { dx = (dx / dist) * radius; dy = (dy / dist) * radius; dist = radius; }
    const angle = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
    const sat = Math.min(1, dist / radius);
    const hex = hsvToHex(angle, sat, 1);
    selectColor(hex);
    pencilPresetSwatches.forEach(s => s.classList.remove('selected'));
    pencilWheelCursor.style.left = (radius + dx) + 'px';
    pencilWheelCursor.style.top = (radius + dy) + 'px';
  }

  let wheelDragging = false;
  pencilWheel.addEventListener('pointerdown', (e) => {
    wheelDragging = true;
    pencilWheel.setPointerCapture(e.pointerId);
    pickFromWheel(e.clientX, e.clientY);
  });
  pencilWheel.addEventListener('pointermove', (e) => {
    if (!wheelDragging) return;
    pickFromWheel(e.clientX, e.clientY);
  });
  function endWheelDrag(){ wheelDragging = false; }
  pencilWheel.addEventListener('pointerup', endWheelDrag);
  pencilWheel.addEventListener('pointercancel', endWheelDrag);

  // ---------- Freehand strokes ----------
  drawCanvas.addEventListener('pointerdown', (e) => {
    isDrawing = true;
    drawCanvas.setPointerCapture(e.pointerId);
    preStrokeSnapshot = drawCanvas.toDataURL();
    lastDrawPoint = screenToDrawCoords(e);
  });
  drawCanvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    const p = screenToDrawCoords(e);
    drawCtx.strokeStyle = currentColor;
    drawCtx.lineWidth = 3;
    drawCtx.beginPath();
    drawCtx.moveTo(lastDrawPoint.x, lastDrawPoint.y);
    drawCtx.lineTo(p.x, p.y);
    drawCtx.stroke();
    lastDrawPoint = p;
  });
  function endDraw(){
    if (isDrawing && preStrokeSnapshot) pushHistory(preStrokeSnapshot, 'draw');
    isDrawing = false;
    lastDrawPoint = null;
    preStrokeSnapshot = null;
  }
  drawCanvas.addEventListener('pointerup', endDraw);
  drawCanvas.addEventListener('pointercancel', endDraw);

  // ---------- Zoom / Pan engine ----------
  const viewport = document.getElementById('content');
  const canvas = document.getElementById('canvas');
  const zoomIndicator = document.getElementById('zoomIndicator');

  const MAX_SCALE = 3;
  const PAN_SLACK = 36;      // hard edge slack
  const OVER_MAX = 70;       // max rubber-band overscroll while dragging
  const RESIST = 0.42;       // rubber-band resistance
  const FRICTION = 0.94;     // momentum decay per frame

  let scale = 1, tx = 0, ty = 0;
  let fitScale = 1; // dynamic zoom-out floor — "corner to corner" view
  const pointers = new Map();
  let lastMid = null;
  let lastDist = null;
  let indicatorTimer = null;

  // gesture/tap tracking (so pinch-end never gets mistaken for a tap)
  let gestureHadMultiTouch = false;
  let lastValidTapTime = 0;

  // velocity tracking for momentum fling
  let vx = 0, vy = 0, lastMoveT = 0;
  let momentumRAF = null;

  function clampScale(s){
    return Math.min(MAX_SCALE, Math.max(fitScale, s));
  }

  // Real on-screen clearance needed above/below the canvas so content never
  // hides behind the floating toolbars — measured directly in the viewport,
  // so it stays correct at any zoom level instead of shrinking with scale.
  function getChrome(){
    const topBar = (topbarEdit && topbarEdit.style.display === 'flex') ? topbarEdit : topbarNormal;
    const topRect = topBar.getBoundingClientRect();
    const bottomRect = document.querySelector('.bottombar').getBoundingClientRect();
    return {
      top: Math.max(0, topRect.bottom + 12),
      bottom: Math.max(0, window.innerHeight - bottomRect.top + 12)
    };
  }

  function panBounds(s){
    const vpRect = viewport.getBoundingClientRect();
    const cw = canvas.scrollWidth * s;
    const ch = canvas.scrollHeight * s;
    const chrome = getChrome();
    const availH = vpRect.height - chrome.top - chrome.bottom;
    let minX, maxX, minY, maxY;
    if (cw <= vpRect.width) { minX = maxX = (vpRect.width - cw) / 2; }
    else { maxX = PAN_SLACK; minX = vpRect.width - cw - PAN_SLACK; }
    if (ch <= availH) { minY = maxY = chrome.top; }
    else { maxY = chrome.top + PAN_SLACK; minY = vpRect.height - chrome.bottom - ch - PAN_SLACK; }
    return { minX, maxX, minY, maxY };
  }

  // hard clamp — used for settling, momentum, fit
  function clampPan(nx, ny, s){
    const b = panBounds(s);
    return { x: Math.min(b.maxX, Math.max(b.minX, nx)), y: Math.min(b.maxY, Math.max(b.minY, ny)) };
  }

  // soft clamp with resistance — used live while a finger is down, so the
  // edge gives a little instead of feeling like a hard wall
  function rubberClamp(nx, ny, s){
    const b = panBounds(s);
    function soft(v, min, max){
      if (min === max) return min; // nowhere to pan on this axis — lock it solid, no give
      if (v < min) return min - Math.min(OVER_MAX, (min - v)) * RESIST;
      if (v > max) return max + Math.min(OVER_MAX, (v - max)) * RESIST;
      return v;
    }
    return { x: soft(nx, b.minX, b.maxX), y: soft(ny, b.minY, b.maxY) };
  }

  function isOutOfBounds(s){
    const b = panBounds(s);
    return tx < b.minX - 0.5 || tx > b.maxX + 0.5 || ty < b.minY - 0.5 || ty > b.maxY + 0.5;
  }

  function apply(){
    canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function showIndicator(){
    zoomIndicator.textContent = Math.round(scale * 100) + '%';
    zoomIndicator.classList.add('show');
    clearTimeout(indicatorTimer);
    indicatorTimer = setTimeout(() => zoomIndicator.classList.remove('show'), 700);
  }

  // Snap smoothly back inside bounds (used after rubber-band overscroll)
  function settleBack(){
    const p = clampPan(tx, ty, scale);
    canvas.style.transition = 'transform .32s cubic-bezier(.16,.85,.35,1)';
    tx = p.x; ty = p.y;
    requestAnimationFrame(apply);
    setTimeout(() => { canvas.style.transition = ''; }, 340);
  }

  // Momentum fling after a single-finger flick release
  function startMomentum(){
    cancelAnimationFrame(momentumRAF);
    if (Math.abs(vx) < 0.02 && Math.abs(vy) < 0.02) return;
    function step(){
      tx += vx * 16;
      ty += vy * 16;
      vx *= FRICTION;
      vy *= FRICTION;
      const b = panBounds(scale);
      if (tx < b.minX) { tx = b.minX; vx = 0; }
      if (tx > b.maxX) { tx = b.maxX; vx = 0; }
      if (ty < b.minY) { ty = b.minY; vy = 0; }
      if (ty > b.maxY) { ty = b.maxY; vy = 0; }
      apply();
      if (Math.abs(vx) > 0.02 || Math.abs(vy) > 0.02) {
        momentumRAF = requestAnimationFrame(step);
      }
    }
    momentumRAF = requestAnimationFrame(step);
  }

  // Fit whole table into the viewport — this becomes the zoom-out floor
  function fitToScreen(animate){
    cancelAnimationFrame(momentumRAF);
    const vpRect = viewport.getBoundingClientRect();
    const naturalWidth = canvas.scrollWidth;
    if (!naturalWidth) return;
    fitScale = Math.min(1, (vpRect.width - 16) / naturalWidth);
    scale = fitScale;
    const p = clampPan(8, 0, scale);
    tx = p.x; ty = p.y;
    if (animate) {
      canvas.style.transition = 'transform .25s cubic-bezier(.22,.7,.32,1)';
      requestAnimationFrame(apply);
      setTimeout(() => canvas.style.transition = '', 260);
    } else {
      apply();
    }
  }

  function dist(a, b){
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  function mid(a, b){
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  const DRAG_THRESHOLD = 8; // px of movement before a touch counts as a drag, not a tap

  viewport.addEventListener('pointerdown', (e) => {
    // While the pencil/draw tool is active, the drawing canvas owns all touches —
    // the pan/pinch engine must stay completely out of the way.
    if (drawMode) return;

    // The row ⋮ menu lives outside #content, so it's never affected here.
    cancelAnimationFrame(momentumRAF);
    canvas.style.transition = '';

    pointers.set(e.pointerId, {
      x: e.clientX, y: e.clientY,
      startX: e.clientX, startY: e.clientY, startT: Date.now(),
      dragging: false, target: e.target
    });

    if (pointers.size === 1) {
      gestureHadMultiTouch = false;
      vx = 0; vy = 0; lastMoveT = performance.now();
    }
    if (pointers.size === 2) {
      gestureHadMultiTouch = true;
      // A second finger landing means this is definitely a pinch, not a tap-to-edit —
      // cancel any focus that might already be underway and take over the gesture.
      if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) {
        document.activeElement.blur();
      }
      viewport.setPointerCapture(e.pointerId);
      const [a, b] = [...pointers.values()];
      lastDist = dist(a, b);
      lastMid = mid(a, b);
      canvas.classList.add('pinching', 'panning');
    }
  });

  viewport.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;

    if (pointers.size === 2) {
      e.preventDefault();
      const [a, b] = [...pointers.values()];
      const newDist = dist(a, b);
      const newMid = mid(a, b);
      const vpRect = viewport.getBoundingClientRect();

      const newScale = clampScale(scale * (newDist / lastDist));
      const localX = (lastMid.x - vpRect.left - tx) / scale;
      const localY = (lastMid.y - vpRect.top - ty) / scale;
      let nx = (newMid.x - vpRect.left) - localX * newScale;
      let ny = (newMid.y - vpRect.top) - localY * newScale;
      scale = newScale;
      const cp = rubberClamp(nx, ny, scale);
      tx = cp.x; ty = cp.y;

      lastDist = newDist;
      lastMid = newMid;
      apply();
      showIndicator();
      return;
    }

    if (pointers.size === 1) {
      if (!p.dragging) {
        const moved = Math.hypot(p.x - p.startX, p.y - p.startY);
        if (moved < DRAG_THRESHOLD) return; // still could be a tap — don't touch anything yet
        // Threshold crossed: this is a real drag, not a tap. Take over the
        // gesture, and cancel any focus a tap-sensitive element may have grabbed.
        p.dragging = true;
        viewport.setPointerCapture(e.pointerId);
        canvas.classList.add('panning');
        if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) {
          document.activeElement.blur();
        }
      }
      e.preventDefault();
      const now = performance.now();
      const dt = Math.max(1, now - lastMoveT);
      const dx = e.movementX || 0, dy = e.movementY || 0;
      vx = vx * 0.7 + (dx / dt) * 0.3;
      vy = vy * 0.7 + (dy / dt) * 0.3;
      lastMoveT = now;

      const cp = rubberClamp(tx + dx, ty + dy, scale);
      tx = cp.x; ty = cp.y;
      apply();
    }
  });

  function endPointer(e){
    const wasP = pointers.get(e.pointerId);
    const wasSize = pointers.size;
    pointers.delete(e.pointerId);

    if (pointers.size < 2) { lastDist = null; lastMid = null; canvas.classList.remove('pinching'); }
    if (pointers.size === 0) {
      canvas.classList.remove('panning');

      // A "tap" is a single pointer that never crossed the drag threshold —
      // in that case we never touched focus/click, so native tap-to-edit
      // (or the ⋮ button, or any toolbar control) already behaved normally.
      const isEditableTap = wasP && wasP.target && wasP.target.closest &&
        wasP.target.closest('[contenteditable="true"]');
      let wasTap = false;
      if (wasSize === 1 && wasP && !wasP.dragging && !gestureHadMultiTouch) {
        const dt = Date.now() - wasP.startT;
        if (dt < 400) {
          wasTap = true;
          // Double-tap-to-fit only applies to taps on the canvas/table chrome —
          // never inside a cell, so double-tap-to-select-word (Excel-style)
          // works natively there instead of triggering a zoom reset.
          if (!isEditableTap) {
            const now = Date.now();
            if (now - lastValidTapTime < 300) {
              fitToScreen(true);
              showIndicator();
              lastValidTapTime = 0;
            } else {
              lastValidTapTime = now;
            }
          }
        }
      }

      if (!wasTap) {
        if (isOutOfBounds(scale)) {
          vx = 0; vy = 0;
          settleBack();
        } else if (!gestureHadMultiTouch) {
          startMomentum();
        }
      }

      gestureHadMultiTouch = false;
    }
  }
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('pointerleave', endPointer);

  // Desktop trackpad / mouse wheel: ctrl+wheel = zoom, plain wheel = pan
  viewport.addEventListener('wheel', (e) => {
    if (drawMode) return;
    e.preventDefault();
    cancelAnimationFrame(momentumRAF);
    canvas.style.transition = '';
    if (e.ctrlKey || e.metaKey) {
      const vpRect = viewport.getBoundingClientRect();
      const newScale = clampScale(scale * (1 - e.deltaY * 0.012));
      const localX = (e.clientX - vpRect.left - tx) / scale;
      const localY = (e.clientY - vpRect.top - ty) / scale;
      let nx = (e.clientX - vpRect.left) - localX * newScale;
      let ny = (e.clientY - vpRect.top) - localY * newScale;
      scale = newScale;
      const p = clampPan(nx, ny, scale);
      tx = p.x; ty = p.y;
      showIndicator();
    } else {
      const p = clampPan(tx - e.deltaX, ty - e.deltaY, scale);
      tx = p.x; ty = p.y;
    }
    apply();
  }, { passive: false });

  window.addEventListener('resize', () => fitToScreen(false));
  window.addEventListener('load', () => fitToScreen(false));
  requestAnimationFrame(() => fitToScreen(false));
</script>

</body>
</html>
