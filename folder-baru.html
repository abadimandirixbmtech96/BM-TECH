<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folder Baru</title>
<style>
  :root{--paper:#F6F1E7;--card:#FBF8F2;--ink:#1C1B19;--soft:#6B6459;--line:#E4DDCC;--accent:#C9932F;--accent-ink:#fff;--danger:#C24444;--r:16px}
  body.dark{--paper:#15140F;--card:#1E1D17;--ink:#EDEAE2;--soft:#9B948A;--line:#332F27;--accent:#D9A536;--accent-ink:#1C1B19}
  *{box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:var(--paper)}
  .back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
  .top h2{margin:0;font-size:20px}.top span{font-size:13px;color:var(--soft)}
  main{padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:560px;margin:0 auto}
  label.t{display:block;font-weight:700;font-size:14px;margin:18px 0 8px}
  .hint{font-weight:500;color:var(--soft);font-size:12.5px}
  input[type=text],select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);font-size:15px;outline:none}
  input[type=text]:focus,select:focus{border-color:var(--accent)}
  .swatches{display:flex;flex-wrap:wrap;gap:10px}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
  .sw.on{border-color:var(--ink)}
  .seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
  .seg button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{padding:8px 13px;border-radius:999px;border:1.5px dashed var(--accent);background:transparent;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
  .col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
  .col.off{opacity:.5}
  .col .row{display:flex;gap:8px;margin-bottom:8px}.col .row>*:first-child{flex:1.3}.col .row>*:last-child{flex:1}
  .col input[type=text],.col select{padding:10px 12px;font-size:14px}
  .bot{display:flex;align-items:center;gap:6px}.bot .sp{flex:1}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
  .ib{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer}
  .ib.d{color:var(--danger)}
  .add{width:100%;padding:13px;border-radius:var(--r);border:1.5px dashed var(--line);background:transparent;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
  .save{width:100%;margin-top:26px;padding:16px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:800;cursor:pointer}
  .save:disabled{opacity:.6}
  .err{display:none;margin-top:14px;padding:12px 14px;border-radius:var(--r);background:rgba(194,68,68,.12);color:var(--danger);font-size:13.5px;font-weight:600}
  .msg{padding:40px 16px;text-align:center;color:var(--soft)}
</style>
</head>
<body>
<div class="top">
  <button class="back" id="btnBack" aria-label="Kembali">&#8249;</button>
  <div><h2 id="ttl">Folder Baru</h2><span>Atur nama, warna, dan kolom isian</span></div>
</div>
<main id="app">
  <label class="t" for="fName">Nama folder</label>
  <input type="text" id="fName" placeholder="Contoh: Buku Servis" autocomplete="off" maxlength="40">

  <label class="t">Warna</label>
  <div class="swatches" id="sws"></div>

  <label class="t">Waktu pencatatan <span class="hint">(Tanggal &amp; Jam)</span></label>
  <div class="seg" id="seg">
    <button type="button" data-m="auto">Auto</button>
    <button type="button" data-m="manual">Manual</button>
  </div>
  <div class="hint" id="segHint" style="margin-top:8px"></div>

  <label class="t">Kolom isian <span class="hint">(Nomor, Tanggal, Jam sudah otomatis)</span></label>
  <div class="quick">
    <button type="button" class="chip" data-q="PJ">+ PJ</button>
    <button type="button" class="chip" data-q="Customer">+ Customer</button>
    <button type="button" class="chip" data-q="bukbes">Isi seperti Buku Besar</button>
  </div>
  <div id="cols"></div>
  <button type="button" class="add" id="btnAdd">+ Tambah kolom</button>

  <div class="err" id="err"></div>
  <button class="save" id="btnSave">Simpan Folder</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const supabaseClient = supabase.createClient('https://zgzmbneqqzxnptbmlhsz.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpnem1ibmVxcXp4bnB0Ym1saHN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTU0ODksImV4cCI6MjEwMzM3MTQ4OX0.MQOtu5Pg2PtxIu18joKDd0dOA17cPEazmlL0Xl3Vz7E', {
    auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage, storageKey: 'bmtech-auth' }
  });

  if (localStorage.getItem('bm-theme') !== 'light') document.body.classList.add('dark');

  (async function guard() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.top.location.href = 'admin-login.html'; return; }
    const { data: isAdmin, error } = await supabaseClient.rpc('is_admin');
    if (error) return;
    if (!isAdmin) { await supabaseClient.auth.signOut(); window.top.location.href = 'admin-login.html'; }
  })();

  const COLORS = ['#8B5CF6', '#D6409F', '#E2683C', '#0EA5A4', '#6366F1', '#E5546B', '#84A12B', '#A0643A'];
  const TYPES = [['text', 'Teks pendek'], ['long', 'Teks panjang'], ['number', 'Angka'], ['money', 'Rupiah'], ['date', 'Tanggal'], ['select', 'Pilihan (dropdown)'], ['image', 'Foto / bukti']];
  const RESERVED = ['no', 'nomor', 'tanggal', 'jam', 'waktu'];
  const BUKU_BESAR = [['PJ', 'text', true], ['Customer', 'text', false], ['Barang', 'text', true], ['Barang Keluar', 'text', false], ['Stok Barang', 'text', false], ['Keterangan', 'long', false], ['Harga', 'money', false], ['Bukti', 'image', false]];

  const editId = new URLSearchParams(location.search).get('id');
  let color = COLORS[0], timeMode = 'auto', cols = [], otherNames = [];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const key = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const uid = () => 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function close() {
    if (window.parent !== window) window.parent.postMessage('close-editor', '*');
    else location.href = 'dashboard-admin.html';
  }
  $('btnBack').onclick = close;

  function addCol(label, type, required) {
    const blank = label && cols.find(c => c.isNew && !c.hidden && !c.label.trim());
    if (blank) { blank.label = label; blank.type = type || 'text'; blank.required = !!required; return; }
    cols.push({ id: uid(), label: label || '', type: type || 'text', required: !!required, options: [], isNew: true });
  }

  function renderSwatches() {
    $('sws').innerHTML = COLORS.map(c => `<div class="sw ${c === color ? 'on' : ''}" data-c="${c}" style="background:${c}"></div>`).join('');
  }
  function renderSeg() {
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === timeMode));
    $('segHint').textContent = timeMode === 'auto'
      ? 'Tanggal dan jam terisi otomatis saat data disimpan.'
      : 'Di editor muncul isian tanggal dan jam yang bisa kamu atur sendiri (cocok untuk data susulan).';
  }
  function renderCols() {
    $('cols').innerHTML = cols.map((c, i) => `
      <div class="col ${c.hidden ? 'off' : ''}" data-i="${i}">
        <div class="row">
          <input type="text" class="c-label" placeholder="Nama kolom" value="${esc(c.label)}" maxlength="30" ${c.hidden ? 'disabled' : ''}>
          <select class="c-type" ${c.hidden ? 'disabled' : ''}>${TYPES.map(t => `<option value="${t[0]}" ${t[0] === c.type ? 'selected' : ''}>${t[1]}</option>`).join('')}</select>
        </div>
        ${c.type === 'select' && !c.hidden ? `<div class="row" style="display:block"><input type="text" class="c-opts" placeholder="Opsi dipisah koma, contoh: Lunas, Belum" value="${esc((c.options || []).join(', '))}"></div>` : ''}
        <div class="bot">
          <label class="chk"><input type="checkbox" class="c-req" ${c.required ? 'checked' : ''} ${c.hidden ? 'disabled' : ''}> Wajib diisi</label>
          <span class="sp"></span>
          ${c.hidden ? '<button type="button" class="ib" data-a="show">Tampilkan</button>' : `
          <button type="button" class="ib" data-a="up">&uarr;</button>
          <button type="button" class="ib" data-a="down">&darr;</button>
          <button type="button" class="ib d" data-a="del">${c.isNew ? 'Hapus' : 'Sembunyikan'}</button>`}
        </div>
      </div>`).join('');
  }
  function renderAll() { renderSwatches(); renderSeg(); renderCols(); }

  $('sws').addEventListener('click', e => { const s = e.target.closest('.sw'); if (s) { color = s.dataset.c; renderSwatches(); } });
  $('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { timeMode = b.dataset.m; renderSeg(); } });
  $('btnAdd').onclick = () => { addCol(); renderCols(); const l = document.querySelectorAll('.c-label'); l[l.length - 1].focus(); };

  document.querySelector('.quick').addEventListener('click', e => {
    const q = e.target.closest('[data-q]'); if (!q) return;
    const v = q.dataset.q;
    if (v === 'bukbes') {
      BUKU_BESAR.forEach(([l, t, r]) => { if (!cols.some(c => !c.hidden && key(c.label) === key(l))) addCol(l, t, r); });
    } else if (!cols.some(c => !c.hidden && key(c.label) === key(v))) addCol(v, 'text', v === 'PJ');
    renderCols();
  });

  $('cols').addEventListener('input', e => {
    const card = e.target.closest('.col'); if (!card) return;
    const c = cols[+card.dataset.i];
    if (e.target.classList.contains('c-label')) c.label = e.target.value;
    else if (e.target.classList.contains('c-opts')) c.options = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
    else if (e.target.classList.contains('c-req')) c.required = e.target.checked;
  });
  $('cols').addEventListener('change', e => {
    if (!e.target.classList.contains('c-type')) return;
    cols[+e.target.closest('.col').dataset.i].type = e.target.value; renderCols();
  });
  $('cols').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const i = +b.closest('.col').dataset.i, a = b.dataset.a;
    if (a === 'up' && i > 0) [cols[i - 1], cols[i]] = [cols[i], cols[i - 1]];
    else if (a === 'down' && i < cols.length - 1) [cols[i + 1], cols[i]] = [cols[i], cols[i + 1]];
    else if (a === 'del') { if (cols[i].isNew) cols.splice(i, 1); else cols[i].hidden = true; }
    else if (a === 'show') cols[i].hidden = false;
    renderCols();
  });

  function showErr(m) { const el = $('err'); el.textContent = m; el.style.display = m ? 'block' : 'none'; if (m) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

  function validate(name) {
    if (!name) return 'Nama folder wajib diisi.';
    if (otherNames.includes(key(name))) return 'Nama folder "' + name + '" sudah dipakai.';
    const active = cols.filter(c => !c.hidden);
    if (!active.length) return 'Tambahkan minimal 1 kolom isian.';
    const seen = new Set();
    for (const c of active) {
      const k = key(c.label);
      if (!k) return 'Ada kolom yang namanya masih kosong.';
      if (RESERVED.includes(k)) return 'Nama kolom "' + c.label + '" dipakai otomatis oleh sistem. Pakai nama lain.';
      if (seen.has(k)) return 'Nama kolom "' + c.label + '" dobel.';
      seen.add(k);
      if (c.type === 'select' && (c.options || []).length < 2) return 'Kolom "' + c.label + '" butuh minimal 2 opsi pilihan.';
    }
    return '';
  }

  $('btnSave').onclick = async () => {
    const name = $('fName').value.trim();
    const before = cols.length;
    cols = cols.filter(c => !(c.isNew && !c.hidden && !c.label.trim()));
    if (cols.length !== before) renderCols();
    const bad = validate(name);
    showErr(bad); if (bad) return;
    const schema = {
      v: 1, timeMode,
      columns: cols.filter(c => c.hidden || c.label.trim()).map(c => {
        const o = { id: c.id, label: c.label.trim(), type: c.type, required: !!c.required };
        if (c.type === 'select') o.options = c.options || [];
        if (c.hidden) o.hidden = true;
        return o;
      })
    };
    $('btnSave').disabled = true; $('btnSave').textContent = 'Menyimpan...';
    const q = supabaseClient.from('folders');
    const { error } = editId ? await q.update({ name, color, schema }).eq('id', editId) : await q.insert({ name, color, schema });
    if (error) { showErr('Gagal menyimpan: ' + error.message); $('btnSave').disabled = false; $('btnSave').textContent = 'Simpan Folder'; return; }
    close();
  };

  (async function init() {
    const { data: all, error: e1 } = await supabaseClient.from('folders').select('id, name');
    if (e1) { $('app').innerHTML = '<div class="msg">Gagal memuat data — cek koneksi lalu buka ulang.</div>'; return; }
    otherNames = (all || []).filter(f => f.id !== editId).map(f => key(f.name));
    ['amin', 'bm', 'mail', 'kuswanto', 'yono'].forEach(n => otherNames.push(n));

    if (editId) {
      $('ttl').textContent = 'Edit Folder';
      const { data: f, error } = await supabaseClient.from('folders').select('*').eq('id', editId).single();
      if (error || !f) { $('app').innerHTML = '<div class="msg">Folder tidak ditemukan.</div>'; return; }
      if (!f.schema || !Array.isArray(f.schema.columns)) { $('app').innerHTML = '<div class="msg">Folder ini bersifat permanen dan tidak bisa diedit di sini.</div>'; return; }
      $('fName').value = f.name; color = f.color || color; timeMode = f.schema.timeMode === 'manual' ? 'manual' : 'auto';
      cols = f.schema.columns.map(c => ({ ...c, isNew: false }));
      if (!COLORS.includes(color)) COLORS.push(color);
    } else {
      addCol('', 'text', false);
    }
    renderAll();
  })();
</script>
</body>
</html>
