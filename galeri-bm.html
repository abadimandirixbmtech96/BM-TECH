<style>
:root{--bg:#000;--card:#141416;--line:rgba(255,255,255,.08);--acc:#F0A529;--acc-glow:rgba(240,165,41,.28);--op:#8B5CF6;--tx:#fff;--tx2:#7C7C82;--tx3:#4A4A4F;--pill:rgba(255,255,255,.09);--pill-b:rgba(255,255,255,.12);--sk-a:rgba(255,255,255,.04);--sk-b:rgba(255,255,255,.1);--bar:rgba(0,0,0,.45);--bar-pill:rgba(26,25,28,.55);--r:16px;--rx:22px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.18,.85,.3,1)}
body.theme-light{--bg:#F5F5F7;--card:#fff;--line:rgba(0,0,0,.08);--tx:#000;--tx2:#8E8E93;--tx3:#A1A1A6;--pill:rgba(0,0,0,.06);--pill-b:rgba(0,0,0,.08);--sk-a:rgba(0,0,0,.04);--sk-b:rgba(0,0,0,.1);--bar:rgba(245,245,247,.6);--bar-pill:rgba(255,255,255,.55);color-scheme:light}
body.font-serif *{font-family:Georgia,'Times New Roman',Times,serif!important}
body.font-mono *{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace!important}
body.font-rounded *{font-family:ui-rounded,'SF Pro Rounded','Baloo 2','Segoe UI',sans-serif!important}
body.font-klasik *{font-family:'Times New Roman',Times,Georgia,serif!important}
body.font-humanis *{font-family:Verdana,Tahoma,Geneva,sans-serif!important}
body.font-kompak *{font-family:'Arial Narrow','Segoe UI',Arial,sans-serif!important}
body.font-custom *{font-family:'BMCustom','Inter',sans-serif!important}
body.font-bold-mode *{font-weight:700!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;-webkit-touch-callout:none;user-select:none;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit;text-decoration:none;-webkit-user-drag:none}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:background-color .3s,color .3s}
.top{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(var(--st) + 10px) 16px 12px;background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-bottom:1px solid var(--line)}
.head{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px}
.rb{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--pill);color:var(--tx);display:grid;place-items:center;position:relative;transition:transform .18s var(--ease)}
.rb:active{transform:scale(.86)}
.rb svg{width:22px;height:22px}
.rb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;font-size:16px}
.ht{flex:1;min-width:0}
.ht h1{font-size:20px;font-weight:700;line-height:1.2}
.ht p{font-size:13px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{max-width:640px;margin:0 auto;padding:calc(var(--st) + 84px) 16px calc(var(--sb) + 110px);animation:pageIn .5s var(--ease) both;transition:opacity .22s,transform .22s}

.flt{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;scroll-snap-align:start;min-height:40px;padding:0 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:7px;transition:transform .18s var(--ease),background .2s,color .2s,border-color .2s}
.chip:active{transform:scale(.93)}
.chip b{font-size:12px;font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1C1B19}
.chip.on b{color:rgba(28,27,25,.65)}
.chip i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dchip{flex-direction:column;gap:1px;justify-content:center;min-width:64px;padding:0 12px;min-height:52px;text-align:center;line-height:1.15}
.dchip span{font-size:14px;font-weight:700}
.dchip small{font-size:11px;font-weight:600;opacity:.7}
.dchip.on small{opacity:.75}
.day{margin-top:22px}
.dh{position:sticky;top:calc(var(--st) + 68px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 -4px 10px;border-radius:14px;background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);width:calc(100% + 8px);text-align:left}
.dh:active{transform:scale(.99)}
.dh .dt{flex:1;min-width:0}
.dh b{display:block;font-size:14.5px;font-weight:700}
.dh small{display:block;font-size:12px;color:var(--tx2);margin-top:1px}
.dh svg{width:16px;height:16px;color:var(--tx2);flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tl{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .2s var(--ease);animation:fadeIn .35s ease both}
.tl:active{transform:scale(.95)}
.tl img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;background:var(--sk-a)}
.tl.bad img{display:none}
.tl.bad::before{content:'';position:absolute;inset:0;background:var(--sk-a)}
.tl .sh{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;line-height:1.2}
.tl .sh b{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .sh small{display:block;font-size:10.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tl .tg{position:absolute;top:6px;left:6px;display:flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tl .tg i{width:7px;height:7px;border-radius:50%}
.tl .pn{position:absolute;top:6px;right:6px;padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.more{display:block;margin:22px auto 0;padding:13px 28px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.more:active{transform:scale(.94)}
.skg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.sk{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:linear-gradient(100deg,var(--sk-a) 30%,var(--sk-b) 50%,var(--sk-a) 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.state{text-align:center;padding:64px 24px;animation:fadeIn .45s var(--ease) both}
.state .si{width:68px;height:68px;margin:0 auto 16px;border-radius:50%;background:var(--pill);display:grid;place-items:center;color:var(--tx2)}
.state .si svg{width:30px;height:30px}
.state h3{font-size:17px;font-weight:700}
.state p{font-size:13.5px;color:var(--tx2);margin-top:6px;line-height:1.5}
.state .retry{margin-top:20px;padding:12px 26px;border-radius:999px;background:var(--acc);color:#1C1B19;font-weight:700;font-size:14px}
.state .retry:active{transform:scale(.92)}
.bbar{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 14px);max-width:640px;margin:0 auto;padding:0 16px;display:flex;align-items:center;z-index:40;transition:bottom .28s var(--ease)}
.bbar.active{bottom:calc(var(--kb,0px) + 10px)}
.cx{width:0;height:52px;flex-shrink:0;margin-right:0;border-radius:50%;overflow:hidden;background:var(--bar-pill);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);box-shadow:inset 0 0 0 1px var(--pill-b),0 4px 18px rgba(0,0,0,.18);display:grid;place-items:center;opacity:0;transform:scale(.5);pointer-events:none;transition:width .3s var(--ease),margin .3s var(--ease),opacity .2s,transform .3s var(--ease)}

.sp{flex:1;min-width:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;border-radius:999px;background:var(--bar-pill);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);border:1px solid var(--pill-b);box-shadow:0 4px 18px rgba(0,0,0,.18);transition:border-color .25s,box-shadow .25s}
.sp:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-glow),0 4px 18px rgba(0,0,0,.18)}
.sp>svg{width:19px;height:19px;color:var(--tx2);flex-shrink:0}
.sp input{flex:1;min-width:0;height:100%;background:transparent;border:none;color:var(--tx);font-size:16px;font-weight:500}
.sp input::placeholder{color:var(--tx2)}
.qx{width:24px;height:24px;border-radius:50%;background:var(--pill);display:grid;place-items:center;opacity:0;transform:scale(.5);pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.qx.show{opacity:1;transform:none;pointer-events:auto}
.qx svg{width:12px;height:12px;color:var(--tx2)}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 88px + var(--kb,0px));transform:translate(-50%,24px) scale(.92);padding:12px 20px;border-radius:999px;background:var(--card);border:1px solid var(--pill-b);box-shadow:0 10px 34px rgba(0,0,0,.35);font-size:14px;font-weight:600;opacity:0;pointer-events:none;z-index:90;transition:opacity .25s,transform .35s var(--ease);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.vw{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
.vw.on{display:flex;flex-direction:column}
.stg{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.stg.zm{cursor:move}
.stg img{max-width:100%;max-height:100%;object-fit:contain;will-change:transform;transform-origin:center center;pointer-events:none;-webkit-user-drag:none}
.stg img.bl{filter:blur(8px)}
.vt{position:absolute;left:0;right:0;z-index:3;transition:opacity .25s,transform .25s}
.vt{top:0;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 8px) max(10px,env(safe-area-inset-right)) 26px max(10px,env(safe-area-inset-left));background:linear-gradient(rgba(0,0,0,.72),transparent)}
.vt .tt{flex:1;min-width:0;line-height:1.25}
.vt .tt b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt .tt small{opacity:.72;font-size:12px}
.vbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);flex-shrink:0}
.vbtn:active{background:rgba(255,255,255,.28)}
.vbtn svg{width:22px;height:22px}
.vb{position:relative;flex-shrink:0;z-index:3;padding:14px max(14px,env(safe-area-inset-right)) calc(var(--sb) + 12px) max(14px,env(safe-area-inset-left));background:#0c0c0e;border-radius:20px 20px 0 0;border-top:1px solid rgba(255,255,255,.08)}
.vw.hb .vt{opacity:0;transform:translateY(-12px);pointer-events:none}
.vw.hb .vb{display:none}
.inf{max-width:640px;margin:0 auto;max-height:42vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}
.inf::-webkit-scrollbar{display:none}
.ih{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.ih b{font-size:17px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih em{font-style:normal;font-size:15px;font-weight:700;color:var(--acc);flex-shrink:0;font-variant-numeric:tabular-nums}
.ic{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.ic span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;font-weight:600}
.ic i{width:8px;height:8px;border-radius:50%}
.kv{display:grid;grid-template-columns:86px 1fr;gap:5px 10px;margin-top:8px;font-size:13.5px;line-height:1.4}
.kv dt{color:rgba(255,255,255,.6);font-weight:600}
.kv dd{font-weight:600;word-break:break-word;-webkit-user-select:text;user-select:text}
.ia{display:flex;gap:8px;margin-top:12px}
.ia a,.ia button{flex:1;min-height:46px;border-radius:14px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:700;text-align:center}

.page{max-width:1600px;padding-left:32px;padding-right:32px}

.grid,.skg{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dh{margin:0 0 12px;width:100%}
.tl .sh b{font-size:13.5px}.tl .sh small{font-size:12px}.tl .tg,.tl .pn{font-size:11.5px}

@media (max-width:359px){.grid,.skg{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

function recordsOf(note,folderId){
var c=note&&note.content;if(!c||!Array.isArray(c.records))return[];
var kind=c.schema==='admin-data-v1'?'bb':c.schema==='operasional-data-v1'?'op':null;if(!kind)return[];
var out=[];
c.records.forEach(function(r,i){
if(!r||!Array.isArray(r.bukti))return;
var ph=r.bukti.filter(function(u){return typeof u==='string'&&u.trim()});
if(!ph.length)return;
var d=r.created_at?new Date(r.created_at):null;
if(!d||isNaN(d))d=note.created_at?new Date(note.created_at):new Date(0);
out.push({id:r.id||('r'+i),src:kind,noteId:note.id,folderId:folderId||note.folder_id||'',no:i+1,ts:d,day:dayKey(d),
name:kind==='bb'?str(r.customer):str(r.buyer),
item:kind==='bb'?str(r.barang):str(r.item),
pj:kind==='bb'?str(r.pj):str(r.seller),
ket:str(r.keterangan),harga:money(r.harga),metode:str(r.metode),photos:ph.map(function(u){return u.trim()})});
});
return out}

async function loadData(){
renderSkeleton();subEl.textContent='Memuat data...';
try{
var notes=await fetchNotes();
ALL=[];
notes.forEach(function(x){recordsOf(x.note,x.folder).forEach(function(r){ALL.push(r)})});
buildTiles();
$('flt').hidden=!ALL.length;
if(!ALL.length){renderState(IC_IMG,'Belum ada foto bukti','Foto yang diunggah sebagai bukti di Buku Besar dan Operasional akan terkumpul di sini.');subEl.textContent='Belum ada foto';return}
if(TILES.length){var f=TILES[TILES.length-1].r.day,l=TILES[0].r.day;var dp=$('dpick');dp.min=f;dp.max=l}
renderAll()
}catch(err){
console.error('Gagal memuat galeri bukti:',err&&err.message?err.message:err);
subEl.textContent='Gagal memuat';
$('flt').hidden=true;
renderState(IC_ALERT,'Gagal memuat data','Periksa koneksi internet Anda lalu coba lagi.',loadData)}}

(async function guard(){
renderSkeleton();
var OK='bm-admin-ok';
function wt(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
function localUid(){try{var raw=localStorage.getItem('bmtech-auth');var j=raw?JSON.parse(raw):null;return(j&&j.user&&j.user.id)?j.user.id:null}catch(e){return null}}
var okUid=null;try{okUid=localStorage.getItem(OK)}catch(e){}
var uid=localUid(),optimistic=!!uid&&uid===okUid,early=null;
if(optimistic)early=loadData();
try{
var s=await wt(sb.auth.getSession(),8000);var session=s.data.session;
if(!session){try{localStorage.removeItem(OK)}catch(e){}window.location.href='admin-login.html';return}
var a=await wt(sb.rpc('is_admin'),8000);
if(a.error)throw a.error;
if(!a.data){try{localStorage.removeItem(OK)}catch(e){}await sb.auth.signOut();window.location.href='admin-login.html';return}
try{localStorage.setItem(OK,session.user.id)}catch(e){}
}catch(err){
console.error('Gagal cek akses admin:',err&&err.message?err.message:err);
if(optimistic)return;
subEl.textContent='Gagal memuat';
renderState(IC_ALERT,'Gagal memeriksa akses','Periksa koneksi internet Anda lalu coba lagi.',function(){window.location.reload()});
return}
if(!early)loadData()})();
})();
</script>
