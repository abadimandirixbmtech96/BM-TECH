<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Galeri BM</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="/manifest-admin.json">

<style>
:root{--accent:#F0A529;--accent-yellow:#F0A529;--on-accent:#1C1B19}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{--bg:#F5F5F7;--card:#fff;--text:#000;--muted:#7a7a80;--line:rgba(0,0,0,.09);--soft:rgba(118,118,128,.12);--danger:#e5484d;--ok:#2fa66a;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 22px -10px rgba(0,0,0,.18);--tile:108px;background:var(--bg);color:var(--text);font-family:var(--bm-font,'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:contain}
body:not(.theme-light){--bg:#000;--card:#121214;--text:#fff;--muted:#8a8a90;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.09);--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 24px -10px rgba(0,0,0,.7)}
body.font-bold-mode *{font-weight:700!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);padding-top:calc(env(safe-area-inset-top,0px) + 10px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.sc{border-color:var(--line)}
.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.round{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;transition:transform .15s}
.round:active{transform:scale(.93)}
.bar h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.bar .tt{flex:1;min-width:0}
.bar .tt small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{height:44px;padding:0 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;flex:none}
.pill.on{background:var(--accent);color:var(--on-accent)}
.tools{display:flex;gap:8px;margin:8px 0 2px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--soft);padding:0 40px 0 40px;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .i{position:absolute;left:12px;top:11px;color:var(--muted);width:20px;height:20px}
.search .x{position:absolute;right:4px;top:2px;width:40px;height:40px;display:none;place-items:center;color:var(--muted)}
.search.has .x{display:grid}
.sort{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--soft);padding:0 8px;font-size:14px;width:118px;flex:none;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{color:var(--muted);font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on small{color:inherit;opacity:.7}
.chip.add{border-style:dashed;color:var(--muted)}
.sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 2px 0;font-size:12.5px;color:var(--muted)}
.meter{flex:1;min-width:110px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.meter b{display:block;height:100%;background:var(--accent);border-radius:3px;min-width:2px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-size:13px;color:var(--muted)}
.dh b{color:var(--text);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:6px}
.tl{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);cursor:pointer;contain:layout paint}
.tl img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;opacity:0;transition:opacity .25s}
.tl img.ld{opacity:1}
.tl .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.tl .st{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.45);color:#ffd45e;display:grid;place-items:center}
.tl .st .i{width:14px;height:14px;fill:currentColor}
.tl .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 5px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-size:11px;line-height:1.25;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .ck{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);display:none;place-items:center;color:var(--on-accent)}
.sel .tl .ck{display:grid}
.tl.on .ck{background:var(--accent);border-color:var(--accent)}
.tl.on{outline:3px solid var(--accent);outline-offset:-3px}
.tl.on img{transform:scale(.9);border-radius:8px}
.tl .ex{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 6px}
@media (hover:hover){.tl:hover .cap{opacity:1}}
@media (min-width:700px){body{--tile:150px}.grid{gap:8px}}
@media (min-width:1100px){body{--tile:176px}}
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty .big{width:84px;height:84px;border-radius:26px;background:var(--soft);display:grid;place-items:center;margin:0 auto 16px}
.empty .big .i{width:40px;height:40px}
.empty h2{margin:0 0 6px;color:var(--text);font-size:18px}
.empty p{margin:0 auto 18px;max-width:320px;font-size:14px;line-height:1.5}
.more{display:block;margin:18px auto;height:44px;padding:0 22px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(20px,calc(env(safe-area-inset-bottom) + 14px));width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 26px -6px rgba(0,0,0,.5);z-index:25;transition:transform .2s}
.fab:active{transform:scale(.92)}
.fab .i{width:28px;height:28px;stroke-width:2.2}
.fab[hidden]{display:none}
.acts{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px max(12px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left));background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:none;justify-content:center;gap:4px}
.sel .acts{display:flex}
.acts button{flex:1;max-width:120px;min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600}
.acts button:disabled{opacity:.35;pointer-events:none}
.acts button:active{background:var(--soft)}
.acts .dg{color:var(--danger)}
.sel .fab{display:none}
.sel main{padding-bottom:96px}
main{padding-bottom:110px;min-height:50vh}
.sh{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sh .scr{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:auto}
.sh .pn{position:relative;pointer-events:auto;width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);-webkit-overflow-scrolling:touch}
.sh.on .scr{opacity:1}.sh.on .pn{transform:none}
.sh.out .scr{opacity:0}.sh.out .pn{transform:translateY(100%)}
.sh .pn::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:-10px auto 14px}
@media (min-width:700px){.sh{align-items:center}.sh .pn{border-radius:24px;transform:translateY(24px) scale(.97);opacity:0;transition:transform .22s,opacity .2s}.sh.on .pn{opacity:1}.sh.out .pn{opacity:0;transform:translateY(16px) scale(.98)}.sh .pn::before{display:none}}
.pn h3{margin:0 0 6px;font-size:18px;font-weight:800}
.pn .mu,.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bt{min-height:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;width:100%}
.bt.sec{background:var(--soft);color:var(--text)}
.bt.ghost{background:transparent;color:var(--muted);margin-top:4px}
.bt.dg{background:var(--danger);color:#fff}
.bt:active{opacity:.85}
.bt:disabled{opacity:.45;pointer-events:none}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.fld input,.fld select,.fld textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:12px 14px;font-size:15px;outline:none;min-height:46px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:42px;padding:0 12px;border-radius:12px;background:var(--soft);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.lr{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:52px;width:100%;text-align:left}
.lr:last-child{border-bottom:0}
.lr>div{flex:1;min-width:0}
.lr b{display:block;font-size:14.5px;word-break:break-word}
.lr small{color:var(--muted);font-size:12px;display:block;margin-top:2px;word-break:break-word}
.lr .i{color:var(--muted)}
.lr.dg b,.lr.dg .i{color:var(--danger)}
.lr .tg{font-size:12px;font-weight:700;color:var(--accent)}
.kv{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{flex:0 0 112px;color:var(--muted)}
.kv span:last-child{flex:1;min-width:0;word-break:break-word;-webkit-user-select:text;user-select:text}
.kv code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
.hd{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px}
.lg{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
.lg:last-child{border-bottom:0}
.lg small{display:block;color:var(--muted);font-size:11.5px}
.vw{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
.vw.on{display:block}
.vw .stg{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.vw .stg.zm{cursor:move}
.vw img{max-width:100%;max-height:100%;object-fit:contain;will-change:transform;transform-origin:center center;pointer-events:none;-webkit-user-drag:none}
.vw img.bl{filter:blur(8px)}
.vt,.vb{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));transition:opacity .25s,transform .25s}
.vt{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:26px;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.vb{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding-top:26px;background:linear-gradient(transparent,rgba(0,0,0,.75));justify-content:center}
.vw.hb .vt{opacity:0;transform:translateY(-12px);pointer-events:none}
.vw.hb .vb{opacity:0;transform:translateY(12px);pointer-events:none}
.vt .ttl{flex:1;min-width:0;line-height:1.25}
.vt .ttl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt .ttl small{opacity:.7;font-size:12px}
.vbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.vbtn:active{background:rgba(255,255,255,.25)}
.vbtn.fv{color:#ffd45e}.vbtn.fv .i{fill:currentColor}
.vb button.tx{flex:1;max-width:110px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;border-radius:12px}
.vb button.tx:active{background:rgba(255,255,255,.14)}
.vb .dg{color:#ff7b80}
.nv{position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:none;place-items:center;z-index:3}
.nv.l{left:14px}.nv.r{right:14px}
@media (hover:hover) and (min-width:700px){.nv{display:grid}.vw.hb .nv{opacity:0}}
.nv[disabled]{opacity:.25;pointer-events:none}
.prog{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.prog>div{width:min(340px,100%);background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.prog b{display:block;font-size:16px;margin-bottom:4px}
.prog small{display:block;color:var(--muted);font-size:13px;margin-bottom:14px;word-break:break-word}
.prog .meter{height:8px;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,20px);z-index:90;max-width:min(92vw,460px);background:#2b2b2f;color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:800;padding:6px 4px;white-space:nowrap}
.drop{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--accent) 22%,rgba(0,0,0,.6));border:4px dashed var(--accent);display:none;place-items:center;font-size:22px;font-weight:800;pointer-events:none;color:#fff}
.drop.on{display:grid}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media (max-width:359px){.pill span{display:none}.pill{padding:0 12px}}
</style>
</head>

<script>
(function(){try{var b=document.body,T=window.BMTheme,theme=T?T.get(T.KEYS.theme):localStorage.getItem('bm-theme'),bold=T?T.get(T.KEYS.bold):localStorage.getItem('bm-font-bold');if(theme==='light')b.classList.add('theme-light');if(bold==='on')b.classList.add('font-bold-mode')}catch(e){}})();

  <div class="vb" id="vBot"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
