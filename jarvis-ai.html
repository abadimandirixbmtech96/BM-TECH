<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Jarvis AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/bm-theme.js"></script>
<script>
  (function () { try { var r = document.documentElement; if (localStorage.getItem('bm-theme') === 'light') r.classList.add('theme-light'); if (localStorage.getItem('bm-font-bold') === 'on') r.classList.add('bold-mode'); } catch (e) {} })();
</script>
<style>
:root{--bg:#000;--surface:#121214;--surface2:#1d1d21;--border:rgba(255,255,255,.08);--text:#fff;--text-2:#8a8a90;--accent:#F0A529;--accent-rgb:240,165,41;--on-accent:#1C1B19;
--glass-pill-bg:rgba(255,255,255,.09);--glass-pill-border:rgba(255,255,255,.12);--text-secondary:#8a8a90;--accent-yellow:#F0A529;--danger:#e5484d;
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--g1:#7c5cff;--g2:#2f9bff;--g3:#22d3b0}
:root.theme-light{--bg:#f4f4f6;--surface:#fff;--surface2:#ececf0;--border:rgba(0,0,0,.09);--text:#111;--text-2:#6b6b72;--glass-pill-bg:rgba(0,0,0,.06);--glass-pill-border:rgba(0,0,0,.1);--text-secondary:#6b6b72;--on-accent:#1C1B19}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body.bold-mode,:root.bold-mode body{font-weight:600}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#boot[hidden]{display:none}
#boot p{margin:0;color:var(--text-2);font-size:14px;max-width:300px;line-height:1.5}
#boot .btn{padding:11px 22px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700}
/* header */
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-top)) 14px 6px;flex:none}
.gl{background:var(--glass-pill-bg);border:1px solid var(--glass-pill-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ttl{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 6px;border-radius:12px;font-size:19px;font-weight:700;letter-spacing:.01em}
.ttl svg.i{width:16px;height:16px;opacity:.7;transition:transform .2s}.ttl.open svg.i{transform:rotate(180deg)}
.pill{margin-left:auto;display:flex;align-items:center;border-radius:999px;padding:3px}
.pill button{width:44px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .2s,color .2s}
.pill button.on{color:var(--text)}.pill button:active{background:rgba(127,127,127,.2)}
.pill .sep{width:1px;height:18px;background:var(--glass-pill-border)}
.pill button.off svg{opacity:.45}
/* log + home */
#bmj-log{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
#home{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 0 4px;width:100%}
.orb{width:84px;height:84px;border-radius:50%;position:relative;margin-bottom:8px;background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,.0) 28%),conic-gradient(from 210deg,var(--g1),var(--g2),var(--g3),var(--g1));box-shadow:0 0 38px rgba(124,92,255,.45),0 0 70px rgba(47,155,255,.25),inset 0 0 18px rgba(255,255,255,.35);animation:orb 5s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:22%;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 14px rgba(124,92,255,.7)}
@keyframes orb{50%{transform:scale(1.06);box-shadow:0 0 52px rgba(124,92,255,.6),0 0 90px rgba(47,155,255,.35),inset 0 0 18px rgba(255,255,255,.35)}}
#home h1{margin:0;font-size:26px;font-weight:800}
#home .sub{margin:0 0 10px;color:var(--text-2);font-size:14px;line-height:1.5;max-width:320px}
.ban{width:100%;max-width:440px;text-align:left;border-radius:22px;padding:16px 16px 16px 18px;color:#fff;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#6a4cff 0%,#2f8bff 55%,#20cfb0 100%);box-shadow:0 10px 30px rgba(70,90,255,.28);transition:transform .15s}
.ban:active{transform:scale(.98)}
.ban b{display:block;font-size:15.5px;margin-bottom:3px}.ban span{font-size:12.5px;opacity:.92;line-height:1.4}
.ban .go{margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:none}
.sugs{display:flex;flex-direction:column;gap:9px;width:100%;max-width:440px;margin-top:14px}
.sug{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);text-align:left;font-size:14px;font-weight:600;transition:transform .12s,background .2s}
.sug:active{transform:scale(.98);background:var(--surface2)}
.sug .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(124,92,255,.16);color:#a590ff;flex:none}
.sug .ic svg.i{width:18px;height:18px}
.sug small{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:999px;background:linear-gradient(120deg,#6a4cff,#20cfb0);color:#fff}
/* composer */
.comp{flex:none;padding:6px 14px calc(10px + var(--safe-bottom))}
.cbox{display:flex;align-items:flex-end;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.cbox .ib{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-2);transition:background .2s,color .2s,transform .12s}
.cbox .ib:active{transform:scale(.9)}
#in{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.4;padding:10px 4px;max-height:132px;height:42px}
#in::placeholder{color:var(--text-2)}
#mic.rec{background:var(--danger);color:#fff;animation:bmjPulse 1s infinite}
#send{background:var(--text);color:var(--bg)}#send.stop{background:var(--accent);color:var(--on-accent)}
.ftn{margin:7px 0 0;text-align:center;font-size:11px;color:var(--text-2)}
/* overlay, drawer */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}.ov.on{opacity:1;pointer-events:auto}
#drw{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(86vw,340px);background:var(--surface);transform:translateX(-104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:var(--safe-top);box-shadow:8px 0 40px rgba(0,0,0,.35)}
#drw.on{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.dh .nm{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .nm small{display:block;font-weight:500;font-size:12px;color:var(--text-2);margin-top:1px}
.dh .gear{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.dmenu{padding:2px 10px 6px}
.mi{width:100%;display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:14px;font-size:15px;font-weight:600;text-align:left;transition:background .15s}
.mi:active{background:var(--surface2)}.mi svg.i{color:var(--text-2)}
.srch{margin:4px 14px 4px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:14px;background:var(--surface2)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14.5px;padding:10px 0}
.srch svg.i{width:17px;height:17px;color:var(--text-2)}
#hist{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 110px;-webkit-overflow-scrolling:touch}
.gh{padding:14px 10px 6px;font-size:12.5px;font-weight:700;color:var(--text-2)}
.row{display:flex;align-items:center;gap:6px;padding:0 4px 0 12px;border-radius:14px;min-height:46px;transition:background .15s}
.row:active{background:var(--surface2)}.row.cur{background:var(--surface2)}
.row .rt{flex:1;min-width:0;padding:12px 0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rk{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none}
.row .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--text-2);flex:none;display:none;align-items:center;justify-content:center;margin-right:2px}
.sel .row .ck{display:flex}.sel .row .rk{display:none}
.row.on .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.row .ck svg{width:12px;height:12px;stroke:currentColor;stroke-width:3;fill:none;opacity:0}.row.on .ck svg{opacity:1}
.empty{padding:28px 18px;text-align:center;color:var(--text-2);font-size:13.5px;line-height:1.5}
.dfoot{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + var(--safe-bottom));display:flex;justify-content:flex-end;gap:8px;pointer-events:none;background:linear-gradient(to top,var(--surface) 55%,transparent)}
.dfoot>*{pointer-events:auto}
.newp{display:flex;align-items:center;gap:8px;padding:13px 20px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.selbar{display:none;align-items:center;gap:8px;width:100%}.sel .selbar{display:flex}.sel .newp{display:none}
.selbar button{flex:1;padding:12px 8px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface2)}
.selbar button.dg{background:var(--danger);color:#fff}.selbar button:disabled{opacity:.45}
/* popover model */
#mpop{position:fixed;z-index:50;left:14px;top:calc(60px + var(--safe-top));width:min(88vw,330px);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .18s,transform .18s}
#mpop.on{opacity:1;transform:none;pointer-events:auto}
.mo{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;text-align:left}
.mo:active,.mo.cur{background:var(--surface2)}
.mo .t{flex:1;min-width:0}.mo .t b{display:block;font-size:14.5px}.mo .t small{display:block;color:var(--text-2);font-size:12px;margin-top:1px}
.mo .ck{color:var(--accent);opacity:0}.mo.cur .ck{opacity:1}
.mcus{display:flex;gap:6px;padding:8px 6px 4px}.mcus input{flex:1;min-width:0;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:9px 11px;font:inherit;font-size:13.5px;outline:0}
.mcus button{padding:0 14px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px}
/* sheet + dialog + toast */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:760px;margin:0 auto;max-height:84vh;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;border:1px solid var(--border);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-bottom)}
#sheet.on{transform:none}
#sov{z-index:60}
.sh{display:flex;align-items:center;padding:16px 18px 8px;font-weight:800;font-size:16px}.sh span{flex:1}
.sh button{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.sb{overflow-y:auto;padding:2px 12px 14px}
.sb .mi small{display:block;font-weight:500;font-size:12px;color:var(--text-2);margin-top:1px}.sb .mi .tt{flex:1;min-width:0}
.mi.dg,.mi.dg svg.i{color:var(--danger)}
.sw{width:46px;height:28px;border-radius:999px;background:var(--surface2);position:relative;flex:none;transition:background .2s;border:1px solid var(--border)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--text-2);transition:transform .2s,background .2s}
.sw.on{background:rgba(var(--accent-rgb),.28);border-color:var(--accent)}.sw.on::after{transform:translateX(18px);background:var(--accent)}
.note{padding:10px 12px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.dov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;animation:bmjIn .2s ease}
.dbx{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:20px}
.dbx h3{margin:0 0 6px;font-size:17px}.dbx p{margin:0 0 14px;color:var(--text-2);font-size:14px;line-height:1.5}
.dbx input{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:14px;padding:12px;font:inherit;font-size:16px;outline:0;margin-bottom:14px}
.dbt{display:flex;gap:8px}.dbt button{flex:1;padding:12px;border-radius:14px;background:var(--surface2);font-weight:700}
.dbt button.ok{background:var(--accent);color:var(--on-accent)}.dbt button.dg{background:var(--danger);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translate(-50%,16px);z-index:90;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ---- gaya jawaban (dipakai bersama panel Jarvis) ---- */
.bmj-m{max-width:86%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bmj-u{align-self:flex-end;background:var(--accent-yellow,#F0A529);color:var(--on-accent,#1C1B19);border-bottom-right-radius:5px}
.bmj-a{align-self:flex-start;background:var(--glass-pill-bg,rgba(255,255,255,.09));border-bottom-left-radius:5px}
.bmj-s{align-self:center;font-size:12px;color:var(--text-secondary,#8a8a90);text-align:center}
.bmj-r{align-self:stretch;max-width:100%;display:flex;flex-direction:column;gap:8px}
.bmj-steps{border:1px solid var(--glass-pill-border,rgba(255,255,255,.12));border-radius:14px;background:var(--glass-pill-bg,rgba(255,255,255,.05));overflow:hidden;font-size:13px}
.bmj-sh{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bmj-sh .t{flex:1;min-width:0}.bmj-sh .c{opacity:.55;font-size:11px;transition:transform .2s}.bmj-steps.open .c{transform:rotate(180deg)}
.bmj-sl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}.bmj-steps.open .bmj-sl,.bmj-steps.live .bmj-sl{grid-template-rows:1fr}
.bmj-si{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:7px;padding:0 12px}.bmj-si::after{content:"";height:3px;flex:none}
.bmj-st{display:flex;gap:9px;align-items:flex-start;line-height:1.35;animation:bmjIn .25s ease}
.bmj-st .x{flex:1;min-width:0}.bmj-st .x small{display:block;color:var(--text-secondary,#8a8a90);font-size:12px;margin-top:1px}
@keyframes bmjIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bmj-ic{flex:0 0 16px;width:16px;height:16px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.bmj-ic.run{border:2px solid rgba(var(--accent-rgb,240,165,41),.25);border-top-color:var(--accent-yellow,#F0A529);border-radius:50%;animation:bmjSpin .7s linear infinite}
.bmj-ic.ok{color:#2fb36b}.bmj-ic.err{color:#e5484d}
@keyframes bmjSpin{to{transform:rotate(360deg)}}
.bmj-ans{background:var(--glass-pill-bg,rgba(255,255,255,.09));border-radius:16px;border-bottom-left-radius:5px;padding:11px 13px;font-size:14px;line-height:1.55;word-break:break-word}
.bmj-ans>*:first-child{margin-top:0}.bmj-ans>*:last-child{margin-bottom:0}
.bmj-ans h3{font-size:15px;margin:10px 0 6px;font-weight:800}
.bmj-ans p{margin:6px 0}.bmj-ans ul,.bmj-ans ol{margin:6px 0;padding-left:20px}.bmj-ans li{margin:2px 0}
.bmj-tw{margin:9px -4px;border:1px solid var(--glass-pill-border,rgba(255,255,255,.14));border-radius:11px;overflow:auto;max-height:340px;-webkit-overflow-scrolling:touch}
.bmj-tw table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
.bmj-tw th{position:sticky;top:0;background:rgba(var(--accent-rgb,240,165,41),.92);color:var(--on-accent,#1C1B19);text-align:left;font-weight:800;padding:7px 10px}
.bmj-tw td{padding:6px 10px;border-top:1px solid var(--glass-pill-border,rgba(255,255,255,.1))}
.bmj-tw tr:nth-child(even) td{background:rgba(127,127,127,.07)}
.bmj-tw .n{text-align:right;font-variant-numeric:tabular-nums}
.bmj-acts{display:flex;gap:8px;flex-wrap:wrap}
.bmj-acts button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--glass-pill-border,rgba(255,255,255,.16));background:var(--glass-pill-bg,rgba(255,255,255,.09));color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.bmj-acts button.pri{background:var(--accent-yellow,#F0A529);color:var(--on-accent,#1C1B19);border-color:transparent}.bmj-acts button:disabled{opacity:.55}
.bmj-acts svg{width:15px;height:15px}
.bmj-p{align-self:stretch;border:1px solid rgba(var(--accent-rgb,240,165,41),.6);border-radius:14px;padding:11px 12px;font-size:13px;background:rgba(var(--accent-rgb,240,165,41),.08)}
.bmj-p b{display:block;margin-bottom:6px;font-size:13.5px}
.bmj-p dl{margin:0 0 9px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}.bmj-p dt{color:var(--text-secondary,#8a8a90)}.bmj-p dd{margin:0;word-break:break-word}
.bmj-pb{display:flex;gap:8px}.bmj-pb button{flex:1;padding:9px;border-radius:11px;border:1px solid var(--glass-pill-border,rgba(255,255,255,.14));background:var(--glass-pill-bg,rgba(255,255,255,.09));color:inherit;font:inherit;font-weight:700;cursor:pointer}
.bmj-pb button.ok{background:var(--accent-yellow,#F0A529);color:var(--on-accent,#1C1B19);border-color:transparent}.bmj-pb button:disabled{opacity:.5}
/* animasi halus */
#bmj-log{scroll-behavior:smooth}
.bmj-m,.bmj-r,.bmj-p,.bmj-chips{animation:bmjIn .32s cubic-bezier(.2,.8,.2,1) both}
.bmj-u{animation-name:bmjPop}@keyframes bmjPop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.bmj-caret{display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:text-bottom;background:var(--accent-yellow,#F0A529);animation:bmjBlink .9s steps(1) infinite}
@keyframes bmjBlink{50%{opacity:0}}
.bmj-fade{animation:bmjIn .45s cubic-bezier(.2,.8,.2,1) both}
.bmj-tw tbody tr{transition:opacity .35s ease,transform .35s ease}.bmj-tw tbody tr.hid{opacity:0;transform:translateY(6px)}
.bmj-tw{transition:opacity .3s ease}
.bmj-sh{transition:background .2s}.bmj-sh:active{background:rgba(127,127,127,.12)}

      supabaseClient = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage, storageKey: 'bmtech-auth' } });
      var r = await wt(supabaseClient.auth.getSession(), 8000); session = r.data && r.data.session;
    } catch (e) { return bootMsg('Koneksi lambat, belum bisa memeriksa sesi login.', 'Coba lagi', function () { location.reload(); }); }
    if (!session) { location.replace('/admin-login.html'); return; }
    try { var a = await wt(supabaseClient.rpc('is_admin'), 8000); if (a.error) throw a.error; isAdmin = a.data; } catch (e) { return bootMsg('Belum bisa memverifikasi akses admin. Periksa koneksi lalu coba lagi.', 'Coba lagi', function () { location.reload(); }); }
    if (isAdmin !== true) return bootMsg('Jarvis AI hanya untuk admin.', 'Kembali', exitPage);
    var u = session.user || {}, meta = u.user_metadata || {}, nm = meta.full_name || meta.name || (u.email || 'Admin').split('@')[0];
    nm = nm.charAt(0).toUpperCase() + nm.slice(1);
    $('dNm').textContent = nm; $('dAv').textContent = nm.charAt(0).toUpperCase();

    el.log = $('bmj-log'); el.in = $('in'); el.mic = $('mic'); el.send = $('send');
    buildHome(nm); showHome(); try { var lc = JSON.parse(ls('bm-jarvis-last') || 'null'); ls('bm-jarvis-last', ''); if (lc && Date.now() - lc.t < 30 * 60e3) { var oc = store.chats.filter(function (x) { return x.id === lc.id; })[0]; if (oc) { chat = oc; restore(oc); } } } catch (e) {} paintModel(); paintSpk(); syncBtns(); paintHist();
    $('boot').hidden = true; $('app').hidden = false;

    $('bMenu').onclick = openDrawer; $('ov').onclick = closeDrawer; $('bExit').onclick = exitPage;
    $('bModel').onclick = function (e) { e.stopPropagation(); if ($('mpop').classList.contains('on')) closeModelPop(); else openModelPop(); };
    document.addEventListener('click', function (e) { if ($('mpop').classList.contains('on') && !e.target.closest('#mpop') && !e.target.closest('#bModel')) closeModelPop(); });
    $('bSpk').onclick = function () { voiceOut = !voiceOut; ls(LS_VOICE, voiceOut ? '1' : '0'); if (!voiceOut) stopSpeak(); paintSpk(); toast(voiceOut ? 'Suara jawaban aktif' : 'Suara jawaban mati'); };
    $('bPlus').onclick = quickSheet; $('dQuick').onclick = quickSheet; $('bSet').onclick = settingsSheet;
    $('dModel').onclick = function () { closeDrawer(); setTimeout(openModelPop, 280); };
    $('dMgr').onclick = function () { if (!store.chats.length) return toast('Belum ada riwayat'); setSel(!sel); };
    $('dNew').onclick = newChat; $('dSearch').oninput = paintHist;
    $('sDone').onclick = function () { setSel(false); };
    $('sAll').onclick = function () { var all = store.chats.length === selCount(); sel = {}; if (!all) store.chats.forEach(function (c) { sel[c.id] = 1; }); paintHist(); updSel(); };
    $('sDel').onclick = function () { if (selCount()) delChats(Object.keys(sel)); };
    $('sov').onclick = $('shX').onclick = closeSheet;
    el.in.addEventListener('input', function () { autoGrow(); syncBtns(); });
    el.in.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !(window.matchMedia && matchMedia('(pointer:coarse)').matches)) { e.preventDefault(); if (!busy) submit(el.in.value); } });
    el.send.onclick = function () { if (busy) stopAll(); else submit(el.in.value); };
    el.mic.onclick = function () { listening ? stopListen() : startListen(); };
    if (!SR) el.mic.style.opacity = '.45';
    document.addEventListener('visibilitychange', function () { if (document.visibilityState !== 'visible') { stopListen(); } });
    window.addEventListener('pagehide', function () { stopSpeak(); });
    window.__jarvisAI = { store: function () { return store; }, submit: submit };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
