<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>System Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* Terapkan warna tersimpan secepat mungkin supaya tidak berkedip */
  (function () {
    try {
      var hex = localStorage.getItem('bm-accent');
      if (!/^#[0-9a-fA-F]{6}$/.test(hex || '')) return;
      var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      var s = document.documentElement.style;
      s.setProperty('--accent', hex);
      s.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
      s.setProperty('--accent-glow', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.28)');
      s.setProperty('--on-accent', (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1C1B19' : '#FFFFFF');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #000000;
    --surface: #121214;
    --border: rgba(255, 255, 255, 0.08);
    --text: #FFFFFF;
    --text-2: #7C7C82;
    --accent: #F0A529;
    --accent-rgb: 240, 165, 41;
    --accent-glow: rgba(240, 165, 41, 0.28);
    --on-accent: #1C1B19;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.theme-light {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --border: rgba(0, 0, 0, 0.08);
    --text: #000000;
    --text-2: #8E8E93;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    outline: none;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  input { -webkit-user-select: text; user-select: text; }
  ::selection { background: rgba(var(--accent-rgb), 0.35); color: inherit; }

  html, body { background: var(--bg); color: var(--text); min-height: 100%; }
  body {
    padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 32px) 16px;
    max-width: 560px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  body.sheet-open { overflow: hidden; }

  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  .top { display: flex; align-items: center; gap: 12px; padding: 4px 0 18px; }
  .back {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border);
    transition: transform .15s ease;
  }
  .back:active { transform: scale(0.88); }
  .back svg { width: 20px; height: 20px; }
  .top h1 { font-size: 22px; font-weight: 800; }
  [dir="rtl"] .back svg, [dir="rtl"] .chev { transform: scaleX(-1); }

  /* Kartu */
  .group { margin-bottom: 22px; }
  .group-title { font-size: 15px; font-weight: 700; margin: 0 4px 4px; }
  .group-hint { font-size: 13px; color: var(--text-2); margin: 0 4px 10px; line-height: 1.45; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 16px;
  }

  /* Pratinjau */
  .preview { display: flex; flex-direction: column; gap: 12px; }
  .pv-title { font-size: 18px; font-weight: 700; }
  .pv-sub { font-size: 13px; color: var(--text-2); line-height: 1.45; }
  .pv-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pv-btn {
    padding: 10px 18px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
    font-weight: 700; font-size: 14px;
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  .pv-chip {
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(var(--accent-rgb), 0.15); color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.55);
  }
  .pv-amount { margin-inline-start: auto; font-weight: 800; font-size: 16px; }

  /* Baris bahasa */
  .lang-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: start;
    padding: 16px;
  }
  .lang-row:active { transform: scale(0.99); }
  .lang-value { font-size: 15px; font-weight: 600; }
  .chev { width: 18px; height: 18px; color: var(--text-2); flex: none; }

  /* Palet warna */
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw {
    aspect-ratio: 1; border-radius: 50%;
    background: var(--c);
    position: relative;
    border: 2px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
    transition: transform .15s ease;
  }
  .sw:active { transform: scale(0.88); }
  .sw[aria-pressed="true"] { border-color: var(--text); }
  .sw[aria-pressed="true"]::after {
    content: ''; position: absolute; inset: 0; margin: auto;
    width: 38%; height: 20%;
    border-left: 2.5px solid var(--tick); border-bottom: 2.5px solid var(--tick);
    transform: translateY(-15%) rotate(-45deg);
  }

  .custom-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .picker {
    position: relative; width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: conic-gradient(#ff3b3b, #ffb13b, #f4ff3b, #3bff6e, #3bd9ff, #3b53ff, #c13bff, #ff3b9a, #ff3b3b);
    overflow: hidden;
  }
  .picker input { position: absolute; inset: -8px; width: 70px; height: 70px; opacity: 0; cursor: pointer; }
  .hex-wrap { flex: 1; min-width: 0; }
  .hex-label { font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .hex-input {
    width: 100%; padding: 10px 12px; border-radius: 12px;
    background: transparent; border: 1px solid var(--border);
    font-size: 15px; font-weight: 600; letter-spacing: .02em;
  }
  .hex-input.bad { border-color: #F0555C; }
  .hex-hint { font-size: 12px; color: var(--text-2); margin-top: 4px; }

  /* Font */
  .fonts { display: flex; flex-direction: column; }
  .font-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 4px; text-align: start; width: 100%;
  }
  .font-opt:not(:last-child) { border-bottom: 1px solid var(--border); }
  .fo-name { font-size: 13px; color: var(--text-2); margin-bottom: 3px; }
  .fo-sample { font-size: 17px; font-weight: 500; }
  .radio {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--text-2); display: grid; place-items: center;
  }
  .font-opt[aria-checked="true"] .radio,
  .lang-opt[aria-checked="true"] .radio { border-color: var(--accent); }
  .font-opt[aria-checked="true"] .radio::after,
  .lang-opt[aria-checked="true"] .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

  /* Font custom */
  .upload-row { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    padding: 13px 18px; border-radius: 999px; font-weight: 700; font-size: 14px;
    border: 1px solid var(--border); background: transparent; text-align: center;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .btn.danger { color: #F0555C; }
  .btn:active { transform: scale(0.97); }
  .btn[disabled] { opacity: .5; }
  .msg { font-size: 13px; line-height: 1.45; color: var(--text-2); }
  .msg.err { color: #F0555C; }
  .msg.ok { color: var(--accent); }
  .file-name { font-size: 15px; font-weight: 600; word-break: break-all; }

  /* Toggle tebal */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row-title { font-size: 15px; font-weight: 500; }
  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; border-radius: 999px; background: rgba(120,120,128,.36); transition: background .2s ease; cursor: pointer; }
  .slider::before {
    content: ''; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    transition: transform .2s ease;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  [dir="rtl"] .slider::before { left: auto; right: 2px; }
  [dir="rtl"] .switch input:checked + .slider::before { transform: translateX(-20px); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

  .foot-note { font-size: 13px; color: var(--text-2); line-height: 1.5; text-align: center; margin: 4px 8px 14px; }

  body.bold-mode * { font-weight: 700 !important; }

  /* Bottom sheet bahasa */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0; pointer-events: none;
    transition: opacity .28s ease;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    width: 100%; max-width: 560px; margin: 0 auto;
    max-height: 80vh; max-height: 80dvh;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border); border-bottom: 0;
    border-radius: 26px 26px 0 0;
    padding-bottom: var(--safe-bottom);
    transform: translateY(100%);
    visibility: hidden;
    transition: transform .32s cubic-bezier(0.18, 0.85, 0.3, 1), visibility 0s linear .32s;
  }
  .sheet.open {
    transform: translateY(0);
    visibility: visible;
    transition: transform .32s cubic-bezier(0.18, 0.85, 0.3, 1), visibility 0s;
  }
  .sheet-handle { flex: none; padding: 12px 0 8px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .sheet-handle span { width: 40px; height: 5px; border-radius: 999px; background: var(--text-2); opacity: .5; }
  .sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px 8px; }
  .sheet-head h2 { font-size: 18px; font-weight: 800; }
  .sheet-close {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(120,120,128,.2);
  }
  .sheet-close svg { width: 16px; height: 16px; }
  .sheet-list { overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 16px; -webkit-overflow-scrolling: touch; }
  .lang-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: start; padding: 15px 2px;
  }
  .lang-opt:not(:last-child) { border-bottom: 1px solid var(--border); }
  .lo-name { font-size: 16px; font-weight: 600; }
  .lo-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<div class="group">

<div class="group">

</div>

<div class="group">
  <div class="card">
    <div class="row">
      <span class="row-title" data-i18n="bold"></span>
      <label class="switch">
        <input type="checkbox" id="boldToggle" data-i18n-aria="bold">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<div class="foot-note" data-i18n="foot"></div>
<button class="btn danger" id="btnReset" style="width:100%;" data-i18n="reset"></button>

<!-- Bottom sheet pilih bahasa -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="langSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-handle" id="sheetHandle"><span></span></div>
  <div class="sheet-head">
    <h2 id="sheetTitle" data-i18n="lang_sheet"></h2>
    <button class="sheet-close" id="sheetClose" data-i18n-aria="close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <div class="sheet-list" id="langList" role="radiogroup" data-i18n-aria="lang_sheet"></div>
</div>

    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('fonts', mode);
        var result = fn(tx.objectStore('fonts'));
        tx.oncomplete = function () { resolve(result && result.result); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error); };
      });
    });
  }
  var idbPut = function (key, val) { return idbRun('readwrite', function (s) { return s.put(val, key); }); };
  var idbGet = function (key) { return idbRun('readonly', function (s) { return s.get(key); }); };
  var idbDel = function (key) { return idbRun('readwrite', function (s) { return s.delete(key); }); };

  /* ---------- Warna ---------- */
  var DEFAULT_ACCENT = '#F0A529';
  var PALETTE = [
    ['Pink', '#FF5C9D'], ['Pink muda', '#FF8FB8'], ['Magenta', '#E0409A'], ['Merah', '#F0555C'],
    ['Peach', '#FFA98A'], ['Oranye', '#FF7A3D'], ['Kuning', '#F0A529'], ['Emas', '#E8C23A'],
    ['Lime', '#A3DB3D'], ['Hijau', '#34C77B'], ['Tosca', '#1FC8B0'], ['Cyan', '#2BC4E8'],
    ['Biru', '#3D8BFF'], ['Indigo', '#5B6CFF'], ['Ungu', '#9B6BFF'], ['Lavender', '#B79CFF'],
    ['Coklat', '#B07A4F'], ['Abu-abu', '#9AA0A6']
  ];

  function normalizeHex(v) {
    v = (v || '').trim();
    if (v.charAt(0) !== '#') v = '#' + v;
    if (/^#[0-9a-fA-F]{3}$/.test(v)) v = '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
    return /^#[0-9a-fA-F]{6}$/.test(v) ? v.toUpperCase() : null;
  }
  function rgbOf(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function isLight(hex) {
    var c = rgbOf(hex);
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) > 150;
  }

  var accent = normalizeHex(lsGet('bm-accent')) || DEFAULT_ACCENT;

  function applyAccent(hex) {
    var c = rgbOf(hex), s = document.documentElement.style;
    s.setProperty('--accent', hex);
    s.setProperty('--accent-rgb', c.join(', '));
    s.setProperty('--accent-glow', 'rgba(' + c.join(', ') + ', 0.28)');
    s.setProperty('--on-accent', isLight(hex) ? '#1C1B19' : '#FFFFFF');
    $('colorPicker').value = hex.toLowerCase();
    var btns = $('swatches').children;
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', btns[i].dataset.hex === hex ? 'true' : 'false');
    }
  }
  function saveAccent(hex) {
    accent = hex;
    if (hex === DEFAULT_ACCENT) lsDel('bm-accent'); else lsSet('bm-accent', hex);
    applyAccent(hex);
  }

  function buildSwatches() {
    var wrap = $('swatches');
    PALETTE.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'sw';
      b.type = 'button';
      b.style.setProperty('--c', p[1]);
      b.style.setProperty('--tick', isLight(p[1]) ? '#1C1B19' : '#FFFFFF');
      b.dataset.hex = p[1];
      b.setAttribute('aria-label', p[1]);
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () {
        saveAccent(p[1]);
        $('hexInput').value = p[1];
        $('hexInput').classList.remove('bad');
      });
      wrap.appendChild(b);
    });
  }

  $('colorPicker').addEventListener('input', function (e) {
    var hex = normalizeHex(e.target.value);
    if (!hex) return;
    saveAccent(hex);
    $('hexInput').value = hex;
    $('hexInput').classList.remove('bad');
  });
  $('hexInput').addEventListener('input', function (e) {
    var raw = e.target.value;
    var hex = normalizeHex(raw);
    if (hex && raw.replace('#', '').length >= 3) {
      e.target.classList.remove('bad');
      saveAccent(hex);
    } else {
      e.target.classList.toggle('bad', raw.replace('#', '').length > 0);
    }
  });

  /* ---------- Font ---------- */
  var FONTS = [
    { id: 'default', k: 'f_default', stack: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" },
    { id: 'rounded', k: 'f_rounded', stack: "ui-rounded, 'SF Pro Rounded', 'Baloo 2', 'Segoe UI', sans-serif" },
    { id: 'humanis', k: 'f_humanis', stack: "Verdana, Tahoma, Geneva, sans-serif" },
    { id: 'kompak', k: 'f_kompak', stack: "'Arial Narrow', 'Segoe UI', Arial, sans-serif" },
    { id: 'serif', label: 'Serif', stack: "Georgia, 'Times New Roman', Times, serif" },
    { id: 'klasik', k: 'f_klasik', stack: "'Times New Roman', Times, Georgia, serif" },
    { id: 'mono', label: 'Monospace', stack: "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" }
  ];
  var CUSTOM_STACK = "'BMCustom', 'Inter', sans-serif";
  var MAX_FONT_BYTES = 10 * 1024 * 1024;

  var fontId = lsGet('bm-font') || 'default';
  var customName = lsGet('bm-font-custom-name') || '';

  function stackFor(id) {
    if (id === 'custom') return CUSTOM_STACK;
    for (var i = 0; i < FONTS.length; i++) if (FONTS[i].id === id) return FONTS[i].stack;
    return FONTS[0].stack;
  }

  function applyFont(id) {
    var stack = stackFor(id);
    var pv = $('preview');
    var all = pv.querySelectorAll('*');
    pv.style.fontFamily = stack;
    for (var i = 0; i < all.length; i++) all[i].style.fontFamily = stack;
    var opts = $('fonts').querySelectorAll('.font-opt');
    for (var j = 0; j < opts.length; j++) {
      opts[j].setAttribute('aria-checked', opts[j].dataset.id === id ? 'true' : 'false');
    }
  }
  function saveFont(id) {
    fontId = id;
    if (id === 'default') lsDel('bm-font'); else lsSet('bm-font', id);
    applyFont(id);
  }

  function addFontOption(id, label, stack) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'font-opt';
    b.dataset.id = id;
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', 'false');
    b.innerHTML = '<span><div class="fo-name"></div><div class="fo-sample"></div></span><span class="radio"></span>';
    b.querySelector('.fo-name').textContent = label;
    var s = b.querySelector('.fo-sample');
    s.textContent = t('sample');
    s.style.fontFamily = stack;
    b.addEventListener('click', function () { saveFont(id); });
    $('fonts').appendChild(b);
    return b;
  }

  function buildFontList() {
    $('fonts').innerHTML = '';
    FONTS.forEach(function (f) { addFontOption(f.id, f.k ? t(f.k) : f.label, f.stack); });
    if (customName) addFontOption('custom', t('cf_prefix') + customName, CUSTOM_STACK);
  }

  function loadCustomFont(buffer) {
    var face = new FontFace('BMCustom', buffer);
    return face.load().then(function (loaded) { document.fonts.add(loaded); });
  }

  function renderCustomInfo() {
    var info = $('customInfo');
    if (customName) {
      info.className = 'file-name';
      info.textContent = customName;
      $('btnPickFont').textContent = t('cf_change');
      $('btnRemoveFont').hidden = false;
    } else {
      info.className = 'msg';
      info.textContent = t('cf_none');
      $('btnPickFont').textContent = t('cf_pick');
      $('btnRemoveFont').hidden = true;
    }
  }
  function setMsg(text, kind) {
    var m = $('fontMsg');
    m.textContent = text || '';
    m.className = 'msg' + (kind ? ' ' + kind : '');
  }

  $('btnPickFont').addEventListener('click', function () { $('fontFile').click(); });

  $('fontFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!/\.(ttf|otf|woff2?)$/i.test(file.name)) { setMsg(t('m_badfmt'), 'err'); return; }
    if (file.size > MAX_FONT_BYTES) { setMsg(t('m_big'), 'err'); return; }
    setMsg(t('m_loading'));
    var reader = new FileReader();
    reader.onerror = function () { setMsg(t('m_read'), 'err'); };
    reader.onload = function () {
      var buffer = reader.result;
      loadCustomFont(buffer.slice(0)).then(function () {
        return idbPut('custom', { name: file.name, data: buffer });
      }).then(function () {
        customName = file.name;
        lsSet('bm-font-custom-name', customName);
        buildFontList();
        renderCustomInfo();
        saveFont('custom');
        setMsg(t('m_ok'), 'ok');
      }).catch(function () {
        setMsg(t('m_invalid'), 'err');
      });
    };
    reader.readAsArrayBuffer(file);
  });

  $('btnRemoveFont').addEventListener('click', function () {
    idbDel('custom').catch(function () {});
    customName = '';
    lsDel('bm-font-custom-name');
    if (fontId === 'custom') { fontId = 'default'; lsDel('bm-font'); }
    buildFontList();
    renderCustomInfo();
    applyFont(fontId);
    setMsg(t('m_removed'), 'ok');
  });

  /* ---------- Teks tebal ---------- */
  $('boldToggle').checked = lsGet('bm-font-bold') === 'on';
  document.body.classList.toggle('bold-mode', $('boldToggle').checked);
  $('boldToggle').addEventListener('change', function (e) {
    if (e.target.checked) lsSet('bm-font-bold', 'on'); else lsDel('bm-font-bold');
    document.body.classList.toggle('bold-mode', e.target.checked);
  });

  /* ---------- Bahasa ---------- */
  function langLabel() {
    if (langPref === 'default') return t('lang_default');
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].code === langPref) return LANGS[i].name;
    return '';
  }

  function applyI18n() {
    var code = curLang();
    var root = document.documentElement;
    root.lang = code;
    root.dir = RTL[code] ? 'rtl' : 'ltr';

    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    var aria = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < aria.length; j++) aria[j].setAttribute('aria-label', t(aria[j].getAttribute('data-i18n-aria')));

    $('langValue').textContent = langLabel();
    buildFontList();
    renderCustomInfo();
    applyFont(fontId);
    buildLangList();
  }

  function addLangOption(value, name, sub) {
    var checked = langPref === value;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'lang-opt';
    b.dataset.value = value;
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', checked ? 'true' : 'false');
    b.innerHTML = '<span><div class="lo-name"></div><div class="lo-sub"></div></span><span class="radio"></span>';
    b.querySelector('.lo-name').textContent = name;
    var subEl = b.querySelector('.lo-sub');
    if (sub) subEl.textContent = sub; else subEl.remove();
    b.addEventListener('click', function () { chooseLang(value); });
    $('langList').appendChild(b);
  }

  function nativeNameOf(code) {
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].code === code) return LANGS[i].name;
    return '';
  }

  function buildLangList() {
    $('langList').innerHTML = '';
    addLangOption('default', t('lang_default'), nativeNameOf(detectLang()));
    LANGS.forEach(function (l) { addLangOption(l.code, l.name, ''); });
  }

  function chooseLang(value) {
    langPref = value;
    if (value === 'default') lsDel('bm-lang'); else lsSet('bm-lang', value);
    setMsg('');
    applyI18n();
    setTimeout(closeSheet, 160);
  }

  /* ---------- Bottom sheet ---------- */
  var sheet = $('langSheet'), overlay = $('sheetOverlay');
  var sheetOpen = false;

  function openSheet() {
    if (sheetOpen) return;
    sheetOpen = true;
    sheet.style.transform = '';
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    overlay.classList.add('open');
    document.body.classList.add('sheet-open');
    var sel = $('langList').querySelector('[aria-checked="true"]');
    if (sel) {
      try { sel.scrollIntoView({ block: 'center' }); } catch (e) {}
      setTimeout(function () { sel.focus({ preventScroll: true }); }, 340);
    }
  }
  function closeSheet() {
    if (!sheetOpen) return;
    sheetOpen = false;
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    overlay.classList.remove('open');
    document.body.classList.remove('sheet-open');
    $('btnLang').focus({ preventScroll: true });
  }

  $('btnLang').addEventListener('click', openSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  overlay.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  /* geser ke bawah pada handle untuk menutup */
  (function () {
    var h = $('sheetHandle'), drag = null;
    h.addEventListener('pointerdown', function (e) {
      drag = { y: e.clientY, dy: 0 };
      sheet.style.transition = 'none';
      try { h.setPointerCapture(e.pointerId); } catch (err) {}
    });
    h.addEventListener('pointermove', function (e) {
      if (!drag) return;
      drag.dy = Math.max(0, e.clientY - drag.y);
      sheet.style.transform = 'translateY(' + drag.dy + 'px)';
    });
    function end() {
      if (!drag) return;
      var dy = drag.dy;
      drag = null;
      sheet.style.transition = '';
      sheet.style.transform = '';
      if (dy > 90) closeSheet();
    }
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);
  })();

  /* ---------- Reset ---------- */
  $('btnReset').addEventListener('click', function () {
    if (!confirm(t('confirm_reset'))) return;
    lsDel('bm-accent'); lsDel('bm-font'); lsDel('bm-font-bold'); lsDel('bm-font-custom-name');
    idbDel('custom').catch(function () {});
    accent = DEFAULT_ACCENT; fontId = 'default'; customName = '';
    $('boldToggle').checked = false;
    document.body.classList.remove('bold-mode');
    $('hexInput').value = '';
    $('hexInput').classList.remove('bad');
    buildFontList();
    renderCustomInfo();
    applyAccent(accent);
    applyFont(fontId);
    setMsg(t('m_resetdone'), 'ok');
  });

  /* ---------- Kembali ke dashboard (buka lagi layar Settings) ---------- */
  $('btnBack').addEventListener('click', function () {
    try { sessionStorage.setItem('bm-return-settings', '1'); } catch (e) {}
    window.location.href = 'dashboard-admin.html';
  });

  /* ---------- Init ---------- */
  if (lsGet('bm-theme') === 'light') document.body.classList.add('theme-light');

  buildSwatches();
  applyAccent(accent);
  $('hexInput').value = lsGet('bm-accent') ? accent : '';
  applyI18n();

  if (customName) {
    idbGet('custom').then(function (rec) {
      if (rec && rec.data) return loadCustomFont(rec.data.slice(0));
      customName = '';
      lsDel('bm-font-custom-name');
      if (fontId === 'custom') { fontId = 'default'; lsDel('bm-font'); }
      buildFontList();
      renderCustomInfo();
    }).then(function () { applyFont(fontId); }).catch(function () {
      setMsg(t('m_loadfail'), 'err');
    });
  }
})();
</script>
</body>
</html>
