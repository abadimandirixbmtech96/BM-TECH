<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>System Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/bm-theme.js"></script>
<script>
  /* Tema & teks tebal dipasang sebelum halaman tampil supaya tidak berkedip */
  (function () {
    try {
      var r = document.documentElement;
      if (localStorage.getItem('bm-theme') === 'light') r.classList.add('theme-light');
      if (localStorage.getItem('bm-font-bold') === 'on') r.classList.add('bold-mode');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #000000;
    --surface: #121214;
    --border: rgba(255, 255, 255, 0.08);
    --text: #FFFFFF;
    --text-2: #8A8A90;
    --warn: #F5A524;
    --danger: #F0555C;
    --accent: #F0A529;
    --accent-rgb: 240, 165, 41;
    --accent-glow: rgba(240, 165, 41, 0.28);
    --on-accent: #1C1B19;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root.theme-light {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --border: rgba(0, 0, 0, 0.08);
    --text: #000000;
    --text-2: #6E6E73;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    outline: none;
    font-family: var(--bm-font, 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
  }
  [hidden] { display: none !important; }
  input { -webkit-user-select: text; user-select: text; }
  ::selection { background: rgba(var(--accent-rgb), 0.35); color: inherit; }

  html, body { background: var(--bg); color: var(--text); min-height: 100%; }
  body {
    padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 32px) 16px;
    max-width: 560px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  body.sheet-open { overflow: hidden; }
  html.bold-mode * { font-weight: 700 !important; }

  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  .top { display: flex; align-items: center; gap: 12px; padding: 4px 0 18px; }
  .back {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border);
    transition: transform .15s ease;
  }
  .back:active { transform: scale(0.88); }
  .back svg { width: 20px; height: 20px; }
  .top h1 { font-size: 22px; font-weight: 800; }
  [dir="rtl"] .back svg, [dir="rtl"] .chev { transform: scaleX(-1); }

  /* Grup & kartu */
  .group { margin-bottom: 24px; }
  .group-title { font-size: 15px; font-weight: 700; margin: 0 4px 4px; }
  .group-hint { font-size: 13px; color: var(--text-2); margin: 0 4px 10px; line-height: 1.45; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 16px;
  }

  /* Pratinjau */
  .preview { display: flex; flex-direction: column; gap: 12px; }
  .pv-title { font-size: 18px; font-weight: 700; }
  .pv-sub { font-size: 13px; color: var(--text-2); line-height: 1.45; }
  .pv-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pv-btn {
    padding: 10px 18px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
    font-weight: 700; font-size: 14px;
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  .pv-chip {
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(var(--accent-rgb), 0.15); color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.55);
  }
  .pv-amount { margin-inline-start: auto; font-weight: 800; font-size: 16px; }

  /* Baris pemicu bottom sheet (bahasa & font) */
  .pick-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: start; padding: 16px;
    transition: transform .12s ease;
  }
  .pick-row:active { transform: scale(0.99); }
  .pick-value { font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { width: 18px; height: 18px; color: var(--text-2); flex: none; }
  .inline-warn { font-size: 13px; line-height: 1.45; color: var(--warn); margin: 10px 4px 0; }

  /* Palet warna */
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw {
    aspect-ratio: 1; border-radius: 50%;
    background: var(--c);
    position: relative;
    border: 2px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
    transition: transform .15s ease;
  }
  .sw:active { transform: scale(0.88); }
  .sw[aria-pressed="true"] { border-color: var(--text); }
  .sw[aria-pressed="true"]::after {
    content: ''; position: absolute; inset: 0; margin: auto;
    width: 38%; height: 20%;
    border-left: 2.5px solid var(--tick); border-bottom: 2.5px solid var(--tick);
    transform: translateY(-15%) rotate(-45deg);
  }

  .custom { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .custom-label { font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
  .custom-row { display: flex; align-items: center; gap: 12px; }
  .picker {
    position: relative; width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: conic-gradient(#ff3b3b, #ffb13b, #f4ff3b, #3bff6e, #3bd9ff, #3b53ff, #c13bff, #ff3b9a, #ff3b3b);
    overflow: hidden;
  }
  .picker input { position: absolute; inset: -8px; width: 70px; height: 70px; opacity: 0; cursor: pointer; }
  .hex-input {
    flex: 1; min-width: 0; height: 46px; padding: 0 14px; border-radius: 14px;
    background: transparent; border: 1px solid var(--border);
    font-size: 16px; font-weight: 600; letter-spacing: .04em;
  }
  .hex-input:focus { border-color: var(--accent); }
  .hex-input.bad { border-color: var(--danger); }
  .hex-hint { font-size: 12px; color: var(--text-2); margin-top: 8px; line-height: 1.4; }
  .hex-warn { font-size: 12px; color: var(--warn); margin-top: 8px; line-height: 1.4; }

  /* Tombol */
  .btn {
    padding: 13px 18px; border-radius: 999px; font-weight: 700; font-size: 14px;
    border: 1px solid var(--border); background: transparent; text-align: center;
    transition: transform .12s ease, opacity .12s ease;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .btn.danger { color: var(--danger); }
  .btn.danger-fill { background: var(--danger); color: #fff; border-color: transparent; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: .5; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; min-width: 0; }

  .msg { font-size: 13px; line-height: 1.45; color: var(--text-2); margin-top: 10px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }
  .msg.warn { color: var(--warn); }

  /* Toggle */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row-title { font-size: 15px; font-weight: 500; }
  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; border-radius: 999px; background: rgba(120,120,128,.36); transition: background .2s ease; cursor: pointer; }
  .slider::before {
    content: ''; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    transition: transform .2s ease;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  [dir="rtl"] .slider::before { left: auto; right: 2px; }
  [dir="rtl"] .switch input:checked + .slider::before { transform: translateX(-20px); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

  .foot-note { font-size: 13px; color: var(--text-2); line-height: 1.5; text-align: center; margin: 4px 8px 14px; }

  /* Bottom sheet */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0; pointer-events: none;
    transition: opacity .28s ease;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    width: 100%; max-width: 560px; margin: 0 auto;
    max-height: 82vh; max-height: 82dvh;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border); border-bottom: 0;
    border-radius: 26px 26px 0 0;
    padding-bottom: var(--safe-bottom);
    transform: translateY(100%);
    visibility: hidden;
    transition: transform .32s cubic-bezier(0.18, 0.85, 0.3, 1), visibility 0s linear .32s;
  }
  .sheet.open {
    transform: translateY(0);
    visibility: visible;
    transition: transform .32s cubic-bezier(0.18, 0.85, 0.3, 1), visibility 0s;
  }
  .sheet-handle { flex: none; padding: 12px 0 8px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .sheet-handle span { width: 40px; height: 5px; border-radius: 999px; background: var(--text-2); opacity: .5; }
  .sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px 8px; }
  .sheet-head h2 { font-size: 18px; font-weight: 800; }
  .sheet-close {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: rgba(120,120,128,.2);
  }
  .sheet-close svg { width: 16px; height: 16px; }
  .sheet-list { overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 20px; -webkit-overflow-scrolling: touch; }

  .opt {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: start; padding: 14px 2px;
  }
  .opt:not(:last-child) { border-bottom: 1px solid var(--border); }
  .opt:disabled { opacity: .45; }
  .opt-main { min-width: 0; flex: 1; }
  .opt-name { font-size: 16px; font-weight: 600; }
  .opt-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .opt.font .opt-name { font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 3px; word-break: break-all; }
  .opt-sample { font-size: 18px; font-weight: 500; line-height: 1.3; }
  .radio {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--text-2); display: grid; place-items: center;
  }
  .opt[aria-checked="true"] .radio { border-color: var(--accent); }
  .opt[aria-checked="true"] .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

  .sec { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
  .sec-title { font-size: 15px; font-weight: 700; }
  .sec-hint { font-size: 13px; color: var(--text-2); line-height: 1.45; margin: 4px 0 10px; }
  .sec .btn-row { margin-top: 12px; }

  /* Sheet konfirmasi */
  .confirm { padding: 4px 24px 20px; }
  .confirm h2 { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .confirm p { font-size: 14px; color: var(--text-2); line-height: 1.5; margin-bottom: 18px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px); z-index: 120;
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    max-width: calc(100% - 32px);
    padding: 12px 18px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    font-size: 14px; font-weight: 600; text-align: center;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="top">
  <button class="back" id="btnBack" data-i18n-aria="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <h1>System Management</h1>
</div>

<div class="group">
  <div class="card preview">
    <div class="pv-title" data-i18n="preview_title"></div>
    <div class="pv-sub" data-i18n="preview_sub"></div>
    <div class="pv-row">
      <span class="pv-btn" data-i18n="pv_btn"></span>
      <span class="pv-chip">BUKU BESAR</span>
      <span class="pv-amount">Rp1.250.000</span>
    </div>
  </div>
</div>

<div class="group">
  <div class="group-title" data-i18n="lang_title"></div>
  <div class="group-hint" data-i18n="lang_hint"></div>
  <button class="card pick-row" id="btnLang" aria-haspopup="dialog" aria-controls="langSheet">
    <span class="pick-value" id="langValue"></span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<div class="group">
  <div class="group-title" data-i18n="color_title"></div>
  <div class="group-hint" data-i18n="color_hint"></div>
  <div class="card">
    <div class="swatches" id="swatches"></div>
    <div class="custom">
      <div class="custom-label" data-i18n="color_custom"></div>
      <div class="custom-row">
        <label class="picker" data-i18n-aria="pick_aria">
          <input type="color" id="colorPicker" value="#f0a529">
        </label>
        <input class="hex-input" id="hexInput" type="text" inputmode="text" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="#FF5C9D" aria-describedby="hexHint">
      </div>
      <div class="hex-hint" id="hexHint" data-i18n="color_hint2"></div>
      <div class="hex-warn" id="contrastWarn" data-i18n="c_low" hidden></div>
    </div>
  </div>
</div>

<div class="group">
  <div class="group-title" data-i18n="font_title"></div>
  <div class="group-hint" data-i18n="font_hint"></div>
  <button class="card pick-row" id="btnFont" aria-haspopup="dialog" aria-controls="fontSheet">
    <span class="pick-value" id="fontValue"></span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div class="inline-warn" id="fontWarn" data-i18n="m_loadfail" hidden></div>
</div>

<div class="group">
  <div class="card">
    <div class="row">
      <span class="row-title" data-i18n="bold"></span>
      <label class="switch">
        <input type="checkbox" id="boldToggle" data-i18n-aria="bold">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<div class="foot-note" data-i18n="foot"></div>
<button class="btn danger" id="btnReset" style="width:100%;" data-i18n="reset" aria-haspopup="dialog" aria-controls="resetSheet"></button>

<!-- Sheet: bahasa -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="langSheet" role="dialog" aria-modal="true" aria-labelledby="langSheetTitle" aria-hidden="true" tabindex="-1">
  <div class="sheet-handle"><span></span></div>
  <div class="sheet-head">
    <h2 id="langSheetTitle" data-i18n="lang_sheet"></h2>
    <button class="sheet-close" data-close data-i18n-aria="close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <div class="sheet-list" id="langList" role="radiogroup" data-i18n-aria="lang_sheet"></div>
</div>

<!-- Sheet: font -->
<div class="sheet" id="fontSheet" role="dialog" aria-modal="true" aria-labelledby="fontSheetTitle" aria-hidden="true" tabindex="-1">
  <div class="sheet-handle"><span></span></div>
  <div class="sheet-head">
    <h2 id="fontSheetTitle" data-i18n="font_title"></h2>
    <button class="sheet-close" data-close data-i18n-aria="close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <div class="sheet-list">
    <div id="fontList" role="radiogroup" data-i18n-aria="font_title"></div>
    <div class="sec">
      <div class="sec-title" data-i18n="cf_title"></div>
      <div class="sec-hint" data-i18n="cf_hint"></div>
      <div id="customList" role="radiogroup" data-i18n-aria="cf_title"></div>
      <div class="msg" id="customInfo" data-i18n="cf_none"></div>
      <div class="msg warn" id="customWarn" data-i18n="m_loadfail" hidden></div>
      <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" hidden>
      <div class="btn-row">
        <button class="btn primary" id="btnPickFont"></button>
        <button class="btn danger" id="btnRemoveFont" data-i18n="cf_remove" hidden></button>
      </div>
      <div class="msg" id="fontMsg" role="status" aria-live="polite" hidden></div>
    </div>
  </div>
</div>

<!-- Sheet: konfirmasi reset -->
<div class="sheet" id="resetSheet" role="alertdialog" aria-modal="true" aria-labelledby="resetTitle" aria-describedby="resetText" aria-hidden="true" tabindex="-1">
  <div class="sheet-handle"><span></span></div>
  <div class="confirm">
    <h2 id="resetTitle" data-i18n="reset"></h2>
    <p id="resetText" data-i18n="confirm_reset"></p>
    <div class="btn-row">
      <button class="btn" id="resetCancel" data-i18n="cancel"></button>
      <button class="btn danger-fill" id="resetOk" data-i18n="reset"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

    foot: "Эти настройки сохраняются только на этом устройстве. На других устройствах ничего не изменится.", reset: "Сбросить по умолчанию",
    m_loading: "Загрузка шрифта…", m_badfmt: "Формат файла не поддерживается. Выберите файл .ttf, .otf, .woff или .woff2.",
    m_big: "Файл слишком большой (максимум 10 МБ).", m_read: "Не удалось прочитать файл. Выберите его ещё раз.",
    m_ok: "Свой шрифт установлен и используется.", m_invalid: "Это не шрифт или его не удалось сохранить. Попробуйте другой файл.",
    m_removed: "Свой шрифт удалён.", m_resetdone: "Все настройки сброшены.",
    m_loadfail: "Не удалось загрузить свой шрифт. Выберите файл ещё раз.", confirm_reset: "Сбросить цвет и шрифт на этом устройстве?"
  };
  T.ja = {
    cancel: "キャンセル", c_low: "この色は背景とのコントラストが低く、文字やマーカーが見づらくなる場合があります。",
    back: "戻る", close: "閉じる",
    preview_title: "表示プレビュー", preview_sub: "選んだ色とフォントがここにすぐ反映されます。", pv_btn: "保存",
    lang_title: "言語", lang_hint: "このページの表示言語です。", lang_sheet: "言語を選択", lang_default: "端末の設定に合わせる",
    color_title: "システムカラー", color_hint: "管理ダッシュボードのボタン、マーカー、アクセントに使われます。", color_custom: "カスタムカラー",
    color_hint2: "色の円をタップするか、16進コードを入力してください。", pick_aria: "カスタムカラーを選ぶ",
    font_title: "フォント", font_hint: "管理ダッシュボードのすべての文字に適用されます。",
    f_default: "標準 (Inter)", f_rounded: "丸ゴシック", f_humanis: "ヒューマニスト", f_kompak: "コンパクト", f_klasik: "クラシック",
    sample: "取引メモ 1,250,000",
    cf_title: "カスタムフォント", cf_hint: "スマホのストレージからフォントファイル（.ttf、.otf、.woff、.woff2）を選びます。最大10MB。",
    cf_none: "カスタムフォントはまだありません。", cf_pick: "フォントファイルを選ぶ", cf_change: "フォントファイルを変更", cf_remove: "カスタムフォントを削除", cf_prefix: "カスタム：",
    bold: "太字",
    foot: "この設定はこの端末にだけ保存されます。他の端末は変わりません。", reset: "初期設定に戻す",
    m_loading: "フォントを読み込み中…", m_badfmt: "このファイル形式には対応していません。.ttf、.otf、.woff、.woff2 のいずれかを選んでください。",
    m_big: "ファイルが大きすぎます（最大10MB）。", m_read: "ファイルを読み込めませんでした。もう一度選んでください。",
    m_ok: "カスタムフォントを設定しました。", m_invalid: "有効なフォントではないか、保存できませんでした。別のファイルを試してください。",
    m_removed: "カスタムフォントを削除しました。", m_resetdone: "すべての設定を初期状態に戻しました。",
    m_loadfail: "カスタムフォントを読み込めませんでした。ファイルをもう一度選んでください。", confirm_reset: "この端末の色とフォントを初期状態に戻しますか？"
  };

  var RTL = { ar: true };

  function langExists(code) {
    return LANGS.some(function (l) { return l.code === code; });
  }
  function nativeName(code) {
    var l = LANGS.filter(function (x) { return x.code === code; })[0];
    return l ? l.name : '';
  }
  function detectLang() {
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'id'];
    for (var i = 0; i < list.length; i++) {
      var c = String(list[i]).toLowerCase().split('-')[0];
      if (c === 'in') c = 'id';
      if (langExists(c)) return c;
    }
    return 'id';
  }
  var langPref = B.get('bm-lang');
  if (langPref !== 'default' && !langExists(langPref)) langPref = 'default';
  function curLang() { return langPref === 'default' ? detectLang() : langPref; }
  function t(key) {
    var dict = T[curLang()] || T.id;
    return dict[key] != null ? dict[key] : T.id[key];
  }

  /* ---------- Bottom sheet (satu pengendali untuk semua sheet) ---------- */
  var Sheet = (function () {
    var overlay = $('sheetOverlay'), current = null, trigger = null;

    function focusables(el) {
      return Array.prototype.filter.call(
        el.querySelectorAll('button:not(:disabled), input:not(:disabled):not([hidden]), [tabindex]:not([tabindex="-1"])'),
        function (n) { return n.getClientRects().length > 0; }
      );
    }
    function open(el, trig, focusSel) {
      if (current) return;
      current = el;
      trigger = trig || null;
      el.style.transform = '';
      el.classList.add('open');
      el.setAttribute('aria-hidden', 'false');
      overlay.classList.add('open');
      document.body.classList.add('sheet-open');
      var target = focusSel ? el.querySelector(focusSel) : null;
      if (target) { try { target.scrollIntoView({ block: 'center' }); } catch (e) {} }
      setTimeout(function () {
        (target || focusables(el)[0] || el).focus({ preventScroll: true });
      }, 340);
    }
    function close() {
      if (!current) return;
      var el = current;
      current = null;
      el.classList.remove('open');
      el.setAttribute('aria-hidden', 'true');
      overlay.classList.remove('open');
      document.body.classList.remove('sheet-open');
      if (trigger) { trigger.focus({ preventScroll: true }); trigger = null; }
    }

    overlay.addEventListener('click', close);
    document.addEventListener('keydown', function (e) {
      if (!current) return;
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Tab') return;
      var f = focusables(current);
      if (!f.length) { e.preventDefault(); return; }
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === current)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    Array.prototype.forEach.call(document.querySelectorAll('.sheet'), function (sheet) {
      var h = sheet.querySelector('.sheet-handle'), drag = null;
      h.addEventListener('pointerdown', function (e) {
        drag = { y: e.clientY, dy: 0 };
        sheet.style.transition = 'none';
        try { h.setPointerCapture(e.pointerId); } catch (err) {}
      });
      h.addEventListener('pointermove', function (e) {
        if (!drag) return;
        drag.dy = Math.max(0, e.clientY - drag.y);
        sheet.style.transform = 'translateY(' + drag.dy + 'px)';
      });
      function end() {
        if (!drag) return;
        var dy = drag.dy;
        drag = null;
        sheet.style.transition = '';
        sheet.style.transform = '';
        if (dy > 90) close();
      }
      h.addEventListener('pointerup', end);
      h.addEventListener('pointercancel', end);
      Array.prototype.forEach.call(sheet.querySelectorAll('[data-close]'), function (b) { b.addEventListener('click', close); });
    });

    return { open: open, close: close };
  })();

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function toast(text) {
    var el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  /* ---------- Warna ---------- */
  var PALETTE = [
    ['Pink', '#FF5C9D'], ['Pink muda', '#FF8FB8'], ['Magenta', '#E0409A'], ['Merah', '#F0555C'],
    ['Peach', '#FFA98A'], ['Oranye', '#FF7A3D'], ['Kuning', '#F0A529'], ['Emas', '#E8C23A'],
    ['Lime', '#A3DB3D'], ['Hijau', '#34C77B'], ['Tosca', '#1FC8B0'], ['Cyan', '#2BC4E8'],
    ['Biru', '#3D8BFF'], ['Indigo', '#5B6CFF'], ['Ungu', '#9B6BFF'], ['Lavender', '#B79CFF'],
    ['Coklat', '#B07A4F'], ['Abu-abu', '#9AA0A6']
  ];
  var accent = B.getAccent();

  function surfaceHex() { return root.classList.contains('theme-light') ? '#FFFFFF' : '#121214'; }

  function paintAccent() {
    $('colorPicker').value = accent.toLowerCase();
    var btns = $('swatches').children;
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', btns[i].dataset.hex === accent ? 'true' : 'false');
    }
    $('contrastWarn').hidden = B.contrast(accent, surfaceHex()) >= 2.2;
  }
  function setAccent(hex) {
    var saved = B.saveAccent(hex);
    if (!saved) return false;
    accent = saved;
    paintAccent();
    return true;
  }
  function showHex() {
    $('hexInput').value = accent;
    $('hexInput').classList.remove('bad');
  }

  PALETTE.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'sw';
    b.type = 'button';
    b.style.setProperty('--c', p[1]);
    b.style.setProperty('--tick', B.contrast(p[1], '#1C1B19') >= B.contrast(p[1], '#FFFFFF') ? '#1C1B19' : '#FFFFFF');
    b.dataset.hex = p[1];
    b.setAttribute('aria-label', p[1]);
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { setAccent(p[1]); showHex(); });
    $('swatches').appendChild(b);
  });

  $('colorPicker').addEventListener('input', function (e) {
    if (setAccent(e.target.value)) showHex();
  });

  var hexInput = $('hexInput');
  function hexDigits(v) { return v.replace(/^#/, '').trim(); }
  hexInput.addEventListener('input', function () {
    var v = hexDigits(hexInput.value);
    var valid = /^[0-9a-fA-F]*$/.test(v) && v.length <= 6;
    hexInput.classList.toggle('bad', !valid);
    if (valid && v.length === 6) setAccent('#' + v);   /* terapkan hanya saat 6 digit lengkap */
  });
  hexInput.addEventListener('blur', function () {
    var hex = B.normalizeHex(hexDigits(hexInput.value));  /* menerima juga 3 digit (#F0A) */
    if (hex) setAccent(hex);
    showHex();                                            /* kosong/tidak valid → kembali ke warna aktif */
  });
  hexInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') hexInput.blur(); });

  /* ---------- Font ---------- */
  var FONTS = [
    { id: 'default', k: 'f_default' }, { id: 'rounded', k: 'f_rounded' }, { id: 'humanis', k: 'f_humanis' },
    { id: 'kompak', k: 'f_kompak' }, { id: 'serif', label: 'Serif' }, { id: 'klasik', k: 'f_klasik' },
    { id: 'mono', label: 'Monospace' }
  ];
  var state = { font: B.getFont(), custom: B.hasCustom() ? 'pending' : 'none' };
  var ERR = { format: 'm_badfmt', size: 'm_big', read: 'm_read', invalid: 'm_invalid', storage: 'm_invalid' };

  function baseName(n) { return String(n || '').replace(/\.(ttf|otf|woff2?)$/i, ''); }
  function isBroken() { return state.custom === 'missing' || state.custom === 'error'; }
  function fontLabel(id) {
    if (id === 'custom') return baseName(B.customName());
    var f = FONTS.filter(function (x) { return x.id === id; })[0] || FONTS[0];
    return f.k ? t(f.k) : f.label;
  }

  function fontOption(id, label, disabled) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt font';
    b.dataset.id = id;
    b.disabled = !!disabled;
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', state.font === id ? 'true' : 'false');
    b.innerHTML = '<span class="opt-main"><div class="opt-name"></div><div class="opt-sample"></div></span><span class="radio"></span>';
    b.querySelector('.opt-name').textContent = label;
    var s = b.querySelector('.opt-sample');
    s.textContent = t('sample');
    s.style.fontFamily = B.STACKS[id];
    b.addEventListener('click', function () { selectFont(id); });
    return b;
  }

  function paintFontSelection() {
    var opts = document.querySelectorAll('#fontSheet .opt[data-id]');
    for (var i = 0; i < opts.length; i++) {
      opts[i].setAttribute('aria-checked', opts[i].dataset.id === state.font ? 'true' : 'false');
    }
    var fv = $('fontValue');
    fv.textContent = fontLabel(state.font);
    fv.style.fontFamily = B.STACKS[state.font];
    $('fontWarn').hidden = !(state.font === 'custom' && isBroken());
  }

  function renderFontUI() {
    var list = $('fontList');
    list.innerHTML = '';
    FONTS.forEach(function (f) { list.appendChild(fontOption(f.id, f.k ? t(f.k) : f.label, false)); });

    var has = B.hasCustom();
    var cl = $('customList');
    cl.innerHTML = '';
    if (has) cl.appendChild(fontOption('custom', baseName(B.customName()), isBroken()));
    $('customInfo').hidden = has;
    $('customWarn').hidden = !(has && isBroken());
    $('btnPickFont').textContent = has ? t('cf_change') : t('cf_pick');
    $('btnRemoveFont').hidden = !has;
    paintFontSelection();
  }

  function selectFont(id) {
    state.font = B.setFont(id);
    paintFontSelection();
  }

  function setMsg(text, kind) {
    var m = $('fontMsg');
    m.textContent = text || '';
    m.className = 'msg' + (kind ? ' ' + kind : '');
    m.hidden = !text;
  }
  function busy(on) {
    $('btnPickFont').disabled = on;
    $('btnRemoveFont').disabled = on;
  }

  $('btnPickFont').addEventListener('click', function () { $('fontFile').click(); });

  $('fontFile').addEventListener('change', async function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    busy(true);
    setMsg(t('m_loading'));
    try {
      await B.saveCustom(file);
      state.custom = 'ok';
      state.font = B.setFont('custom');
      renderFontUI();
      setMsg(t('m_ok'), 'ok');
    } catch (err) {
      setMsg(t(ERR[err && err.code] || 'm_invalid'), 'err');
    } finally {
      busy(false);
    }
  });

  $('btnRemoveFont').addEventListener('click', async function () {
    busy(true);
    await B.removeCustom();
    state.custom = 'none';
    state.font = B.getFont();
    renderFontUI();
    setMsg(t('m_removed'), 'ok');
    busy(false);
  });

  /* ---------- Teks tebal ---------- */
  $('boldToggle').checked = B.get(B.KEYS.bold) === 'on';
  $('boldToggle').addEventListener('change', function (e) {
    if (e.target.checked) B.set(B.KEYS.bold, 'on'); else B.del(B.KEYS.bold);
    root.classList.toggle('bold-mode', e.target.checked);
  });

  /* ---------- Bahasa ---------- */
  function langOption(value, name, sub) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.dataset.value = value;
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', langPref === value ? 'true' : 'false');
    b.innerHTML = '<span class="opt-main"><div class="opt-name"></div><div class="opt-sub"></div></span><span class="radio"></span>';
    b.querySelector('.opt-name').textContent = name;
    var s = b.querySelector('.opt-sub');
    if (sub) s.textContent = sub; else s.remove();
    b.addEventListener('click', function () { chooseLang(value); });
    return b;
  }
  function renderLangList() {
    var list = $('langList');
    list.innerHTML = '';
    list.appendChild(langOption('default', t('lang_default'), nativeName(detectLang())));
    LANGS.forEach(function (l) { list.appendChild(langOption(l.code, l.name, '')); });
  }
  function chooseLang(value) {
    langPref = value;
    if (value === 'default') B.del('bm-lang'); else B.set('bm-lang', value);
    setMsg('');
    applyI18n();
    setTimeout(Sheet.close, 160);
  }

  function applyI18n() {
    var code = curLang();
    root.lang = code;
    root.dir = RTL[code] ? 'rtl' : 'ltr';
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (n) {
      n.textContent = t(n.getAttribute('data-i18n'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (n) {
      n.setAttribute('aria-label', t(n.getAttribute('data-i18n-aria')));
    });
    $('langValue').textContent = langPref === 'default' ? t('lang_default') : nativeName(langPref);
    renderLangList();
    renderFontUI();
  }

  /* ---------- Pemicu sheet ---------- */
  $('btnLang').addEventListener('click', function () {
    Sheet.open($('langSheet'), $('btnLang'), '#langList [aria-checked="true"]');
  });
  $('btnFont').addEventListener('click', function () {
    setMsg('');
    Sheet.open($('fontSheet'), $('btnFont'), '#fontList [aria-checked="true"]');
  });

  /* ---------- Reset ---------- */
  $('btnReset').addEventListener('click', function () {
    Sheet.open($('resetSheet'), $('btnReset'), '#resetCancel');
  });
  $('resetCancel').addEventListener('click', Sheet.close);
  $('resetOk').addEventListener('click', async function () {
    await B.removeCustom();
    B.del(B.KEYS.bold);
    root.classList.remove('bold-mode');
    $('boldToggle').checked = false;
    accent = B.saveAccent(B.DEFAULT_ACCENT);
    state.font = B.setFont('default');
    state.custom = 'none';
    showHex();
    paintAccent();
    renderFontUI();
    setMsg('');
    Sheet.close();
    toast(t('m_resetdone'));
  });

  /* ---------- Kembali ke dashboard (buka lagi layar Settings) ---------- */
  $('btnBack').addEventListener('click', function () {
    try { sessionStorage.setItem('bm-return-settings', '1'); } catch (e) {}
    window.location.href = 'dashboard-admin.html';
  });

  /* ---------- Init ---------- */
  showHex();
  paintAccent();
  applyI18n();

  /* Pastikan file font custom benar-benar bisa dimuat; kalau hilang, beri tahu — jangan reset diam-diam */
  B.ensureCustom().then(function (status) {
    state.custom = status;
    renderFontUI();
  });
})();
</script>
